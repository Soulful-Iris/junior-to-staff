name: Reader audit delivery
on:
  push:
    branches: [audit-reader-finish-20260923]
    paths: [.audit-delivery/reader.json]
permissions:
  contents: read
concurrency:
  group: audited-chapter-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Soulful-Iris/junior-to-staff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed inputs
        run: |
          mkdir -p "$RUNNER_TEMP/audit-delivery"
          cp .audit-delivery/runner.py "$RUNNER_TEMP/audit-delivery/runner.py"
          cp .audit-delivery/reader.json "$RUNNER_TEMP/audit-delivery/batch.json"
      - name: Test and publish reviewed changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/audit-delivery/runner.py" "$RUNNER_TEMP/audit-delivery/batch.json"
      - name: Record exact source
        if: always()
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/audit-delivery/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-delivery/source-commit.txt"
          git log -120 --format='%H %s' > "$RUNNER_TEMP/audit-delivery/commits.txt"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-delivery/
          retention-days: 7
          if-no-files-found: error
