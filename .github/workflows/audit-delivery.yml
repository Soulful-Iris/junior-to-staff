name: Audited chapter delivery
on:
  push:
    branches: [audit-delivery-20260923]
    paths: [.audit-delivery/batch.json]
permissions:
  contents: read
concurrency:
  group: audited-chapter-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Soulful-Iris/junior-to-staff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed delivery instructions outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/audit-delivery"
          cp .audit-delivery/runner.py "$RUNNER_TEMP/audit-delivery/runner.py"
          python3 - <<'PY'
          import base64, json, os, re, subprocess, zlib
          from pathlib import Path
          def decode(data):
              if 'zlib_base64' in data:
                  return json.loads(zlib.decompress(base64.b64decode(data['zlib_base64'], validate=True)))
              return data
          data = decode(json.loads(Path('.audit-delivery/batch.json').read_text()))
          if 'source_commit' in data:
              sha = data['source_commit']
              if not re.fullmatch('[0-9a-f]{40}', sha):
                  raise ValueError('Full reviewed source commit required')
              source = decode(json.loads(subprocess.check_output(['git', 'show', sha + ':.audit-delivery/batch.json'], text=True)))
              selected = []
              for item in data['selection']:
                  batch = source['batches'][item['index']]
                  batch['tree'] = item.get('tree', batch.get('tree'))
                  batch['tests'] = item.get('tests', batch.get('tests', []))
                  selected.append(batch)
              data = {'base': data['base'], 'batches': selected,
                      'allow_unrelated': data.get('allow_unrelated', False),
                      'prepare': data.get('prepare', [])}
          Path(os.environ['RUNNER_TEMP'], 'audit-delivery', 'batch.json').write_text(json.dumps(data))
          PY
      - name: Apply exact reviewed edits, test, then fast-forward main per chapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/audit-delivery/runner.py" "$RUNNER_TEMP/audit-delivery/batch.json"
      - name: Preserve exact source for reproducible continuation
        if: always()
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/audit-delivery/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-delivery/source-commit.txt"
          git log -100 --format='%H %s' > "$RUNNER_TEMP/audit-delivery/commits.txt"
      - name: Preserve per-chapter receipts and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-delivery/
          retention-days: 7
          if-no-files-found: error
