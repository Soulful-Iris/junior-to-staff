name: Repository verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and install local test dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          git rev-parse HEAD > "$RUNNER_TEMP/verification/source-commit.txt"
          python3 --version > "$RUNNER_TEMP/verification/runtime.txt"
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)' >> "$RUNNER_TEMP/verification/runtime.txt"
          python3 -m pip install -r examples/ai-systems/requirements-test.txt
          python3 -m pip freeze > "$RUNNER_TEMP/verification/dependencies.txt"
      - name: All registered reference suites, including mocked AWS adapters
        run: |
          set -euo pipefail
          python3 scripts/check_curriculum.py --report "$RUNNER_TEMP/verification/python-results.json" 2>&1 | tee "$RUNNER_TEMP/verification/python.log"
      - name: Current catalog, preservation, visual status and source links
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/check_catalog.py --report "$RUNNER_TEMP/verification/catalog.json"
          python3 scripts/check_organization.py --report "$RUNNER_TEMP/verification/preservation.json"
          python3 scripts/check_visuals.py --report "$RUNNER_TEMP/verification/visuals.json"
          python3 docs/check-links.py 2>&1 | tee "$RUNNER_TEMP/verification/source-links.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-${{ github.sha }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 7
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Locked reader dependencies and browser test runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          git rev-parse HEAD > "$RUNNER_TEMP/verification/source-commit.txt"
          python3 -m pip install --require-hashes -r site/requirements.lock
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          npm ci --prefix site/tools --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/typescript" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          node --version > "$RUNNER_TEMP/verification/runtime.txt"
          python3 --version >> "$RUNNER_TEMP/verification/runtime.txt"
          python3 -m pip freeze > "$RUNNER_TEMP/verification/dependencies.txt"
      - name: Reader regressions, complete build and browser scenarios
        env:
          SITE_SCREENSHOTS: ${{ runner.temp }}/verification/screenshots
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site/tests -v 2>&1 | tee "$RUNNER_TEMP/verification/site-tests.log"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/verification/reader.log"
          import os, subprocess
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.executable_path
          env = {**os.environ, 'CHROME_PATH': browser}
          subprocess.run([browser, '--version'], check=True)
          for cmd in (['python3','site/build.py'], ['python3','site/check.py'],
                      ['python3','site/check_reading.py'], ['node','site/tools/browser-check.mjs']):
              print('COMMAND', cmd, flush=True)
              subprocess.run(cmd, env=env, check=True)
          PY
      - name: Bookmark strict types, runtime tests and real HTTP browser checks
        if: always()
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/typescript/node_modules/.bin/tsc" -p curriculum/02-applications/03-frontend/labs/bookmark-editor/tsconfig.json
          node --experimental-strip-types --test curriculum/01-code/02-data-structures-algorithms/typescript.test.ts 2>&1 | tee "$RUNNER_TEMP/verification/typescript-runtime.log"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/verification/bookmark-browser.log"
          import os, subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.executable_path
          root = Path.cwd()
          env = {**os.environ, 'BOOKMARK_CHROMIUM_PATH': browser,
                 'CODEX_PRIMARY_RUNTIME_NODE_MODULES': str(root/'site/tools')}
          cwd = root/'curriculum/02-applications/03-frontend/labs/bookmark-editor'
          subprocess.run(['node','build.mjs'], cwd=cwd, env=env, check=True)
          subprocess.run(['node','tests/browser.mjs'], cwd=cwd, env=env, check=True)
          PY
      - name: Preserve exact rendered inventory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/verification"
          for name in content-inventory.json course.json reader-assets.json; do
            if test -f "site/out/$name"; then cp "site/out/$name" "$RUNNER_TEMP/verification/$name"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reader-${{ github.sha }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 7
  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: lab-only
          POSTGRES_DB: interview_lab
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d interview_lab"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LAB_PG_DSN: postgresql://postgres:lab-only@127.0.0.1:5432/interview_lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record disposable database runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          git rev-parse HEAD > "$RUNNER_TEMP/verification/source-commit.txt"
          python3 -m pip install 'psycopg[binary]>=3,<4'
          python3 -m pip freeze > "$RUNNER_TEMP/verification/dependencies.txt"
          psql "$LAB_PG_DSN" -X -v ON_ERROR_STOP=1 -c 'SELECT version();' > "$RUNNER_TEMP/verification/runtime.txt"
          docker inspect '${{ job.services.postgres.id }}' --format '{{.Image}}' >> "$RUNNER_TEMP/verification/runtime.txt"
      - name: Reproduce failures and fixed transaction invariants
        run: |
          set -euo pipefail
          python3 curriculum/02-applications/02-databases/labs/postgresql/run_schedules.py 2>&1 | tee "$RUNNER_TEMP/verification/schedules.log"
          psql "$LAB_PG_DSN" -X -v ON_ERROR_STOP=1 -f curriculum/02-applications/02-databases/labs/postgresql/plans.sql > "$RUNNER_TEMP/verification/plans.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgresql-${{ github.sha }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 7
