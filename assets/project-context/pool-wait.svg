<svg xmlns="http://www.w3.org/2000/svg" width="520" height="674" viewBox="0 0 520 674" role="img" aria-labelledby="title desc">
<title id="title">Where a slow request spends its time</title><desc id="desc">1. Ask for a connection. 2. Wait 1,700 ms while the pool is busy. 3. Receive an available connection. 4. Run the query: 40 ms. 5. Receive the query result. 6. Other application work totals 160 ms. 1,700 + 40 + 160 = 1,900 ms overall.
The 40 ms query alone hides most of the delay.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#58786c"/></marker></defs>
<rect width="520" height="674" rx="12" fill="#f7faf7"/>
<g font-family="Arial, sans-serif">
<text x="22" y="34" font-size="21" text-anchor="start" fill="#233c34">Where a slow request spends its time</text><text x="22" y="58" font-size="14" text-anchor="start" fill="#5c7067">Numbered order. Animation timing is illustrative.</text><rect x="8" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="65" y="100" font-size="16" text-anchor="middle" fill="#233c34">Request</text><text x="65" y="119" font-size="16" text-anchor="middle" fill="#233c34">handler</text><path d="M65 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="203" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="260" y="100" font-size="16" text-anchor="middle" fill="#233c34">Connection</text><text x="260" y="119" font-size="16" text-anchor="middle" fill="#233c34">pool</text><path d="M260 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="398" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="455" y="100" font-size="16" text-anchor="middle" fill="#233c34">Database</text><path d="M455 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="14" y="138" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="157" font-size="17" text-anchor="start" fill="#356b53">1. Ask for a connection</text><path d="M65 182H260" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M65 182H260" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0083;0.1417;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0083;0.0133;0.1367;0.1417;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="214" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="233" font-size="17" text-anchor="start" fill="#a55535">2. Wait 1,700 ms while the pool is busy</text><path d="M260 254h38v17h-38" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#a55535" opacity="0"><animateMotion path="M260 254h38v17h-38" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1750;0.3083;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1750;0.1800;0.3033;0.3083;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="290" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="309" font-size="17" text-anchor="start" fill="#356b53">3. Receive an available connection</text><path d="M260 334H65" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M260 334H65" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3417;0.4750;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3417;0.3467;0.4700;0.4750;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="366" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="385" font-size="17" text-anchor="start" fill="#356b53">4. Run the query: 40 ms</text><path d="M65 410H455" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M65 410H455" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5083;0.6417;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5083;0.5133;0.6367;0.6417;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="442" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="461" font-size="17" text-anchor="start" fill="#356b53">5. Receive the query result</text><path d="M455 486H65" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M455 486H65" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6750;0.8083;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6750;0.6800;0.8033;0.8083;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="518" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="537" font-size="17" text-anchor="start" fill="#356b53">6. Other application work totals 160 ms</text><path d="M65 558h38v17h-38" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M65 558h38v17h-38" dur="9.600000000000001s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8417;0.9750;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8417;0.8467;0.9700;0.9750;1" dur="9.600000000000001s" repeatCount="indefinite"/></circle><rect x="14" y="612" width="492" height="48" rx="6" fill="#e5eee8"/><text x="24" y="632" font-size="15" text-anchor="start" fill="#233c34">1,700 + 40 + 160 = 1,900 ms overall.</text><text x="24" y="650" font-size="15" text-anchor="start" fill="#233c34">The 40 ms query alone hides most of the delay.</text></g></svg>