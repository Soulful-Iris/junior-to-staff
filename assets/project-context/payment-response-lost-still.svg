<svg xmlns="http://www.w3.org/2000/svg" width="520" height="674" viewBox="0 0 520 674" role="img" aria-labelledby="title desc">
<title id="title">A charge succeeds, but its reply is lost</title><desc id="desc">1. Submit one purchase. 2. Save order and payment identity. 3. Request the charge. 4. Provider charges the card. 5. The response is lost in transit. 6. Record payment outcome as unknown. The missing reply does not mean no charge.
The assignment adds lookup and repair.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#58786c"/></marker></defs>
<rect width="520" height="674" rx="12" fill="#f7faf7"/>
<g font-family="Arial, sans-serif">
<text x="22" y="34" font-size="21" text-anchor="start" fill="#233c34">A charge succeeds, but its reply is lost</text><text x="22" y="58" font-size="14" text-anchor="start" fill="#5c7067">Numbered order. Animation timing is illustrative.</text><rect x="7" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="64" y="100" font-size="16" text-anchor="middle" fill="#233c34">Customer</text><path d="M64 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="138" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="195" y="100" font-size="16" text-anchor="middle" fill="#233c34">Checkout</text><text x="195" y="119" font-size="16" text-anchor="middle" fill="#233c34">API</text><path d="M195 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="269" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="326" y="100" font-size="16" text-anchor="middle" fill="#233c34">Order</text><text x="326" y="119" font-size="16" text-anchor="middle" fill="#233c34">store</text><path d="M326 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="400" y="78" width="114" height="52" rx="7" fill="#e5eee8" stroke="#94b19f"/><text x="457" y="100" font-size="16" text-anchor="middle" fill="#233c34">Payment</text><text x="457" y="119" font-size="16" text-anchor="middle" fill="#233c34">provider</text><path d="M457 132V600" stroke="#cfdbd3" stroke-dasharray="4 6"/><rect x="14" y="138" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="157" font-size="17" text-anchor="start" fill="#356b53">1. Submit one purchase</text><path d="M64 182H195" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="214" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="233" font-size="17" text-anchor="start" fill="#356b53">2. Save order and payment identity</text><path d="M195 258H326" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="290" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="309" font-size="17" text-anchor="start" fill="#356b53">3. Request the charge</text><path d="M195 334H457" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="366" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="385" font-size="17" text-anchor="start" fill="#356b53">4. Provider charges the card</text><path d="M457 406h38v17h-38" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="442" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="461" font-size="17" text-anchor="start" fill="#a55535">5. The response is lost in transit</text><path d="M320 480L332 492M332 480L320 492" stroke="#a55535" stroke-width="3"/><path d="M457 486H326" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="518" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="537" font-size="17" text-anchor="start" fill="#a55535">6. Record payment outcome as unknown</text><path d="M195 562H326" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="612" width="492" height="48" rx="6" fill="#e5eee8"/><text x="24" y="632" font-size="15" text-anchor="start" fill="#233c34">The missing reply does not mean no charge.</text><text x="24" y="650" font-size="15" text-anchor="start" fill="#233c34">The assignment adds lookup and repair.</text></g></svg>