t="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2100;0.3700;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2100;0.2150;0.3650;0.3700;1" dur="8.0s" repeatCount="indefinite"/></circle><rect x="14" y="290" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="309" font-size="17" text-anchor="start" fill="#356b53">3. B claims job 17 as owner 2</text><path d="M455 334H260" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M455 334H260" dur="8.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4100;0.5700;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4100;0.4150;0.5650;0.5700;1" dur="8.0s" repeatCount="indefinite"/></circle><rect x="14" y="366" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="385" font-size="17" text-anchor="start" fill="#356b53">4. B saves the completed result</text><path d="M455 410H260" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#356b53" opacity="0"><animateMotion path="M455 410H260" dur="8.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6100;0.7700;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6100;0.6150;0.7650;0.7700;1" dur="8.0s" repeatCount="indefinite"/></circle><rect x="14" y="442" width="492" height="26" rx="4" fill="#f7faf7"/><text x="22" y="461" font-size="17" text-anchor="start" fill="#a55535">5. A resumes and tries to save old work</text><path d="M65 486H260" fill="none" stroke="#58786c" stroke-width="2" marker-end="url(#arrow)"/><circle r="5" fill="#a55535" opacity="0"><animateMotion path="M65 486H260" dur="8.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8100;0.9700;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8100;0.8150;0.9650;0.9700;1" dur="8.0s" repeatCount="indefinite"/></circle><rect x="14" y="536" width="492" height="48" rx="6" fill="#e5eee8"/><text x="24" y="556" font-size="15" text-anchor="start" fill="#233c34">Which ownership number may save now?</text><text x="24" y="574" font-size="15" text-anchor="start" fill="#233c34">Storage must reject owner 1 after takeover.</text></g></svg>