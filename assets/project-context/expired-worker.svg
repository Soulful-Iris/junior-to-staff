<svg xmlns="http://www.w3.org/2000/svg" width="520" height="598" viewBox="0 0 520 598" role="img" aria-labelledby="title desc">
<title id="title">An old worker returns after a takeover</title><desc id="desc">1. A claims job 17 as owner 1. 2. A pauses and its lease expires. 3. B claims job 17 as owner 2. 4. B saves the completed result. 5. A resumes and tries to save old work. Which ownership number may save now?
Storage must reject owner 1 after takeover.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#58786c"/></marker></defs>
<rect width="520" height="598" rx="12" fill="#f7faf7"/>
<g font-family="Arial, sans-serif">
