<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Expected public form end product</title>
  <desc id="desc">A public contact form beside its owner dashboard, showing accessible fields, server validation, duplicate protection, safe text export, and visible submission status.</desc>
  <defs><filter id="s" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183326" flood-opacity=".13"/></filter><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#20352a}text[fill="#fff"]{fill:#fff}.muted{fill:#728076}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.label{font-size:10px;font-weight:700;letter-spacing:1.1px}.heading{font-family:Georgia,serif;font-size:28px}.title{font-size:16px;font-weight:700}.line{stroke:#dce3d7}.green{fill:#2f6049}.sage{fill:#e9efe4}.paper{fill:#fbfcf8}.white{fill:#fff}</style></defs>
  <rect width="1000" height="620" rx="28" fill="#eef2e9"/><text x="52" y="43" class="label muted">EXPECTED PRODUCT · PUBLIC INPUT TO OWNER EXPORT</text><text x="52" y="76" class="heading">Friendly to a person. Suspicious of every request.</text>
  <g filter="url(#s)"><rect x="52" y="105" width="896" height="465" rx="14" class="paper"/><path d="M52 151h896" class="line"/><circle cx="78" cy="128" r="6" fill="#d98374"/><circle cx="98" cy="128" r="6" fill="#d9b967"/><circle cx="118" cy="128" r="6" fill="#7da379"/><rect x="350" y="118" width="300" height="20" rx="10" fill="#edf0ea"/><text x="440" y="132" class="tiny muted">community.example/contact</text>
    <g transform="translate(84 178)"><text class="label muted">PUBLIC VIEW</text><text y="35" class="heading">Tell us what happened</text><text y="61" class="small muted">We reply within two business days.</text>
      <text y="96" class="small" font-weight="700">Name</text><rect y="106" width="336" height="42" rx="7" class="white" stroke="#ccd7c9"/><text x="13" y="132" class="small">Marisol Vega</text>
      <text y="177" class="small" font-weight="700">Phone</text><rect y="187" width="336" height="42" rx="7" class="white" stroke="#ccd7c9"/><text x="13" y="213" class="small">00123</text>
      <text y="258" class="small" font-weight="700">What should we know?</text><rect y="268" width="336" height="78" rx="7" class="white" stroke="#ccd7c9"/><text x="13" y="294" class="small">The ramp was blocked.</text><text x="13" y="316" class="small">Please call after 3pm.</text>
      <rect y="347" width="142" height="38" rx="7" class="green"/><text x="34" y="371" class="small" fill="#fff" font-weight="700">Send response</text><text x="158" y="370" class="tiny muted">Server validates again</text>
    </g>
    <path d="M455 178v344" class="line"/>
    <g transform="translate(492 178)"><text class="label muted">OWNER VIEW</text><text y="35" class="heading">Responses</text>
      <rect x="290" y="0" width="132" height="38" rx="7" fill="#e2ebdd"/><text x="315" y="24" class="small" font-weight="700">Export safely</text>
      <rect y="65" width="422" height="56" rx="8" fill="#e4efe0"/><circle cx="24" cy="93" r="11" class="green"/><path d="M19 93l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="44" y="88" class="small" font-weight="700">Response saved</text><text x="44" y="106" class="tiny muted">Operation key K accepted once</text>
      <rect y="137" width="422" height="152" rx="8" class="white" stroke="#d5ddd0"/><text x="17" y="163" class="label muted">LATEST SUBMISSION</text><text x="17" y="190" class="title">Marisol Vega</text><text x="17" y="213" class="small">Phone <tspan font-family="ui-monospace,monospace">00123</tspan></text><text x="17" y="238" class="small">The ramp was blocked.</text><text x="17" y="261" class="small">Please call after 3pm.</text><rect x="316" y="174" width="86" height="23" rx="12" fill="#e9efe4"/><text x="334" y="190" class="tiny">accepted</text>
      <g transform="translate(0 298)"><rect width="422" height="90" rx="8" fill="#fff7eb" stroke="#ead5b7"/><text x="16" y="25" class="label" fill="#956a39">EXPORT PREVIEW</text><text x="16" y="49" class="small">Name</text><text x="107" y="49" class="small">Phone as text</text><text x="244" y="49" class="small">Comment as text</text><path d="M16 59h390" stroke="#e4d4bd"/><text x="16" y="78" class="tiny">=1+1 neutralized · 00123 preserved · multiline quoted</text></g>
    </g>
  </g><text x="52" y="602" class="tiny muted">Required behavior: bypassing browser validation still fails safely; duplicate/conflicting operation keys remain observable.</text>
</svg>
