<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Expected shift schedule end product</title>
  <desc id="desc">A weekly role-aware shift schedule with staff assignments, a pending swap request, manager approval, and a reminder that authorization is enforced at the API.</desc>
  <defs><filter id="s" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183326" flood-opacity=".13"/></filter><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#20352a}text[fill="#fff"]{fill:#fff}.muted{fill:#728076}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:10px;font-weight:700;letter-spacing:1.1px}.heading{font-family:Georgia,serif;font-size:28px}.title{font-size:16px;font-weight:700}.line{stroke:#dce3d7}.green{fill:#2f6049}.sage{fill:#e9efe4}.paper{fill:#fbfcf8}.white{fill:#fff}.amber{fill:#f5ead8}</style></defs>
  <rect width="1000" height="620" rx="28" fill="#eef2e9"/><text x="52" y="43" class="label muted">EXPECTED PRODUCT · ROLE-AWARE SCHEDULING</text><text x="52" y="76" class="heading">The interface explains authority. The API enforces it.</text>
  <g filter="url(#s)"><rect x="52" y="105" width="896" height="465" rx="14" class="paper"/><path d="M52 151h896" class="line"/><circle cx="78" cy="128" r="6" fill="#d98374"/><circle cx="98" cy="128" r="6" fill="#d9b967"/><circle cx="118" cy="128" r="6" fill="#7da379"/><rect x="360" y="118" width="282" height="20" rx="10" fill="#edf0ea"/><text x="444" y="132" class="tiny muted">shifts.local/week/38</text>
    <g transform="translate(82 177)"><text class="label muted">WEEK OF SEPTEMBER 21</text><text y="35" class="heading">Your team schedule</text><rect x="690" y="0" width="149" height="42" rx="7" class="green"/><text x="716" y="26" class="small" fill="#fff" font-weight="700">Request a swap</text>
      <g transform="translate(0 66)"><rect width="610" height="274" rx="9" class="white" stroke="#d6ded1"/>
        <rect width="610" height="43" rx="9" fill="#edf2e9"/><text x="26" y="27" class="label muted">TEAM MEMBER</text><text x="175" y="27" class="label muted">MON 21</text><text x="283" y="27" class="label muted">TUE 22</text><text x="391" y="27" class="label muted">WED 23</text><text x="501" y="27" class="label muted">THU 24</text>
        <path d="M0 43h610M0 101h610M0 159h610M0 217h610M151 0v274M260 0v274M368 0v274M477 0v274" class="line"/>
        <circle cx="26" cy="72" r="12" fill="#c88762"/><text x="21" y="76" class="tiny" fill="#fff">A</text><text x="46" y="76" class="small" font-weight="700">Alice</text>
        <rect x="166" y="56" width="80" height="32" rx="6" class="sage"/><text x="179" y="76" class="tiny">9a–5p · Bar</text><rect x="274" y="56" width="80" height="32" rx="6" class="sage"/><text x="287" y="76" class="tiny">9a–5p · Bar</text><rect x="491" y="56" width="101" height="32" rx="6" fill="#f5ead8"/><text x="501" y="76" class="tiny">swap pending</text>
        <circle cx="26" cy="130" r="12" fill="#55799b"/><text x="21" y="134" class="tiny" fill="#fff">B</text><text x="46" y="134" class="small" font-weight="700">Bob</text><rect x="274" y="114" width="80" height="32" rx="6" fill="#e3e9ef"/><text x="287" y="134" class="tiny">5p–close</text><rect x="382" y="114" width="80" height="32" rx="6" fill="#e3e9ef"/><text x="395" y="134" class="tiny">5p–close</text>
        <circle cx="26" cy="188" r="12" fill="#788d5d"/><text x="21" y="192" class="tiny" fill="#fff">C</text><text x="46" y="192" class="small" font-weight="700">Cam</text><rect x="166" y="172" width="80" height="32" rx="6" fill="#e7e3ed"/><text x="179" y="192" class="tiny">prep · 8a</text><rect x="382" y="172" width="80" height="32" rx="6" fill="#e7e3ed"/><text x="395" y="192" class="tiny">prep · 8a</text>
        <text x="24" y="249" class="tiny muted">Staff see assigned shifts and request changes. They do not receive manager mutation controls.</text>
      </g>
      <g transform="translate(631 66)"><rect width="208" height="177" rx="9" fill="#fff7eb" stroke="#e7d4b8"/><text x="16" y="27" class="label" fill="#956a39">PENDING APPROVAL</text><text x="16" y="55" class="title">Alice ↔ Bob</text><text x="16" y="77" class="small">Thursday closing shift</text><text x="16" y="100" class="tiny muted">Coverage remains valid after swap</text><rect x="16" y="119" width="78" height="38" rx="6" class="green"/><text x="32" y="143" class="small" fill="#fff" font-weight="700">Approve</text><rect x="103" y="119" width="88" height="38" rx="6" class="white" stroke="#cfd8cb"/><text x="122" y="143" class="small">Decline</text></g>
      <g transform="translate(631 258)"><rect width="208" height="82" rx="9" fill="#e6eee2" stroke="#d3ddcf"/><text x="15" y="26" class="label">SERVER BOUNDARY</text><text x="15" y="49" class="small">POST /approvals requires</text><text x="15" y="68" class="small">manager role + current version.</text></g>
      <rect y="358" width="839" height="49" rx="8" fill="#f1f4ed"/><circle cx="24" cy="382" r="10" class="green"/><path d="M19 382l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="43" y="386" class="small"><tspan font-weight="700">Audit recorded:</tspan> manager M approved version 17; stale/direct requests return the chosen refusal safely.</text>
