<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Expected receipt tracker end product</title>
  <desc id="desc">A receipt dashboard showing direct upload, visible processing status, reconciled totals, duplicate protection, and an itemized receipt table.</desc>
  <defs><filter id="s" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183326" flood-opacity=".13"/></filter><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#20352a}text[fill="#fff"]{fill:#fff}.muted{fill:#728076}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.label{font-size:10px;font-weight:700;letter-spacing:1.1px}.heading{font-family:Georgia,serif;font-size:28px}.title{font-size:16px;font-weight:700}.line{stroke:#dce3d7}.green{fill:#2f6049}.sage{fill:#e9efe4}.paper{fill:#fbfcf8}.white{fill:#fff}.amber{fill:#f5ead8}</style></defs>
  <rect width="1000" height="620" rx="28" fill="#eef2e9"/><text x="52" y="43" class="label muted">EXPECTED PRODUCT · UPLOAD TO RECONCILED RECORD</text><text x="52" y="76" class="heading">The file is durable before extraction begins.</text>
  <g filter="url(#s)"><rect x="52" y="105" width="896" height="480" rx="14" class="paper"/><path d="M52 151h896" class="line"/><circle cx="78" cy="128" r="6" fill="#d98374"/><circle cx="98" cy="128" r="6" fill="#d9b967"/><circle cx="118" cy="128" r="6" fill="#7da379"/><rect x="365" y="118" width="270" height="20" rx="10" fill="#edf0ea"/><text x="447" y="132" class="tiny muted">receipts.local/inbox</text>
    <rect x="52" y="151" width="205" height="434" fill="#f1f4ed"/><text x="76" y="190" class="label muted">RECEIPTS</text><rect x="67" y="207" width="175" height="42" rx="7" fill="#dfe9da"/><text x="85" y="233" class="small" font-weight="700">Inbox</text><text x="212" y="233" class="tiny">18</text><text x="85" y="280" class="small">Needs review</text><text x="212" y="280" class="tiny">2</text><text x="85" y="319" class="small">Processed</text><text x="207" y="319" class="tiny">146</text><text x="76" y="370" class="label muted">MONTH</text><text x="85" y="402" class="small">September 2026</text>
    <g transform="translate(285 177)"><text class="label muted">SEPTEMBER</text><text y="35" class="heading">Receipt inbox</text><rect x="486" y="0" width="149" height="42" rx="7" class="green"/><text x="516" y="26" class="small" fill="#fff" font-weight="700">+ Upload receipt</text>
      <g transform="translate(0 66)"><rect width="198" height="89" rx="9" class="white" stroke="#d6ded1"/><text x="15" y="23" class="label muted">TOTAL CAPTURED</text><text x="15" y="59" font-family="Georgia" font-size="29">$1,284.72</text><text x="15" y="77" class="tiny muted">17 reconciled receipts</text></g>
      <g transform="translate(213 66)"><rect width="198" height="89" rx="9" class="white" stroke="#d6ded1"/><text x="15" y="23" class="label muted">PROCESSING</text><text x="15" y="59" font-family="Georgia" font-size="29">1</text><text x="42" y="58" class="small muted">durable upload</text><text x="15" y="77" class="tiny muted">status visible · safe to retry</text></g>
      <g transform="translate(426 66)"><rect width="209" height="89" rx="9" fill="#fff7eb" stroke="#e7d4b8"/><text x="15" y="23" class="label" fill="#956a39">NEEDS REVIEW</text><text x="15" y="59" font-family="Georgia" font-size="29">2</text><text x="42" y="58" class="small muted">amount mismatches</text><text x="15" y="77" class="tiny muted">source image retained</text></g>
      <g transform="translate(0 174)"><rect width="635" height="192" rx="9" class="white" stroke="#d6ded1"/><text x="18" y="29" class="label muted">RECEIPT</text><text x="275" y="29" class="label muted">STATUS</text><text x="430" y="29" class="label muted">DATE</text><text x="559" y="29" class="label muted">TOTAL</text><path d="M16 43h603M16 92h603M16 141h603" class="line"/>
        <rect x="18" y="54" width="30" height="27" rx="4" fill="#e9e2d5"/><text x="59" y="71" class="small" font-weight="700">Corner Market</text><rect x="275" y="54" width="86" height="24" rx="12" class="sage"/><text x="292" y="70" class="tiny">reconciled</text><text x="430" y="71" class="small">Sep 18</text><text x="560" y="71" class="small" font-weight="700">$42.18</text>
        <rect x="18" y="103" width="30" height="27" rx="4" fill="#dde6ed"/><text x="59" y="120" class="small" font-weight="700">Rail ticket</text><rect x="275" y="103" width="86" height="24" rx="12" class="amber"/><text x="299" y="119" class="tiny">review</text><text x="430" y="120" class="small">Sep 17</text><text x="560" y="120" class="small" font-weight="700">$18.00</text>
        <rect x="18" y="152" width="30" height="27" rx="4" fill="#e4e0eb"/><text x="59" y="169" class="small" font-weight="700">Hardware Co.</text><rect x="275" y="152" width="86" height="24" rx="12" fill="#e4edf0"/><text x="296" y="168" class="tiny">processing</text><text x="430" y="169" class="small">Sep 17</text><text x="560" y="169" class="small muted">pending</text>
      </g>
      <rect y="371" width="635" height="40" rx="7" fill="#e5eee0"/><text x="17" y="388" class="tiny"><tspan font-weight="700">Duplicate upload:</tspan> same operation key + hash returns receipt 118.</text><text x="17" y="403" class="tiny">No second row or charge is created.</text>
    </g>
  </g><text x="52" y="602" class="tiny muted">Required behavior: storage identity, processing identity, and accounting identity are explicit and independently testable.</text>
</svg>
