<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="title desc"><title id="title">One topic can become one hot partition</title><desc id="desc">One counter serializes a global spike. Partition writes; merge by event-time window.</desc><defs><marker id="arrow-326b50" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="arrow-ac6348" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="880" height="460" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="32" y="43" font-size="23" fill="#20382d" text-anchor="start" font-weight="600">One topic can become one hot partition</text><text x="32" y="86" font-size="12" fill="#ac6348" text-anchor="start" font-weight="bold">WITHOUT THE GUARANTEE</text><text x="32" y="224" font-size="12" fill="#326b50" text-anchor="start" font-weight="bold">WITH THE GUARANTEE</text><rect x="45" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="162.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">100k events/s</text><rect x="318" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="435.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">One topic counter</text><path d="M284 136 L310 136" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="590" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="707.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Writes queue</text><path d="M557 136 L582 136" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="45" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="162.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Salted partials</text><rect x="318" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="435.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Window merge</text><path d="M284 286 L310 286" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><rect x="590" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="707.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Versioned top ten</text><path d="M557 286 L582 286" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><text x="47" y="203" font-size="16" fill="#ac6348" text-anchor="start" font-weight="normal">One counter serializes a global spike.</text><text x="47" y="351" font-size="16" fill="#326b50" text-anchor="start" font-weight="normal">Partition writes; merge by event-time window.</text><path d="M32 380 H848" stroke="#d6dfd4"/><text x="32" y="410" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">NAME THE AUTHORITY</text><text x="240" y="410" font-size="15" fill="#20382d" text-anchor="start" font-weight="normal">What changes state? What survives a retry?</text></svg>