<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">The eight-million-follower fork</title><desc id="desc">Hybrid fanout changes where the multiplication happens.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">The eight-million-follower fork</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Hybrid fanout changes where the multiplication happens.</text><rect x="38" y="167" width="147" height="72" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="111.5" y="209.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">One new post</text><path d="M186 199 H251 V143 H290" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M251 199 V283 H290" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="298" y="113" width="207" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="401.5" y="152.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Ordinary · 500 fans</text><rect x="298" y="262" width="207" height="66" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="401.5" y="301.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Viral · 8m fans</text><path d="M508 144 H602" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M508 293 H602" fill="none" stroke="#ac6348" stroke-width="2.5"  marker-end="url(#bad)"/><rect x="610" y="113" width="245" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="732.5" y="152.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">≈ 500 fanout writes</text><rect x="610" y="262" width="245" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="732.5" y="301.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Merge at read time</text><text x="43" y="374" font-size="18" fill="#ac6348" text-anchor="start" font-weight="normal">Four viral posts × 8 million followers = 32 million candidate writes.</text><text x="43" y="409" font-size="16" fill="#69746c" text-anchor="start" font-weight="normal">The source post remains durable; the feed projection can be rebuilt.</text></svg>