<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">Twenty hits enter, nineteen can be shown</title><desc id="desc">The search index and the access-control source have different freshness contracts.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">Twenty hits enter, nineteen can be shown</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">The search index and the access-control source have different freshness contracts.</text><rect x="35" y="185" width="169" height="68" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="119.5" y="225.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Search query</text><rect x="278" y="185" width="177" height="68" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="366.5" y="225.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Index hits: 20</text><path d="M207 219 H269" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="525" y="164" width="155" height="105" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="602.5" y="222.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Current ACL</text><path d="M458 219 H516" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="742" y="110" width="130" height="64" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="807.0" y="148.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">19 allowed</text><rect x="742" y="265" width="130" height="64" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="807.0" y="303.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">1 denied</text><path d="M682 195 H712 V142 H733" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M682 239 H712 V297 H733" fill="none" stroke="#ac6348" stroke-width="2.5"  marker-end="url(#bad)"/><text x="53" y="316" font-size="17" fill="#326b50" text-anchor="start" font-weight="normal">An index hit is a candidate, never permission to reveal its title or snippet.</text><text x="53" y="368" font-size="15" fill="#69746c" text-anchor="start" font-weight="normal">Index freshness target: 2 min.</text><text x="53" y="399" font-size="15" fill="#69746c" text-anchor="start" font-weight="normal">Revocation target: 1 min. Each read checks the authority.</text></svg>