<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="title desc"><title id="title">Queue progress is not job completion</title><desc id="desc">The ACK and side effect cannot commit together. The next worker verifies output before retrying.</desc><defs><marker id="arrow-326b50" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="arrow-ac6348" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="880" height="460" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="32" y="43" font-size="23" fill="#20382d" text-anchor="start" font-weight="600">Queue progress is not job completion</text><text x="32" y="86" font-size="12" fill="#ac6348" text-anchor="start" font-weight="bold">WITHOUT THE GUARANTEE</text><text x="32" y="224" font-size="12" fill="#326b50" text-anchor="start" font-weight="bold">WITH THE GUARANTEE</text><rect x="52" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="169.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Message delivered</text><rect x="327" y="124" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="444.5" y="161.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Output written</text><path d="M291 136 L319 155" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="600" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="717.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Worker dies</text><path d="M566 155 L592 136" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="52" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="169.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Durable job ID</text><rect x="327" y="274" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="444.5" y="311.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Stable output key</text><path d="M291 286 L319 305" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><rect x="600" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="717.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Versioned status</text><path d="M566 305 L592 286" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><text x="47" y="203" font-size="16" fill="#ac6348" text-anchor="start" font-weight="normal">The ACK and side effect cannot commit together.</text><text x="47" y="351" font-size="16" fill="#326b50" text-anchor="start" font-weight="normal">The next worker verifies output before retrying.</text><path d="M32 380 H848" stroke="#d6dfd4"/><text x="32" y="410" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">NAME THE AUTHORITY</text><text x="240" y="410" font-size="15" fill="#20382d" text-anchor="start" font-weight="normal">What changes state? What survives a retry?</text></svg>