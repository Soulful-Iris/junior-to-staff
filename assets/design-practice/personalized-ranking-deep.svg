<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">A deadline is shared across every box</title><desc id="desc">Example budget: 30 + 100 + 50 + 20 + 30 + 20 = 250 ms.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">A deadline is shared across every box</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Example budget: 30 + 100 + 50 + 20 + 30 + 20 = 250 ms.</text><text x="45" y="133" font-size="20" fill="#20382d" text-anchor="start" font-weight="bold">250 ms P95 request deadline</text><rect x="35" y="171" width="93.60000000000001" height="65" rx="5" fill="#326b50"/><text x="81.80000000000001" y="203" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Candidates</text><text x="81.80000000000001" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">30 ms</text><rect x="129" y="171" width="312.0" height="65" rx="5" fill="#d6e9d9"/><text x="285.0" y="203" font-size="12" fill="#20382d" text-anchor="middle" font-weight="bold">Features</text><text x="285.0" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">100 ms</text><rect x="441" y="171" width="156.0" height="65" rx="5" fill="#326b50"/><text x="519.0" y="203" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Rank</text><text x="519.0" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">50 ms</text><rect x="597" y="171" width="62.400000000000006" height="65" rx="5" fill="#326b50"/><text x="628.2" y="203" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ACL</text><text x="628.2" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">20 ms</text><rect x="659" y="171" width="93.60000000000001" height="65" rx="5" fill="#326b50"/><text x="705.8" y="203" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Network</text><text x="705.8" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">30 ms</text><rect x="753" y="171" width="62.400000000000006" height="65" rx="5" fill="#d6e9d9"/><text x="784.2" y="203" font-size="12" fill="#20382d" text-anchor="middle" font-weight="bold">Slack</text><text x="784.2" y="256" font-size="13" fill="#20382d" text-anchor="middle" font-weight="normal">20 ms</text><text x="45" y="322" font-size="17" fill="#ac6348" text-anchor="start" font-weight="normal">Feature call uses 170 ms instead of 100 → exceed budget by 70 ms.</text><text x="45" y="367" font-size="17" fill="#326b50" text-anchor="start" font-weight="normal">Fallback before expiry; authorization still runs on every result.</text></svg>