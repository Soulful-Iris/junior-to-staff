<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img" aria-labelledby="title desc"><title id="title">Video Processing: AWS services and their architectural roles</title><desc id="desc">Five AWS boxes named together with their general roles: Amazon S3 is upload object store; Amazon SQS is processing queue; AWS Elemental MediaConvert is video transcoder; Amazon DynamoDB is job status authority; Amazon CloudFront is playback CDN.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 9" fill="#2d785a"/></marker></defs><rect x="1" y="1" width="958" height="553" rx="19" fill="#fbfcf8" stroke="#d7e3d8"/><text x="480" y="54" font-size="17" font-weight="bold" text-anchor="middle" fill="#627369">AWS SERVICE / GENERAL ROLE</text><path d="M304 169 L336 169" stroke="#2d785a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M614 169 L646 169" stroke="#2d785a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M786 225 L321 327" stroke="#2d785a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M459 388 L491 388" stroke="#2d785a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="35" y="120" width="265" height="97" rx="12" fill="#eff7ef" stroke="#317755" stroke-width="2"/><text x="167" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#253a32">Amazon S3</text><text x="167" y="188" font-size="15" font-weight="normal" text-anchor="middle" fill="#657369">upload object store</text><rect x="345" y="120" width="265" height="97" rx="12" fill="#eff7ef" stroke="#317755" stroke-width="2"/><text x="477" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#253a32">Amazon SQS</text><text x="477" y="188" font-size="15" font-weight="normal" text-anchor="middle" fill="#657369">processing queue</text><rect x="655" y="120" width="265" height="97" rx="12" fill="#eff7ef" stroke="#317755" stroke-width="2"/><text x="787" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#253a32">AWS Elemental MediaConvert</text><text x="787" y="188" font-size="15" font-weight="normal" text-anchor="middle" fill="#657369">video transcoder</text><rect x="190" y="339" width="265" height="97" rx="12" fill="#eff7ef" stroke="#317755" stroke-width="2"/><text x="322" y="376" font-size="16" font-weight="bold" text-anchor="middle" fill="#253a32">Amazon DynamoDB</text><text x="322" y="407" font-size="15" font-weight="normal" text-anchor="middle" fill="#657369">job status authority</text><rect x="500" y="339" width="265" height="97" rx="12" fill="#eff7ef" stroke="#317755" stroke-width="2"/><text x="632" y="376" font-size="16" font-weight="bold" text-anchor="middle" fill="#253a32">Amazon CloudFront</text><text x="632" y="407" font-size="15" font-weight="normal" text-anchor="middle" fill="#657369">playback CDN</text><text x="480" y="505" font-size="15" font-weight="normal" text-anchor="middle" fill="#52675c">Name which box owns truth; routing, queues and caches are not a transaction.</text></svg>