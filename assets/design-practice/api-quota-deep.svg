<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">Race the last quota token</title><desc id="desc">Two gateways see the same organization and period.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">Race the last quota token</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Two gateways see the same organization and period.</text><rect x="42" y="127" width="194" height="60" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="139.0" y="163.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Gateway A · request 41</text><rect x="42" y="258" width="194" height="60" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="139.0" y="294.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Gateway B · request 42</text><rect x="342" y="190" width="226" height="75" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="455.0" y="233.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Counter: 1 remaining</text><path d="M237 157 H294 V211 H335" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M237 288 H294 V243 H335" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="676" y="130" width="180" height="58" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="766.0" y="165.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">A admits · 0 left</text><rect x="676" y="270" width="180" height="58" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="766.0" y="305.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">B gets 429</text><path d="M570 215 H632 V159 H669" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M570 246 H632 V299 H669" fill="none" stroke="#ac6348" stroke-width="2.5"  marker-end="url(#bad)"/><text x="360" y="370" font-size="17" fill="#326b50" text-anchor="start" font-weight="normal">One atomic update determines the winner.</text><text x="42" y="405" font-size="16" fill="#ac6348" text-anchor="start" font-weight="normal">If each gateway keeps its own counter, both requests see 1 and both pass.</text></svg>