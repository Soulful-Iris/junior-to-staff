<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="title desc"><title id="title">Eligibility comes before rank output: failure timeline</title><desc id="desc">Four event positions reveal the state transition. Users receive a safe response within the deadline.</desc><defs><marker id="arrow-326b50" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="arrow-ac6348" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="880" height="460" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="32" y="43" font-size="23" fill="#20382d" text-anchor="start" font-weight="600">Personalized Ranking · one failure in time</text><text x="32" y="73" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Follow the event that crosses the authority boundary.</text><path d="M156 173 H826" stroke="#a8b8a7" stroke-width="3"/><circle cx="137" cy="173" r="9" fill="#326b50"/><text x="137" y="129" font-size="12" fill="#69746c" text-anchor="middle" font-weight="bold">REQUEST</text><text x="137" y="212" font-size="13" fill="#326b50" text-anchor="middle" font-weight="bold">01</text><rect x="40" y="232" width="194" height="65" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="137.0" y="270.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Deadline 250ms</text><circle cx="340" cy="173" r="9" fill="#326b50"/><text x="340" y="129" font-size="12" fill="#69746c" text-anchor="middle" font-weight="bold">FEATURES</text><text x="340" y="212" font-size="13" fill="#326b50" text-anchor="middle" font-weight="bold">02</text><rect x="243" y="232" width="194" height="65" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="340.0" y="270.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Feature times out</text><circle cx="543" cy="173" r="9" fill="#ac6348"/><text x="543" y="129" font-size="12" fill="#69746c" text-anchor="middle" font-weight="bold">RANKER</text><text x="543" y="212" font-size="13" fill="#ac6348" text-anchor="middle" font-weight="bold">03</text><rect x="446" y="232" width="194" height="65" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="543.0" y="270.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Fallback chosen</text><circle cx="746" cy="173" r="9" fill="#326b50"/><text x="746" y="129" font-size="12" fill="#69746c" text-anchor="middle" font-weight="bold">RESPONSE</text><text x="746" y="212" font-size="13" fill="#326b50" text-anchor="middle" font-weight="bold">04</text><rect x="649" y="232" width="194" height="65" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="746.0" y="270.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Blocked item removed</text><path d="M32 319 H848" stroke="#d6dfd4"/><text x="32" y="352" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">CONSEQUENCE</text><text x="32" y="383" font-size="16" fill="#20382d" text-anchor="start" font-weight="normal">Users receive a safe response within the deadline.</text></svg>