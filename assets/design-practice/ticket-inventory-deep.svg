<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">A12 has a guarded lifecycle</title><desc id="desc">The hold ID is checked again when payment completes.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">A12 has a guarded lifecycle</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">The hold ID is checked again when payment completes.</text><rect x="52" y="166" width="172" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="138.0" y="205.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">AVAILABLE</text><rect x="360" y="166" width="172" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="446.0" y="205.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">HELD · h1</text><rect x="670" y="166" width="172" height="66" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="756.0" y="205.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">SOLD · h1</text><path d="M226 199 H352" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M535 199 H662" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><text x="263" y="165" font-size="14" fill="#326b50" text-anchor="middle" font-weight="normal">CAS</text><text x="582" y="165" font-size="14" fill="#326b50" text-anchor="middle" font-weight="normal">confirm h1</text><path d="M450 235 V324 H140 V241" fill="none" stroke="#ac6348" stroke-width="2.5"  marker-end="url(#bad)"/><text x="290" y="344" font-size="15" fill="#ac6348" text-anchor="middle" font-weight="normal">expiry: release h1 only if still HELD</text><rect x="554" y="315" width="288" height="50" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="698.0" y="346.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Late payment: refund or repair</text><path d="M450 234 V288 H700 V305" fill="none" stroke="#ac6348" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#bad)"/><text x="50" y="407" font-size="16" fill="#69746c" text-anchor="start" font-weight="normal">TTL cleanup may lag. An expiry check at the write decides whether a hold is valid.</text></svg>