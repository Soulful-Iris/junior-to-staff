<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">Spread a hot topic across 100 partials</title><desc id="desc">Partial counts are merged under event-time and deduplication rules.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">Spread a hot topic across 100 partials</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Partial counts are merged under event-time and deduplication rules.</text><rect x="43" y="180" width="190" height="72" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="138.0" y="222.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">100k events / sec</text><text x="290" y="128" font-size="12" fill="#326b50" text-anchor="start" font-weight="bold">SALT BY TOPIC + SHARD</text><rect x="332" y="138" width="201" height="46" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="432.5" y="167.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Shard 1 · ~1k / sec</text><path d="M236 213 H275 V161 H323" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M536 161 H590 V213 H626" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="332" y="200" width="201" height="46" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="432.5" y="229.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Shard 2 · ~1k / sec</text><path d="M236 213 H275 V223 H323" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M536 223 H590 V213 H626" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="332" y="262" width="201" height="46" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="432.5" y="291.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Shard 3 · ~1k / sec</text><path d="M236 213 H275 V285 H323" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M536 285 H590 V213 H626" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="634" y="177" width="205" height="73" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="736.5" y="219.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Event-time merge</text><text x="433" y="350" font-size="15" fill="#326b50" text-anchor="middle" font-weight="normal">… 97 more partials</text><text x="42" y="393" font-size="18" fill="#20382d" text-anchor="start" font-weight="normal">100 shards × ~1,000 events/s each = 100,000 events/s.</text><text x="42" y="425" font-size="15" fill="#69746c" text-anchor="start" font-weight="normal">Dedup IDs and a watermark decide whether late counts revise an early result.</text></svg>