<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">The queue grows by 350 jobs each minute</title><desc id="desc">Steady-state estimate: 50 workers × 3 jobs per minute = 150 completions per minute.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">The queue grows by 350 jobs each minute</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Steady-state estimate: 50 workers × 3 jobs per minute = 150 completions per minute.</text><text x="50" y="112" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">ARRIVALS</text><text x="327" y="112" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">WORKER CAPACITY</text><text x="50" y="172" font-size="25" fill="#20382d" text-anchor="start" font-weight="bold">500 / minute</text><text x="330" y="172" font-size="25" fill="#20382d" text-anchor="start" font-weight="bold">50 workers</text><text x="330" y="202" font-size="16" fill="#69746c" text-anchor="start" font-weight="normal">20 seconds / job → 150 / minute</text><path d="M230 158 H310" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><path d="M630 158 H712" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="716" y="124" width="150" height="70" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="791.0" y="165.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">+350 / min</text><rect x="75" y="290" width="62" height="35" rx="4" fill="#326b50" opacity=".82"/><rect x="173" y="277" width="62" height="48" rx="4" fill="#326b50" opacity=".82"/><rect x="271" y="264" width="62" height="61" rx="4" fill="#326b50" opacity=".82"/><rect x="369" y="251" width="62" height="74" rx="4" fill="#326b50" opacity=".82"/><rect x="467" y="238" width="62" height="87" rx="4" fill="#ac6348" opacity=".82"/><rect x="565" y="225" width="62" height="100" rx="4" fill="#ac6348" opacity=".82"/><rect x="663" y="212" width="62" height="113" rx="4" fill="#ac6348" opacity=".82"/><text x="70" y="379" font-size="16" fill="#20382d" text-anchor="start" font-weight="normal">Queued work grows while accepted jobs outpace completed jobs.</text><text x="70" y="414" font-size="15" fill="#69746c" text-anchor="start" font-weight="normal">Measure oldest job age and admission rate; an empty DLQ does not mean healthy.</text></svg>