<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="title desc"><title id="title">A live socket cannot own durable history</title><desc id="desc">Lost delivery becomes a missing message. Accepted messages replay from stable IDs.</desc><defs><marker id="arrow-326b50" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="arrow-ac6348" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="880" height="460" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="32" y="43" font-size="23" fill="#20382d" text-anchor="start" font-weight="600">A live socket cannot own durable history</text><text x="32" y="86" font-size="12" fill="#ac6348" text-anchor="start" font-weight="bold">WITHOUT THE GUARANTEE</text><text x="32" y="224" font-size="12" fill="#326b50" text-anchor="start" font-weight="bold">WITH THE GUARANTEE</text><rect x="45" y="119" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="162.5" y="156.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Phone sends</text><rect x="328" y="105" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="445.5" y="142.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Socket disconnects</text><path d="M284 150 L320 136" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="600" y="119" width="235" height="63" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="717.5" y="156.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Ben misses text</text><path d="M567 136 L592 150" fill="none" stroke="#ac6348" stroke-width="2.5" marker-end="url(#arrow-ac6348)"/><rect x="45" y="269" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="162.5" y="306.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Idempotent send</text><rect x="328" y="255" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="445.5" y="292.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Room message log</text><path d="M284 300 L320 286" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><rect x="600" y="269" width="235" height="63" rx="10" fill="#eef6ee" stroke="#326b50" stroke-width="2"/><text x="717.5" y="306.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Cursor replay</text><path d="M567 286 L592 300" fill="none" stroke="#326b50" stroke-width="2.5" marker-end="url(#arrow-326b50)"/><text x="47" y="203" font-size="16" fill="#ac6348" text-anchor="start" font-weight="normal">Lost delivery becomes a missing message.</text><text x="47" y="351" font-size="16" fill="#326b50" text-anchor="start" font-weight="normal">Accepted messages replay from stable IDs.</text><path d="M32 380 H848" stroke="#d6dfd4"/><text x="32" y="410" font-size="12" fill="#69746c" text-anchor="start" font-weight="bold">NAME THE AUTHORITY</text><text x="240" y="410" font-size="15" fill="#20382d" text-anchor="start" font-weight="normal">What changes state? What survives a retry?</text></svg>