<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc"><title id="title">Version v9 exists in A and not in B</title><desc id="desc">The point of acknowledgment determines which write can survive total regional loss.</desc><defs><marker id="good" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#326b50"/></marker><marker id="bad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#ac6348"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style><rect width="900" height="450" rx="14" fill="#fbfcf8" stroke="#d6dfd4"/><text x="34" y="43" font-size="24" fill="#20382d" text-anchor="start" font-weight="bold">Version v9 exists in A and not in B</text><text x="34" y="71" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">The point of acknowledgment determines which write can survive total regional loss.</text><rect x="48" y="126" width="235" height="79" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="165.5" y="171.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Region A · committed v9</text><rect x="602" y="126" width="235" height="79" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="719.5" y="171.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Region B · only v8</text><path d="M288 166 H360" fill="none" stroke="#ac6348" stroke-width="2.5"  marker-end="url(#bad)"/><path d="M495 166 H591" fill="none" stroke="#ac6348" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#bad)"/><rect x="368" y="125" width="125" height="79" rx="10" fill="#fcefe8" stroke="#ac6348" stroke-width="2"/><text x="430.5" y="170.5" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">Replication</text><path d="M168 209 V307 H354" fill="none" stroke="#326b50" stroke-width="2.5"  marker-end="url(#good)"/><rect x="364" y="277" width="179" height="70" rx="10" fill="#eff6ee" stroke="#326b50" stroke-width="2"/><text x="453.5" y="318.0" font-size="16" fill="#20382d" text-anchor="middle" font-weight="normal">200 returned</text><path d="M545 314 H604 V235" fill="none" stroke="#ac6348" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#bad)"/><text x="548" y="267" font-size="15" fill="#ac6348" text-anchor="start" font-weight="normal">A fails</text><text x="50" y="389" font-size="17" fill="#20382d" text-anchor="start" font-weight="normal">RPO zero requires v9 to cross the required durable boundary before 200.</text><text x="50" y="419" font-size="14" fill="#69746c" text-anchor="start" font-weight="normal">Failing over routing cannot recover an unreplicated acknowledged write.</text></svg>