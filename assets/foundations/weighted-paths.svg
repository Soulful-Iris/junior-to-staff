<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Fewest edges is not always cheapest</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">All weights here are nonnegative</text>
<rect x="80" y="120" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="130.0" y="152.0" font-size="17" fill="#243b2e" text-anchor="middle">A</text><rect x="555" y="120" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="605.0" y="152.0" font-size="17" fill="#243b2e" text-anchor="middle">B</text><path d="M185 146 L550 146" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="130" font-size="18" fill="#bd6c3e" text-anchor="middle">cost 10</text><rect x="320" y="240" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="370.0" y="272.0" font-size="17" fill="#243b2e" text-anchor="middle">C</text><path d="M180 169 L318 254" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><path d="M423 254 L555 169" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="235" font-size="16" fill="#326b50" text-anchor="middle">cost 1</text><text x="520" y="235" font-size="16" fill="#326b50" text-anchor="middle">cost 1</text><text x="370" y="309" font-size="17" fill="#326b50" text-anchor="middle">A → C → B costs 2</text>
