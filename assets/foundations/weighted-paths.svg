<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Fewest edges is not always cheapest</title><desc id="desc">All weights here are nonnegative. The frontier prioritizes cost; best_cost rejects obsolete heap entries.</desc>
