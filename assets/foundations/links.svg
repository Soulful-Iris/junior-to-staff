<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Keep the rest of the chain reachable</title><desc id="desc">Save the next reference before replacing a link. Object identity matters. Equal values can live in different nodes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Keep the rest of the chain reachable</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Save the next reference before replacing a link</text>
<rect x="80" y="130" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="145.0" y="162.0" font-size="17" fill="#243b2e" text-anchor="middle">4</text><path d="M213 156 L307 156" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="130" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="375.0" y="162.0" font-size="17" fill="#243b2e" text-anchor="middle">9</text><path d="M443 156 L537 156" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="130" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="605.0" y="162.0" font-size="17" fill="#243b2e" text-anchor="middle">None</text><text x="145" y="115" font-size="14" fill="#326b50" text-anchor="middle">current</text><text x="375" y="115" font-size="14" fill="#bd6c3e" text-anchor="middle">following</text><path d="M375 245 L145 245" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="276" font-size="19" fill="#243b2e" text-anchor="middle">After reversal: 9 → 4 → None</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">Object identity matters. Equal values can live in different nodes.</text>
</svg>