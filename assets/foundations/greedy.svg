<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Earliest finish leaves room</title><desc id="desc">Maximize the number of non-overlapping intervals. A greedy rule needs a safety argument tied to the exact objective.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Earliest finish leaves room</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Maximize the number of non-overlapping intervals</text>
<text x="40" y="123" font-size="17" fill="#243b2e" text-anchor="start">long</text><rect x="140" y="95" width="510" height="38" rx="8" fill="#f9eee7" stroke="#bd6c3e"/><text x="395.0" y="120.0" font-size="17" fill="#243b2e" text-anchor="middle">[0, 6)</text><text x="40" y="196" font-size="17" fill="#243b2e" text-anchor="start">select</text><rect x="225" y="166" width="170" height="38" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="310.0" y="191.0" font-size="17" fill="#243b2e" text-anchor="middle">[1, 3)</text><rect x="395" y="166" width="170" height="38" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="480.0" y="191.0" font-size="17" fill="#243b2e" text-anchor="middle">[3, 5)</text><text x="110" y="258" font-size="18" fill="#243b2e" text-anchor="start">Two shorter intervals fit; one long interval blocks both.</text><text x="110" y="290" font-size="14" fill="#6e766d" text-anchor="start">Change the objective to weighted value and the proof changes.</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">A greedy rule needs a safety argument tied to the exact objective.</text>
