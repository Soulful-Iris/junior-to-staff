<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Membership keeps one copy</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Presence and frequency answer different questions</text>
<rect x="70" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="120.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">A</text><rect x="205" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="255.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">A</text><rect x="340" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="390.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">B</text><path d="M465 130 L540 130" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="565" y="105" width="135" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="632.5" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">{A, B}</text><rect x="110" y="230" width="210" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="215.0" y="262.0" font-size="17" fill="#243b2e" text-anchor="middle">A present? Yes</text><rect x="400" y="230" width="250" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="525.0" y="262.0" font-size="17" fill="#243b2e" text-anchor="middle">A count? Not stored</text>
