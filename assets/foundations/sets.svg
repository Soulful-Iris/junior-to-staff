<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Membership keeps one copy</title><desc id="desc">Presence and frequency answer different questions. Choose a counter when repeated occurrences change the answer.</desc>
