<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Sort by a declared key</title><desc id="desc">Stable sorting preserves arrival order among equal keys. A and C share key 2; they keep their original relative order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Sort by a declared key</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Stable sorting preserves arrival order among equal keys</text>
<rect x="130" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="180.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">2 / A</text><rect x="265" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="315.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">1 / B</text><rect x="400" y="105" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="450.0" y="137.0" font-size="17" fill="#243b2e" text-anchor="middle">2 / C</text><path d="M380 167 L380 220" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="180.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">1 / B</text><rect x="265" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="315.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">2 / A</text><rect x="400" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="450.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">2 / C</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">A and C share key 2; they keep their original relative order.</text>
</svg>