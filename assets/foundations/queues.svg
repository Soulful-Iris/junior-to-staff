<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Which work goes next?</title><desc id="desc">The same arrivals A, B, C produce different removal orders. FIFO explores a frontier; LIFO follows the newest unfinished branch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Which work goes next?</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">The same arrivals A, B, C produce different removal orders</text>
<text x="30" y="122" font-size="18" fill="#243b2e" text-anchor="start">FIFO queue</text><rect x="190" y="140" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="240.0" y="172.0" font-size="17" fill="#243b2e" text-anchor="middle">A</text><rect x="325" y="140" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="375.0" y="172.0" font-size="17" fill="#243b2e" text-anchor="middle">B</text><rect x="460" y="140" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="510.0" y="172.0" font-size="17" fill="#243b2e" text-anchor="middle">C</text><path d="M190 166 L110 166" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="204" font-size="14" fill="#326b50" text-anchor="start">A leaves first</text><text x="30" y="253" font-size="18" fill="#243b2e" text-anchor="start">LIFO stack</text><rect x="190" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="240.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">A</text><rect x="325" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="375.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">B</text><rect x="460" y="235" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="510.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">C</text><path d="M565 261 L700 261" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="308" font-size="14" fill="#bd6c3e" text-anchor="start">C leaves first</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">FIFO explores a frontier; LIFO follows the newest unfinished branch.</text>
</svg>