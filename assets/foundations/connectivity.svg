<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Merge components as links arrive</title><desc id="desc">Connectivity does not require storing a route. A representative identifies the current component, not a stable business ID.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Merge components as links arrive</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Connectivity does not require storing a route</text>
<rect x="70" y="110" width="180" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="160.0" y="142.0" font-size="17" fill="#243b2e" text-anchor="middle">{0, 1}</text><rect x="470" y="110" width="180" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="560.0" y="142.0" font-size="17" fill="#243b2e" text-anchor="middle">{2, 3}</text><path d="M250 136 L460 136" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="116" font-size="16" fill="#bd6c3e" text-anchor="middle">union(1, 2)</text><path d="M350 164 L350 224" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="235" width="260" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="360.0" y="267.0" font-size="17" fill="#243b2e" text-anchor="middle">{0, 1, 2, 3}</text><text x="360" y="309" font-size="16" fill="#326b50" text-anchor="middle">find(0) == find(3)</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">A representative identifies the current component, not a stable business ID.</text>
</svg>