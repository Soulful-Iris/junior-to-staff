<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Count work before timing it</title><desc id="desc">Doubling the input from 8 to 16 items. Time counts operations; extra space counts additional retained state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Count work before timing it</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Doubling the input from 8 to 16 items</text>
<text x="42" y="115" font-size="17" fill="#243b2e" text-anchor="start">One scan</text><rect x="245" y="87" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="310.0" y="119.0" font-size="17" fill="#243b2e" text-anchor="middle">8 visits</text><path d="M390 113 L450 113" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="87" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="540.0" y="119.0" font-size="17" fill="#243b2e" text-anchor="middle">16 visits</text><text x="42" y="195" font-size="17" fill="#243b2e" text-anchor="start">Every pair</text><rect x="245" y="167" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="310.0" y="199.0" font-size="17" fill="#243b2e" text-anchor="middle">28 pairs</text><path d="M390 193 L450 193" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="167" width="130" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="540.0" y="199.0" font-size="17" fill="#243b2e" text-anchor="middle">120 pairs</text><text x="42" y="276" font-size="18" fill="#243b2e" text-anchor="start">A scan doubles. Pair comparisons grow much faster.</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">Time counts operations; extra space counts additional retained state.</text>
</svg>