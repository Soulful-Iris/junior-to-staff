<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">A slice owns a half-open range</title><desc id="desc">[start, end) includes start and excludes end. A Python list slice copies the selected entries; assignment shares the list.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">A slice owns a half-open range</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">[start, end) includes start and excludes end</text>
<rect x="95" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="145.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">10</text><rect x="230" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="280.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">20</text><rect x="365" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="415.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">30</text><rect x="500" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="550.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">40</text><text x="145" y="113" font-size="14" fill="#6e766d" text-anchor="middle">0</text><text x="280" y="113" font-size="14" fill="#6e766d" text-anchor="middle">1</text><text x="415" y="113" font-size="14" fill="#6e766d" text-anchor="middle">2</text><text x="550" y="113" font-size="14" fill="#6e766d" text-anchor="middle">3</text><path d="M230 190V205H465V190" fill="none" stroke="#bd6c3e" stroke-width="3"/><text x="347" y="240" font-size="20" fill="#bd6c3e" text-anchor="middle">values[1:3] → [20, 30]</text><text x="347" y="277" font-size="16" fill="#6e766d" text-anchor="middle">length = end − start = 2</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">A Python list slice copies the selected entries; assignment shares the list.</text>
</svg>