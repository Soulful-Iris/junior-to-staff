<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">A prefix is a path; a word has a marker</title><desc id="desc">Insert car, card, and cat. ca is a valid prefix; only terminal markers establish complete words.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">A prefix is a path; a word has a marker</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Insert car, card, and cat</text>
<rect x="35" y="160" width="80" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="75.0" y="192.0" font-size="17" fill="#243b2e" text-anchor="middle">root</text><path d="M115 186 L155 186" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="160" width="70" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="195.0" y="192.0" font-size="17" fill="#243b2e" text-anchor="middle">c</text><path d="M230 186 L270 186" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="160" width="70" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="310.0" y="192.0" font-size="17" fill="#243b2e" text-anchor="middle">a</text><path d="M345 179 L435 122" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="95" width="90" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="485.0" y="127.0" font-size="17" fill="#243b2e" text-anchor="middle">r ●</text><path d="M530 121 L615 121" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="95" width="90" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="665.0" y="127.0" font-size="17" fill="#243b2e" text-anchor="middle">d ●</text><path d="M345 193 L435 253" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="225" width="90" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="485.0" y="257.0" font-size="17" fill="#243b2e" text-anchor="middle">t ●</text><text x="560" y="270" font-size="15" fill="#326b50" text-anchor="start">● complete word</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">ca is a valid prefix; only terminal markers establish complete words.</text>
</svg>