<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">A tree carries inherited constraints</title><desc id="desc">The left subtree of 5 must remain below 5 at every depth. A parent comparison alone cannot validate a binary search tree.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">A tree carries inherited constraints</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">The left subtree of 5 must remain below 5 at every depth</text>
<rect x="320" y="90" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="370.0" y="122.0" font-size="17" fill="#243b2e" text-anchor="middle">5</text><path d="M338 142 L236 190" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><path d="M402 142 L530 190" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="190" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="220.0" y="222.0" font-size="17" fill="#243b2e" text-anchor="middle">3</text><rect x="490" y="190" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="540.0" y="222.0" font-size="17" fill="#243b2e" text-anchor="middle">8</text><path d="M265 228 L352 270" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="250" width="100" height="48" rx="8" fill="#f9eee7" stroke="#bd6c3e"/><text x="410.0" y="280.0" font-size="17" fill="#243b2e" text-anchor="middle">6 ✕</text><text x="70" y="285" font-size="17" fill="#bd6c3e" text-anchor="start">6 &gt; 3, but 6 is not &lt; 5</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">A parent comparison alone cannot validate a binary search tree.</text>
</svg>