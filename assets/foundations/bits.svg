<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">A mask selects independent flags</title><desc id="desc">READ = 001, WRITE = 010, EXECUTE = 100. Compact representation does not remove exponential subset enumeration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">A mask selects independent flags</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">READ = 001, WRITE = 010, EXECUTE = 100</text>
<text x="50" y="136" font-size="17" fill="#243b2e" text-anchor="start">READ | WRITE</text><rect x="310" y="106" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="360.0" y="138.0" font-size="17" fill="#243b2e" text-anchor="middle">0</text><rect x="410" y="106" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="460.0" y="138.0" font-size="17" fill="#243b2e" text-anchor="middle">1</text><rect x="510" y="106" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="560.0" y="138.0" font-size="17" fill="#243b2e" text-anchor="middle">1</text><text x="50" y="224" font-size="17" fill="#243b2e" text-anchor="start">&amp; READ</text><rect x="310" y="194" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="360.0" y="226.0" font-size="17" fill="#243b2e" text-anchor="middle">0</text><rect x="410" y="194" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="460.0" y="226.0" font-size="17" fill="#243b2e" text-anchor="middle">0</text><rect x="510" y="194" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="560.0" y="226.0" font-size="17" fill="#243b2e" text-anchor="middle">1</text><text x="665" y="226" font-size="16" fill="#326b50" text-anchor="start">→ true</text><text x="310" y="287" font-size="17" fill="#243b2e" text-anchor="start">EXECUTE is not enabled.</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">Compact representation does not remove exponential subset enumeration.</text>
</svg>