<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Move a boundary only when order proves it safe</title><desc id="desc">Sorted values [1, 3, 4, 8], target 7. Without sorted order, these pointer movements can discard a valid answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#326b50"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Arial,sans-serif}</style>
<rect width="760" height="380" rx="14" fill="#fafbf7" stroke="#d6ded0"/>
<text x="30" y="42" font-size="23" fill="#243b2e" text-anchor="start">Move a boundary only when order proves it safe</text><text x="30" y="70" font-size="14" fill="#6e766d" text-anchor="start">Sorted values [1, 3, 4, 8], target 7</text>
<rect x="95" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="145.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">1</text><rect x="230" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="280.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">3</text><rect x="365" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="415.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">4</text><rect x="500" y="125" width="100" height="52" rx="8" fill="#edf3e9" stroke="#326b50"/><text x="550.0" y="157.0" font-size="17" fill="#243b2e" text-anchor="middle">8</text><text x="145" y="113" font-size="14" fill="#326b50" text-anchor="middle">left</text><text x="550" y="113" font-size="14" fill="#bd6c3e" text-anchor="middle">right</text><path d="M550 190 L415 190" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="221" font-size="16" fill="#bd6c3e" text-anchor="middle">1 + 8 is too large → move right inward</text><path d="M145 250 L280 250" fill="none" stroke="#326b50" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="290" font-size="17" fill="#243b2e" text-anchor="middle">1 + 4 is too small → move left; 3 + 4 = 7</text>
<path d="M30 320H730" stroke="#d6ded0"/><text x="30" y="350" font-size="15" fill="#6e766d" text-anchor="start">Without sorted order, these pointer movements can discard a valid answer.</text>
</svg>