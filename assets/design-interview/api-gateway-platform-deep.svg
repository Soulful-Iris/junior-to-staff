<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">API gateway: pressure test</title><desc id="desc">A route rule is a production deploy. Trace old and new config through validation, canary traffic, alarm, rollback, and already-started requests. config v42 → validate → 1% canary → latency alarm → restore v41; in-flight requests keep the deadline/config snapshot they started with.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">API gateway: route safely across many teams</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">A route rule is a production deploy. Trace old and new config through validation, canary traffic,</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">alarm, rollback, and already-started requests.</text><rect x="60" y="200" width="185" height="102" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="152.5" y="234" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">v42</text><text x="152.5" y="263" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">validate</text><path d="M247 250 L278 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="282" y="200" width="185" height="102" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="374.5" y="234" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">1%</text><text x="374.5" y="263" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">canary</text><path d="M469 250 L500 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="504" y="200" width="185" height="102" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="596.5" y="234" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">ALARM</text><text x="596.5" y="263" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">rollback</text><path d="M691 250 L722 250" stroke="#af563e" stroke-width="2.5" fill="none" marker-end="url(#r)"/><rect x="726" y="200" width="185" height="102" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="818.5" y="234" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">v41</text><text x="818.5" y="263" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">restore config</text><text x="480" y="390" fill="#af563e" font-size="17" font-weight="700" text-anchor="middle">Already committed data needs a repair plan; a flag cannot undo it.</text></svg>