<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Distributed cache: pressure test</title><desc id="desc">With consistent hashing, adding a node moves only neighboring ring ranges. Draw old/new ownership and a hot key copied to bounded replicas. Hash ring nodes A→B→C→D; adding E splits C→D range only. Hot key K remains on a primary plus controlled replicas; stale refill is rejected by source version.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Distributed cache: recover when one shard leaves</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">With consistent hashing, adding a node moves only neighboring ring ranges. Draw old/new ownership</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">and a hot key copied to bounded replicas.</text><circle cx="480" cy="300" r="180" fill="none" stroke="#9db6a5" stroke-width="3"/><circle cx="480.0" cy="120.0" r="31" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.0" y="126.0" fill="#243c34" font-size="17" font-weight="700" text-anchor="middle">A</text><circle cx="651.2" cy="244.4" r="31" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="651.1901729331277" y="250.37694101250946" fill="#243c34" font-size="17" font-weight="700" text-anchor="middle">B</text><circle cx="585.8" cy="445.6" r="31" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="585.8013454126451" y="451.62305898749054" fill="#243c34" font-size="17" font-weight="700" text-anchor="middle">C</text><circle cx="374.2" cy="445.6" r="31" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="374.19865458735484" y="451.62305898749054" fill="#243c34" font-size="17" font-weight="700" text-anchor="middle">D</text><circle cx="308.8" cy="244.4" r="31" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="308.80982706687234" y="250.3769410125095" fill="#243c34" font-size="17" font-weight="700" text-anchor="middle">E</text><text x="480" y="525" fill="#596b63" font-size="15" font-weight="normal" text-anchor="middle">Adding E remaps its adjacent ring range; hot keys need a separate replica policy.</text></svg>