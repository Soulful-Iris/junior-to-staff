<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Video streaming: pressure test</title><desc id="desc">A single 4K file becomes a bitrate ladder. Show the player switching from 8 Mbps to 2 Mbps while the segment timeline remains aligned. Adaptive ladder: 2160p / 8 Mbps, 1080p / 5 Mbps, 720p / 2 Mbps, 480p / 0.8 Mbps; buffer selects the next segment.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Video streaming: keep playback smooth at the edge</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">A single 4K file becomes a bitrate ladder. Show the player switching from 8 Mbps to 2 Mbps while</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">the segment timeline remains aligned.</text><text x="80" y="177" fill="#243c34" font-size="16" font-weight="700" text-anchor="start">2160p</text><rect x="210" y="148" width="670" height="43" rx="8" fill="#eaf4ed" stroke="#267259"/><text x="905" y="176" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">8 Mbps</text><text x="80" y="255" fill="#243c34" font-size="16" font-weight="700" text-anchor="start">1080p</text><rect x="210" y="226" width="520" height="43" rx="8" fill="#eaf4ed" stroke="#267259"/><text x="755" y="254" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">5 Mbps</text><text x="80" y="333" fill="#243c34" font-size="16" font-weight="700" text-anchor="start">720p</text><rect x="210" y="304" width="360" height="43" rx="8" fill="#eaf4ed" stroke="#267259"/><text x="595" y="332" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">2 Mbps</text><text x="80" y="411" fill="#243c34" font-size="16" font-weight="700" text-anchor="start">480p</text><rect x="210" y="382" width="205" height="43" rx="8" fill="#eaf4ed" stroke="#267259"/><text x="440" y="410" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">0.8 Mbps</text><text x="76" y="493" fill="#243c34" font-size="17" font-weight="600" text-anchor="start">Each aligned segment can switch rendition as bandwidth changes.</text></svg>