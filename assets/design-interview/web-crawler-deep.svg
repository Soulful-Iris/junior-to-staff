<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Web crawler: pressure test</title><desc id="desc">A scheduler needs host-aware fairness: 500k queued URLs from one site must not monopolize workers. Compare global FIFO with per-host due queues. Frontier shards by host; each host lane has next_allowed_at and max_inflight=1. Scheduler picks eligible hosts, not just oldest URL globally.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Web crawler: be fast without attacking one site</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">A scheduler needs host-aware fairness: 500k queued URLs from one site must not monopolize workers.</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Compare global FIFO with per-host due queues.</text><rect x="70" y="150" width="225" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="182.5" y="184" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">site A</text><text x="182.5" y="213" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">500k URLs</text><rect x="530" y="150" width="250" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="655.0" y="184" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">next allowed</text><text x="655.0" y="213" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">12:02:00</text><path d="M305 185 L518 185" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="70" y="253" width="225" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="182.5" y="287" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">site B</text><text x="182.5" y="316" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">120 URLs</text><rect x="530" y="253" width="250" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="655.0" y="287" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">next allowed</text><text x="655.0" y="316" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">12:00:04</text><path d="M305 288 L518 288" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="70" y="356" width="225" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="182.5" y="390" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">site C</text><text x="182.5" y="419" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">9 URLs</text><rect x="530" y="356" width="250" height="71" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="655.0" y="390" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">next allowed</text><text x="655.0" y="419" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">12:00:01</text><path d="M305 391 L518 391" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><text x="482" y="490" fill="#267259" font-size="17" font-weight="700" text-anchor="middle">Choose among eligible hosts, not the largest global queue.</text></svg>