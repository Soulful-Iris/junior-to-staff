<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Ad click aggregator: pressure test</title><desc id="desc">12:03 bucket receives an event at 12:07. Show provisional result, watermark advance, correction and the freshness marker in the dashboard. 12:00–12:01 window count=93 provisional; late event +1 arrives; revised version=94 after watermark policy; raw archive retains both source events.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Ad click aggregator: count late events once</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">12:03 bucket receives an event at 12:07. Show provisional result, watermark advance, correction</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">and the freshness marker in the dashboard.</text><rect x="80" y="158" width="225" height="100" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="192.5" y="192" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">12:00 bucket</text><text x="192.5" y="221" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">93 · provisional</text><path d="M312 207 L412 207" stroke="#af563e" stroke-width="2.5" fill="none" marker-end="url(#r)"/><rect x="422" y="158" width="210" height="100" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="527.0" y="192" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Late event</text><text x="527.0" y="221" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">event time 12:00</text><path d="M640 207 L736 207" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="746" y="158" width="172" height="100" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="832.0" y="192" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Revised</text><text x="832.0" y="221" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">94 · v2</text><path d="M80 333 H919" stroke="#96ab9d" stroke-width="2"/><path d="M305 319 V350 M735 319 V350" stroke="#267259" stroke-width="3"/><text x="307" y="392" fill="#596b63" font-size="15" font-weight="normal" text-anchor="middle">window start</text><text x="737" y="392" fill="#596b63" font-size="15" font-weight="normal" text-anchor="middle">watermark / correction</text></svg>