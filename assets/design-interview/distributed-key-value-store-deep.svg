<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Key-value store: pressure test</title><desc id="desc">An acknowledged write is absent on one replica. Draw quorum intersection, read repair, and why expiring a tombstone too early resurrects a deleted key. 3 replicas A/B/C; write quorum 2 commits on A+B; read quorum 2 intersects any acknowledged write under chosen quorum assumptions; C repairs before tombstone GC.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Key-value store: acknowledge only what survives</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">An acknowledged write is absent on one replica. Draw quorum intersection, read repair, and why</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">expiring a tombstone too early resurrects a deleted key.</text><rect x="170" y="161" width="165" height="95" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="252.5" y="195" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Replica A</text><text x="252.5" y="224" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">ACK write v8</text><rect x="400" y="161" width="165" height="95" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="482.5" y="195" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Replica B</text><text x="482.5" y="224" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">ACK write v8</text><rect x="630" y="161" width="165" height="95" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="712.5" y="195" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Replica C</text><text x="712.5" y="224" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">missed v8</text><path d="M330 272 L576 329" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M560 272 L386 329" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="330" y="343" width="300" height="90" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.0" y="377" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Quorum intersection</text><text x="480.0" y="406" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">read meets A or B; repair C</text><text x="480" y="485" fill="#af563e" font-size="16" font-weight="700" text-anchor="middle">Do not garbage-collect a delete marker before replicas have converged.</text></svg>