<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Online judge: pressure test</title><desc id="desc">A language runtime must not read another submission’s files or reach internal network services. Draw the sandbox boundary and list capabilities denied by default. Internet → API → queue → ephemeral sandbox (CPU/memory/time caps, no network, scratch disk) → result sanitizer → user; secrets stay outside the sandbox.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Online judge: untrusted code gets a small box</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">A language runtime must not read another submission’s files or reach internal network services.</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Draw the sandbox boundary and list capabilities denied by default.</text><rect x="184" y="133" width="582" height="69" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="475.0" y="167" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Public API</text><text x="475.0" y="196" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">size + identity</text><path d="M475 204 L475 218" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="184" y="222" width="582" height="69" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="475.0" y="256" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Durable queue</text><text x="475.0" y="285" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">bounded payload</text><path d="M475 293 L475 307" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="184" y="311" width="582" height="69" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="475.0" y="345" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Ephemeral sandbox</text><text x="475.0" y="374" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">CPU · memory · time</text><path d="M475 382 L475 396" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="184" y="400" width="582" height="69" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="475.0" y="434" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Result checker</text><text x="475.0" y="463" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">no secrets to user</text><text x="482" y="518" fill="#596b63" font-size="16" font-weight="normal" text-anchor="middle">Network denied · filesystem temporary · worker role scoped</text></svg>