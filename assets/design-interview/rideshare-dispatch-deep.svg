<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Ride sharing: pressure test</title><desc id="desc">Drivers occupy moving grid cells, but a cell match is only candidate discovery. Draw neighboring-cell expansion, GPS age, and the later atomic accept decision. 3×3 location cells with rider centered; nearby cells yield candidates, route ETA ranks them, availability reservation happens afterward.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Ride sharing: one driver, one accepted ride</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Drivers occupy moving grid cells, but a cell match is only candidate discovery. Draw neighboring-</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">cell expansion, GPS age, and the later atomic accept decision.</text><rect x="320" y="151" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="366" y="194" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 00</text><rect x="425" y="151" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="471" y="194" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 01</text><rect x="530" y="151" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="576" y="194" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 02</text><rect x="320" y="244" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="366" y="287" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 10</text><rect x="425" y="244" width="92" height="80" rx="8" fill="#fff0ea" stroke="#af563e"/><text x="471" y="287" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">rider</text><rect x="530" y="244" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="576" y="287" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 12</text><rect x="320" y="337" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="366" y="380" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 20</text><rect x="425" y="337" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="471" y="380" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 21</text><rect x="530" y="337" width="92" height="80" rx="8" fill="#e5f4e9" stroke="#267259"/><text x="576" y="380" fill="#243c34" font-size="13" font-weight="normal" text-anchor="middle">cell 22</text><text x="790" y="192" fill="#267259" font-size="15" font-weight="700" text-anchor="start">candidate IDs</text><text x="790" y="224" fill="#267259" font-size="15" font-weight="normal" text-anchor="start">freshness check</text><text x="790" y="256" fill="#267259" font-size="15" font-weight="normal" text-anchor="start">road ETA</text></svg>