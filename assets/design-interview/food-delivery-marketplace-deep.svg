<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Food delivery: pressure test</title><desc id="desc">Search can show stale stock. Follow the read projection into checkout and identify the exact point where the last item is reserved. SEARCHED → RESERVED → AUTHORIZED → ACCEPTED → CAPTURED</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Food delivery: quote the right nearby options</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Search can show stale stock. Follow the read projection into checkout and identify the exact point</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">where the last item is reserved.</text><rect x="115" y="220" width="710" height="128" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="470.0" y="254" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Food delivery</text><text x="470.0" y="283" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">Draw search projection, checkout authority, restaurant </text></svg>