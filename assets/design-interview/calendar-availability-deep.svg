<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Calendar: pressure test</title><desc id="desc">Adjacent intervals are legal; overlapping half-open intervals conflict. Compare 09:00–10:00 against 10:00–11:00 and 09:59–10:30. Two horizontal time bars: [09:00,10:00) and [10:00,11:00) touch without overlap; [09:59,10:30) intersects and is rejected.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Calendar: reserve time without hiding conflicts</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Adjacent intervals are legal; overlapping half-open intervals conflict. Compare 09:00–10:00</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">against 10:00–11:00 and 09:59–10:30.</text><text x="64" y="181" fill="#243c34" font-size="16" font-weight="700" text-anchor="start">Room A</text><text x="65" y="228" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">Booked [09:00,10:00)</text><rect x="310" y="204" width="280" height="38" rx="8" fill="#e8f4eb" stroke="#267259" stroke-width="2"/><text x="65" y="320" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">Adjacent [10:00,11:00)</text><rect x="590" y="296" width="280" height="38" rx="8" fill="#e8f4eb" stroke="#267259" stroke-width="2"/><text x="65" y="412" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">Conflicting [09:59,10:30)</text><rect x="585" y="388" width="145" height="38" rx="8" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="495" y="474" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Half-open [start,end): touching edges are free; overlap is not.</text></svg>