xt-anchor="middle">Amazon Location Service</text><text x="485.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">nearby geometry</text><rect x="665" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="800.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon Aurora</text><text x="800.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">order + stock authority</text><rect x="193" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="328.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon EventBridge</text><text x="328.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">order event routing</text><rect x="508" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="643.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon SQS</text><text x="643.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">work queue</text><text x="44" y="523" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">The product name is shown with its general role. The page explains alternatives and guarantees.</text></svg>