<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">API gateway: AWS service and role boxes</title><desc id="desc">Amazon API Gateway is managed API entry; AWS Lambda is policy hook; Amazon Cognito is identity provider; AWS AppConfig is route policy rollout; Amazon CloudWatch is route telemetry</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="50" fill="#596b63" font-size="15" font-weight="700" text-anchor="start">AWS SERVICE / GENERAL ROLE</text><text x="42" y="87" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">API gateway</text><path d="M330 352 L172 242" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M309 179 L340 179" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M624 179 L655 179" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M172 231 L645 347" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="35" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="170.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon API Gateway</text><text x="170.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">managed API entry</text><rect x="350" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="485.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">AWS Lambda</text><text x="485.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">policy hook</text><rect x="665" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="800.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon Cognito</text><text x="800.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">identity provider</text><rect x="193" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="328.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">AWS AppConfig</text><text x="328.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">route policy rollout</text><rect x="508" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="643.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon CloudWatch</text><text x="643.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">route telemetry</text><text x="44" y="523" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">The product name is shown with its general role. The page explains alternatives and guarantees.</text></svg>