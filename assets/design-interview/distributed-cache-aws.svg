<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Distributed cache: AWS service and role boxes</title><desc id="desc">Amazon ElastiCache for Redis is managed memory cache; Amazon Route 53 is service discovery; Amazon DynamoDB is durable backing data; Amazon CloudWatch is cache telemetry; Amazon ECS is cache client service</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="50" fill="#596b63" font-size="15" font-weight="700" text-anchor="start">AWS SERVICE / GENERAL ROLE</text><text x="42" y="87" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Distributed cache</text><path d="M345 179 L315 179" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M624 179 L655 179" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M172 231 L645 347" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M503 407 L473 407" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="35" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="170.0" y="160" fill="#243c34" font-size="14" font-weight="600" text-anchor="middle">Amazon ElastiCache for</text><text x="170.0" y="179" fill="#243c34" font-size="14" font-weight="600" text-anchor="middle">Redis</text><text x="170.0" y="204" fill="#596b63" font-size="13" font-weight="normal" text-anchor="middle">managed memory cache</text><rect x="350" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="485.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon Route 53</text><text x="485.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">service discovery</text><rect x="665" y="131" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="800.0" y="168" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon DynamoDB</text><text x="800.0" y="199" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">durable backing data</text><rect x="193" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="328.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon CloudWatch</text><text x="328.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">cache telemetry</text><rect x="508" y="359" width="270" height="96" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="643.0" y="396" fill="#243c34" font-size="16" font-weight="600" text-anchor="middle">Amazon ECS</text><text x="643.0" y="427" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">cache client service</text><text x="44" y="523" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">The product name is shown with its general role. The page explains alternatives and guarantees.</text></svg>