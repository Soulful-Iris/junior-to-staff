<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Job scheduler: pressure test</title><desc id="desc">A scheduler’s “exactly once” claim usually fails at the external effect/ack boundary. Show the lease expiry and duplicate delivery after worker crash. SCHEDULED → DUE → LEASED(epoch 8) → RUNNING → SUCCEEDED; lease expires, second worker gets epoch 9, epoch 8 can no longer commit.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Job scheduler: fire once on time, recover after a crash</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">A scheduler’s “exactly once” claim usually fails at the external effect/ack boundary. Show the</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">lease expiry and duplicate delivery after worker crash.</text><rect x="32.0" y="208" width="150" height="84" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="107.0" y="242" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">SCHEDULED</text><text x="107.0" y="271" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">one owned transition</text><path d="M184.0 250 L206.0 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="212.0" y="208" width="150" height="84" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="287.0" y="242" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">DUE</text><text x="287.0" y="271" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">one owned transition</text><path d="M364.0 250 L386.0 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="392.0" y="208" width="150" height="84" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="467.0" y="242" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">LEASED(epoch 8)</text><text x="467.0" y="271" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">one owned transition</text><path d="M544.0 250 L566.0 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="572.0" y="208" width="150" height="84" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="647.0" y="242" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">RUNNING</text><text x="647.0" y="271" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">one owned transition</text><path d="M724.0 250 L746.0 250" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="752.0" y="208" width="150" height="84" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="827.0" y="242" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">SUCCEEDED; lease expires, second worker gets epoch 9, epoch 8 can no longer commit.</text><text x="827.0" y="271" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">one owned transition</text><text x="480" y="390" fill="#596b63" font-size="17" font-weight="600" text-anchor="middle">Every retry reads durable state before creating another side effect.</text></svg>