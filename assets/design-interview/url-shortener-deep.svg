<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">URL shortener: pressure test</title><desc id="desc">Two requests race for one human alias. Follow which conditional write wins and why a cache cannot arbitrate. two writers → unique row → loser conflict; cache is filled only after commit.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">URL shortener: who owns the code?</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Two requests race for one human alias. Follow which conditional write wins and why a cache cannot</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">arbitrate.</text><rect x="78" y="182" width="245" height="93" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="200.5" y="216" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Request A</text><text x="200.5" y="245" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">alias = launch</text><rect x="637" y="182" width="245" height="93" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="759.5" y="216" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Request B</text><text x="759.5" y="245" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">alias = launch</text><path d="M330 224 L413 300" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M635 224 L546 300" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="360" y="304" width="240" height="90" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.0" y="338" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Unique condition</text><text x="480.0" y="367" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">only one create wins</text><path d="M397 400 L285 450" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><path d="M564 400 L700 450" stroke="#af563e" stroke-width="2.5" fill="none" marker-end="url(#r)"/><rect x="72" y="457" width="245" height="66" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="194.5" y="491" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Winner</text><text x="194.5" y="520" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">code reserved</text><rect x="642" y="457" width="245" height="66" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="764.5" y="491" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Loser</text><text x="764.5" y="520" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">409 conflict</text></svg>