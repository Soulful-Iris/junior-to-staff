<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">News aggregator: pressure test</title><desc id="desc">Fanout-on-write can multiply one breaking story into millions of queue tasks. Compare a normal source with one followed by ten million readers. One article → ordinary 1000 feed writes; viral article → 10,000,000 writes. Hybrid path stores story once and merges hot topic at read time.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">News aggregator: freshness without a write storm</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Fanout-on-write can multiply one breaking story into millions of queue tasks. Compare a normal</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">source with one followed by ten million readers.</text><rect x="80" y="175" width="210" height="78" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="185.0" y="209" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">One article</text><text x="185.0" y="238" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">story s42</text><path d="M300 214 L410 214" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="421" y="150" width="214" height="126" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="528.0" y="184" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">ordinary story</text><text x="528.0" y="213" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">1,000 writes</text><path d="M640 214 L747 214" stroke="#af563e" stroke-width="2.5" fill="none" marker-end="url(#r)"/><rect x="757" y="150" width="160" height="126" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="837.0" y="184" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">viral story</text><text x="837.0" y="213" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">10,000,000 writes</text><rect x="250" y="367" width="460" height="93" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.0" y="401" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">hybrid reader</text><text x="480.0" y="430" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">store once; merge hot stories on demand</text><path d="M529 282 L481 356" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/></svg>