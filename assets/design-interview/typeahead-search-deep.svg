<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Typeahead: pressure test</title><desc id="desc">Prefix `iph` maps to a bounded list already ranked offline; extending to `ipho` performs a narrower lookup. Show where personalization can add or remove candidates. root → i → ip → iph; each prefix node points to top-K [iphone, iphones, ...], updated through an immutable index-version swap.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Typeahead: useful suggestions before the next keystroke</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">Prefix `iph` maps to a bounded list already ranked offline; extending to `ipho` performs a</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">narrower lookup. Show where personalization can add or remove candidates.</text><rect x="55" y="210" width="190" height="106" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="150.0" y="244" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">i</text><text x="150.0" y="273" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">ipod · iphone · ipad</text><path d="M247 262 L270 262" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="275" y="210" width="190" height="106" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="370.0" y="244" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">ip</text><text x="370.0" y="273" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">iphone · ipad · ipod</text><path d="M467 262 L490 262" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="495" y="210" width="190" height="106" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="590.0" y="244" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">iph</text><text x="590.0" y="273" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">iphone · iphones · ...</text><path d="M687 262 L710 262" stroke="#267259" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="715" y="210" width="190" height="106" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="810.0" y="244" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">ipho</text><text x="810.0" y="273" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">iphone · iphones · ...</text><text x="480" y="412" fill="#596b63" font-size="17" font-weight="600" text-anchor="middle">Top-K per immutable index version keeps work bounded.</text></svg>