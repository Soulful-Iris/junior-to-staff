<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Metrics platform: pressure test</title><desc id="desc">One unique label per request can turn a handful of measurements into millions of series. Compare bounded labels (region/status) with unbounded IDs. CPU × 300k hosts × 10s ≈ 2.59B samples/day; adding request_id creates near one new series per request and defeats bounded retention/cost.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267259"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#af563e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="19" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="56" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Metrics platform: query the right time window</text><text x="43" y="96" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">One unique label per request can turn a handful of measurements into millions of series. Compare</text><text x="43" y="118" fill="#596b63" font-size="16" font-weight="normal" text-anchor="start">bounded labels (region/status) with unbounded IDs.</text><text x="95" y="155" fill="#596b63" font-size="14" font-weight="700" text-anchor="start">LABELS</text><rect x="80" y="180" width="350" height="91" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="255.0" y="214" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">region × status</text><text x="255.0" y="243" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">bounded combinations</text><rect x="510" y="180" width="350" height="91" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="685.0" y="214" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">request_id</text><text x="685.0" y="243" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">near one series per request</text><text x="254" y="337" fill="#267259" font-size="18" font-weight="700" text-anchor="middle">~few thousand series</text><text x="686" y="337" fill="#af563e" font-size="18" font-weight="700" text-anchor="middle">unbounded cardinality</text><text x="480" y="444" fill="#243c34" font-size="17" font-weight="600" text-anchor="middle">Series count = metric name + every distinct label set.</text></svg>