<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" role="img" aria-labelledby="t d">
<title id="t">LSM write path</title><desc id="d">WAL append, sorted memtable, flush to SSTables, background compaction with TTL; reads consult bloom filters.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#2a1f2e}.l{font-size:11px;fill:#6b5a72}.m{font:700 12px ui-monospace,monospace}.s{font-size:11px}.box{fill:#ffffff;stroke:#a88fb3;stroke-width:1.5}.hot{fill:#f5e6e7;stroke:#8c1f2b;stroke-width:2}.ar{stroke:#a88fb3;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:4 4}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a88fb3"/></marker></defs>
<rect width="880" height="160" rx="16" fill="#f4eef6"/>
<text class="l" x="24" y="30" letter-spacing="2">LSM / WRITE PATH AND READ PATH</text>
<rect class="box" x="24" y="60" width="180" height="48" rx="9"/><text class="m" x="34" y="80">WAL append</text><text class="l" x="34" y="96">durable</text>
<path class="ar" d="M204 84L224 84"/>
<rect class="box" x="224" y="60" width="180" height="48" rx="9"/><text class="m" x="234" y="80">Memtable</text><text class="l" x="234" y="96">sorted, skip list</text>
<path class="ar" d="M404 84L424 84"/>
<rect class="box" x="424" y="60" width="180" height="48" rx="9"/><text class="m" x="434" y="80">Flush</text><text class="l" x="434" y="96">immutable SSTable</text>
<path class="ar" d="M604 84L624 84"/>
<rect class="hot" x="624" y="60" width="180" height="48" rx="9"/><text class="m" x="634" y="80">Compaction</text><text class="l" x="634" y="96">merge sort + TTL</text>
<text class="l" x="24" y="140">Read: memtable → bloom filter per SSTable → newest SSTable that may hold the key. Six of seven calls are writes, so the store is append-only and modifications are new records.</text>
</svg>
