<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-labelledby="t d">
<title id="t">Sensor to cloud</title><desc id="d">Sensors, gateway, sharded Kafka, Go consumers, Threat Graph on LSM stores, detections, with published numbers.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#2a1f2e}.l{font-size:11px;fill:#6b5a72}.m{font:700 12px ui-monospace,monospace}.s{font-size:11px}.box{fill:#ffffff;stroke:#a88fb3;stroke-width:1.5}.hot{fill:#f5e6e7;stroke:#8c1f2b;stroke-width:2}.ar{stroke:#a88fb3;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:4 4}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a88fb3"/></marker></defs>
<rect width="960" height="170" rx="16" fill="#f4eef6"/>
<text class="l" x="24" y="30" letter-spacing="2">SENSOR TO CLOUD / PUBLISHED NUMBERS</text>
<rect class="box" x="24" y="70" width="140" height="48" rx="9"/><text class="m" x="34" y="90">Sensors</text><text class="l" x="34" y="106">400+ event types</text>
<path class="ar" d="M164 94L178 94"/>
<rect class="box" x="178" y="70" width="140" height="48" rx="9"/><text class="m" x="188" y="90">Gateway</text><text class="l" x="188" y="106">authn, quota</text>
<path class="ar" d="M318 94L332 94"/>
<rect class="hot" x="332" y="70" width="140" height="48" rx="9"/><text class="m" x="342" y="90">Kafka shards</text><text class="l" x="342" y="106">1T events/day</text>
<path class="ar" d="M472 94L486 94"/>
<rect class="box" x="486" y="70" width="140" height="48" rx="9"/><text class="m" x="496" y="90">Go consumers</text><text class="l" x="496" y="106">commit after batch</text>
<path class="ar" d="M626 94L640 94"/>
<rect class="hot" x="640" y="70" width="140" height="48" rx="9"/><text class="m" x="650" y="90">Threat Graph</text><text class="l" x="650" y="106">LSM, 40 PB, 6/7 writes</text>
<path class="ar" d="M780 94L794 94"/>
<rect class="box" x="794" y="70" width="140" height="48" rx="9"/><text class="m" x="804" y="90">Detections</text><text class="l" x="804" y="106">3.5M decisions/s</text>
<text class="l" x="24" y="150">Consumers: 3 runtime retries × 5 redrives → dead-letter; throttle weighted to failures; halt at a threshold. 300+ microservices; lag is the SLI.</text>
</svg>
