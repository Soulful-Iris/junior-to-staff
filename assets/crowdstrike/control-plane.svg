<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d">
<title id="t">Endpoint control plane</title><desc id="d">Hosts heartbeat through a gateway into inventory; policy and command services reply on heartbeat; a debug timeline and coverage view join it all.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#2a1f2e}.l{font-size:11px;fill:#6b5a72}.m{font:700 12px ui-monospace,monospace}.s{font-size:11px}.box{fill:#ffffff;stroke:#a88fb3;stroke-width:1.5}.hot{fill:#f5e6e7;stroke:#8c1f2b;stroke-width:2}.ar{stroke:#a88fb3;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:4 4}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a88fb3"/></marker></defs>
<rect width="760" height="250" rx="16" fill="#f4eef6"/>
<text class="l" x="24" y="30" letter-spacing="2">ENDPOINT CONTROL PLANE / INVENTORY, POLICY, COMMANDS, DEBUG</text>
<rect class="box" x="24" y="60" width="120" height="48" rx="9"/><text class="m" x="34" y="80">Hosts</text><text class="l" x="34" y="96">heartbeat 5 min</text>
<path class="ar" d="M144 84L180 84"/>
<rect class="box" x="180" y="60" width="130" height="48" rx="9"/><text class="m" x="190" y="80">Gateway</text>
<path class="ar" d="M310 84L346 84"/>
<rect class="box" x="346" y="60" width="150" height="48" rx="9"/><text class="m" x="356" y="80">Inventory upsert</text><text class="l" x="356" y="96">+ timeline append</text>
<rect class="box" x="346" y="130" width="150" height="44" rx="9"/><text class="m" x="356" y="150">Policy service</text><text class="l" x="356" y="166">groups → version</text>
<rect class="box" x="346" y="190" width="150" height="44" rx="9"/><text class="m" x="356" y="210">Command fan-out</text><text class="l" x="356" y="226">idempotent by (host, id)</text>
<path class="ar dash" d="M310 100L346 152"/>
<path class="ar dash" d="M310 104L346 212"/>
<rect class="box" x="560" y="60" width="170" height="48" rx="9"/><text class="m" x="570" y="80">Debug timeline</text><text class="l" x="570" y="96">per host, 24 h</text>
<path class="ar" d="M496 84L560 84"/>
<rect class="box" x="560" y="130" width="170" height="44" rx="9"/><text class="m" x="570" y="150">Coverage &amp; acks</text>
<path class="ar" d="M496 152L560 152"/>
</svg>
