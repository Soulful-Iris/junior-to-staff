<path class="ar dash" d="M377.0 108L377.0 143"/>
<path class="ar dash" d="M619.0 108L619.0 143"/>
<path class="ar dash" d="M861.0 108L628 143"/>
<path class="ar dash" d="M135.0 230L372 187"/>
<path class="ar dash" d="M377.0 230L377.0 187"/>
<path class="ar dash" d="M619.0 230L619.0 187"/>
