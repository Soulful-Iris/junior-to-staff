<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" role="img" aria-labelledby="t d">
<title id="t">Building blocks</title><desc id="d">Gateway, queue, processor, hot store, query along the main path with cache, search, cold tier, control plane, and observability beside it.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#2a1f2e}.l{font-size:11px;fill:#6b5a72}.m{font:700 12px ui-monospace,monospace}.s{font-size:11px}.box{fill:#ffffff;stroke:#a88fb3;stroke-width:1.5}.hot{fill:#f5e6e7;stroke:#8c1f2b;stroke-width:2}.ar{stroke:#a88fb3;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:4 4}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a88fb3"/></marker></defs>
<rect width="880" height="230" rx="16" fill="#f4eef6"/>
<text class="l" x="24" y="30" letter-spacing="2">BUILDING BLOCKS / A TYPICAL MAIN PATH AND ITS SIDE BLOCKS</text>
<rect class="box" x="24" y="80" width="150" height="48" rx="9"/><text class="m" x="34" y="100">Gateway</text><text class="l" x="34" y="116">authn · rate limit</text>
<path class="ar" d="M174 104L192 104"/>
<rect class="box" x="192" y="80" width="150" height="48" rx="9"/><text class="m" x="202" y="100">Queue</text><text class="l" x="202" y="116">partition by key</text>
<path class="ar" d="M342 104L360 104"/>
<rect class="box" x="360" y="80" width="150" height="48" rx="9"/><text class="m" x="370" y="100">Processor</text><text class="l" x="370" y="116">windows · idempotent</text>
<path class="ar" d="M510 104L528 104"/>
<rect class="box" x="528" y="80" width="150" height="48" rx="9"/><text class="m" x="538" y="100">Hot store</text><text class="l" x="538" y="116">LSM · TTL</text>
<path class="ar" d="M678 104L696 104"/>
<rect class="box" x="696" y="80" width="150" height="48" rx="9"/><text class="m" x="706" y="100">Query / notify</text><text class="l" x="706" y="116">poll · webhook</text>
<rect class="box" x="24" y="160" width="150" height="44" rx="9"/><text class="m" x="34" y="180">Cache</text><text class="l" x="34" y="196">stampede guard</text>
<path class="ar dash" d="M99 160L99 128"/>
<rect class="box" x="192" y="160" width="150" height="44" rx="9"/><text class="m" x="202" y="180">Search index</text><text class="l" x="202" y="196">time shards</text>
<path class="ar dash" d="M267 160L267 128"/>
<rect class="box" x="360" y="160" width="150" height="44" rx="9"/><text class="m" x="370" y="180">Cold tier</text><text class="l" x="370" y="196">blob, months</text>
<path class="ar dash" d="M435 160L435 128"/>
<rect class="box" x="528" y="160" width="150" height="44" rx="9"/><text class="m" x="538" y="180">Control plane</text><text class="l" x="538" y="196">rings · pins</text>
<path class="ar dash" d="M603 160L603 128"/>
<rect class="box" x="696" y="160" width="150" height="44" rx="9"/><text class="m" x="706" y="180">Observability</text><text class="l" x="706" y="196">lag · probes · traces</text>
<path class="ar dash" d="M771 160L771 128"/>
</svg>
