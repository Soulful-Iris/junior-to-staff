<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Evidence desk: the guarantee</title><desc id="desc">Read the values. A useful diagram explains exactly which state change prevents the failure.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Evidence desk: the guarantee</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Read the values. A useful diagram explains exactly which state change prevents the failure.</text><rect x="45" y="185" width="250" height="105" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="170.0" y="214" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Catalog revision 4</text><text x="170.0" y="273" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">alice may read policy</text><rect x="660" y="185" width="250" height="105" rx="14" fill="#fff1e8" stroke="#b6653f" stroke-width="1.6"/><text x="785.0" y="214" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Catalog revision 5</text><text x="785.0" y="273" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">access revoked</text><path d="M304 238 L651 238" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><text x="480" y="218" font-size="17" fill="#b6653f" text-anchor="middle" font-weight="400">revocation commits</text><rect x="225" y="370" width="510" height="100" rx="14" fill="#fff1e8" stroke="#b6653f" stroke-width="1.6"/><text x="480.0" y="399" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Response checks revision 4 != 5</text><text x="480.0" y="453" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">SOURCE_CHANGED; no excerpts</text><path d="M787 300 L630 360" fill="none" stroke="#b6653f" stroke-width="2.5" marker-end="url(#bad)"/><path d="M165 300 L320 360" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><text x="480" y="550" font-size="19" fill="#203e34" text-anchor="middle" font-weight="400">The final catalog read defines this response’s authorization decision.</text></svg>