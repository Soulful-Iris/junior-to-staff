<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Release evidence desk: AWS architecture</title><desc id="desc">Name the role before the service. Keep model output outside the authority that commits state.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Release evidence desk: AWS architecture</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Name the role before the service. Keep model output outside the authority that commits state.</text><path d="M298 231 L342 231" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M608 231 L652 231" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M477 285 L167 377" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M298 438 L342 438" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M608 438 L652 438" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><rect x="42" y="182" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="168.0" y="211" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">AWS CLI</text><text x="168.0" y="267" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">labeled test cases</text><rect x="352" y="182" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="478.0" y="211" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">AWS Lambda</text><text x="478.0" y="267" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">evaluation runner</text><rect x="662" y="182" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="788.0" y="211" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Amazon Bedrock</text><text x="788.0" y="267" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">candidate classification</text><rect x="42" y="389" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="168.0" y="418" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Amazon S3</text><text x="168.0" y="474" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">report artifact storage</text><rect x="352" y="389" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="478.0" y="418" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Amazon DynamoDB</text><text x="478.0" y="474" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">immutable run registry</text><rect x="662" y="389" width="252" height="102" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="788.0" y="418" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Amazon DynamoDB</text><text x="788.0" y="474" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">active release pointer</text><text x="40" y="558" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Lambda-labeled stages share the supplied handler; repeated DynamoDB boxes share one table.</text><text x="40" y="585" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Arrows show application-mediated data flow; storage services do not call one another.</text></svg>