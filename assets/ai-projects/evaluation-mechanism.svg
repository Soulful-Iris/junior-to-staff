<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Release evidence desk: the guarantee</title><desc id="desc">Read the values. A useful diagram explains exactly which state change prevents the failure.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Release evidence desk: the guarantee</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Read the values. A useful diagram explains exactly which state change prevents the failure.</text><rect x="48" y="190" width="263" height="106" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="179.5" y="219" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Quality</text><text x="179.5" y="279" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">all 6 fixtures pass</text><rect x="349" y="190" width="263" height="106" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="480.5" y="219" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Coverage</text><text x="480.5" y="279" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">3 labels + severe cases</text><rect x="650" y="190" width="263" height="106" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="781.5" y="219" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Authority</text><text x="781.5" y="279" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">expected revision matches</text><path d="M180 307 L480 389" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M480 307 L480 389" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M780 307 L480 389" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><rect x="310" y="402" width="340" height="88" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="480.0" y="431" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Promote eligible report</text><text x="480.0" y="473" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">active v2 / previous v1</text><text x="480" y="554" font-size="19" fill="#b6653f" text-anchor="middle" font-weight="400">A tiny fixture suite proves gate behavior, not production readiness.</text></svg>