<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Approval desk: the guarantee</title><desc id="desc">Read the values. A useful diagram explains exactly which state change prevents the failure.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Approval desk: the guarantee</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Read the values. A useful diagram explains exactly which state change prevents the failure.</text><rect x="50" y="185" width="350" height="105" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="225.0" y="214" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Before approval</text><text x="225.0" y="273" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">paid 2000 / refunded 0</text><rect x="560" y="185" width="350" height="105" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="735.0" y="214" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Proposal r1</text><text x="735.0" y="273" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">refund 1250 / digest d1</text><path d="M225 300 L390 365" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M735 300 L570 365" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><rect x="235" y="374" width="490" height="100" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="480.0" y="403" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">One conditional order write</text><text x="480.0" y="457" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">refunded 1250 + receipt d1</text><text x="480" y="540" font-size="19" fill="#203e34" text-anchor="middle" font-weight="400">Retry d1 → return saved receipt. Changed request → conflict.</text><text x="480" y="575" font-size="16" fill="#65776d" text-anchor="middle" font-weight="400">An external payment requires its own idempotency and reconciliation.</text></svg>