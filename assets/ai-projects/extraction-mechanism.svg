<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Invoice review desk: the guarantee</title><desc id="desc">Read the values. A useful diagram explains exactly which state change prevents the failure.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Invoice review desk: the guarantee</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Read the values. A useful diagram explains exactly which state change prevents the failure.</text><rect x="340" y="180" width="280" height="86" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="480.0" y="209" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Record invoice-17</text><text x="480.0" y="249" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">hash = h1</text><path d="M360 277 L230 363" fill="none" stroke="#297456" stroke-width="2.5" marker-end="url(#good)"/><path d="M599 277 L740 363" fill="none" stroke="#b6653f" stroke-width="2.5" marker-end="url(#bad)"/><rect x="50" y="375" width="355" height="104" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="227.5" y="404" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Same ID / same hash</text><text x="227.5" y="462" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">reuse saved ACCEPTED result</text><rect x="555" y="375" width="355" height="104" rx="14" fill="#fff1e8" stroke="#b6653f" stroke-width="1.6"/><text x="732.5" y="404" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">Same ID / changed hash</text><text x="732.5" y="462" font-size="14" fill="#65776d" text-anchor="middle" font-weight="400">CONFLICT; do not overwrite</text><text x="480" y="553" font-size="18" fill="#203e34" text-anchor="middle" font-weight="400">Retries can repeat inference before the commit, but not publish two results.</text></svg>