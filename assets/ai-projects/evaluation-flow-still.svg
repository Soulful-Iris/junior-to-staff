<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Release evidence desk: follow the request</title><desc id="desc">Explain what is trusted at each hand-off. Motion is illustrative, not a measured service latency.</desc><defs><marker id="good" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#297456"/></marker><marker id="bad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6653f"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif} .pulse{offset-rotate:0deg} @media(prefers-reduced-motion:reduce){.moving{display:none}}</style><rect x="1" y="1" width="958" height="638" rx="22" fill="#fcfcf8" stroke="#d5dfd2"/><text x="38" y="46" font-size="13" fill="#65776d" text-anchor="start" font-weight="600">AI SYSTEMS / BUILD • OBSERVE • EXPLAIN</text><text x="38" y="87" font-size="28" fill="#203e34" text-anchor="start" font-weight="650">Release evidence desk: follow the request</text><text x="38" y="120" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Explain what is trusted at each hand-off. Motion is illustrative, not a measured service latency.</text><rect x="50" y="205" width="395" height="92" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="247.5" y="234" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">01  independent labels</text><rect x="515" y="205" width="395" height="92" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="712.5" y="234" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">02  actual candidate outputs</text><rect x="515" y="405" width="395" height="92" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="712.5" y="434" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">03  per-case comparisons</text><rect x="50" y="405" width="395" height="92" rx="14" fill="#eef6ee" stroke="#297456" stroke-width="1.6"/><text x="247.5" y="434" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">04  eligible report + conditional</text><text x="247.5" y="456" font-size="17" fill="#203e34" text-anchor="middle" font-weight="600">release</text><path id="track0" d="M450 250 H505" stroke="#297456" stroke-width="3" fill="none" marker-end="url(#good)"/><path id="track1" d="M712 305 V395" stroke="#297456" stroke-width="3" fill="none" marker-end="url(#good)"/><path id="track2" d="M505 450 H450" stroke="#297456" stroke-width="3" fill="none" marker-end="url(#good)"/><text x="45" y="558" font-size="15" fill="#65776d" text-anchor="start" font-weight="400">Moving dots show a request crossing a boundary; labels remain visible throughout the loop.</text></svg>