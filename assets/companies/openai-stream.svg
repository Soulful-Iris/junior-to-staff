<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-labelledby="title desc">
<title id="title">Streaming response, retry and deduplication</title><desc id="desc">Events 0, 1 and retry 1 travel from a model to a cursor gate; only one 1 reaches the browser. A motion-reduced still preserves the complete topology.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#263a34}.small{font-size:12px;fill:#596960}.mono{font:700 13px ui-monospace,monospace}.box{fill:#fcfcf8;stroke:#869f93;stroke-width:1.5}.track{fill:none;stroke:#a9b9ae;stroke-width:2;stroke-dasharray:6 6}.event{animation:flow 3.8s linear infinite}.retry{animation:retry 3.8s linear infinite}.gate{animation:pulse 3.8s ease-in-out infinite}@keyframes flow{0%,10%{transform:translateX(0);opacity:0}15%{opacity:1}70%,100%{transform:translateX(495px);opacity:1}}@keyframes retry{0%,30%{transform:translate(0,0);opacity:0}40%{opacity:1}67%{transform:translate(218px,0);opacity:1}70%,100%{transform:translate(218px,0);opacity:.15}}@keyframes pulse{0%,62%,100%{fill:#ecf2e9}69%{fill:#d0e5ce}}</style>
<rect width="760" height="292" rx="16" fill="#edf3ec"/><text x="27" y="35" class="small" letter-spacing="2">STREAM / THE RETRY IS NOT A SECOND TOKEN</text>
<path class="track" d="M154 114H614M154 183H357"/><rect class="box" x="28" y="79" width="126" height="71" rx="10"/><text x="51" y="108" class="mono">MODEL</text><text x="51" y="130" class="small">event source</text>
<rect class="box gate" x="355" y="74" width="151" height="83" rx="12"/><text x="376" y="106" class="mono">CURSOR GATE</text><text x="376" y="131" class="small">seen (stream, seq)</text>
<rect class="box" x="614" y="79" width="119" height="71" rx="10"/><text x="632" y="109" class="mono">BROWSER</text><text x="632" y="130" class="small">0 · 1 · 2</text>
<g class="event"><rect x="172" y="94" width="32" height="38" rx="8" fill="#2d7057"/><text x="183" y="120" fill="white" style="fill:white;font:700 16px ui-monospace,monospace">1</text></g>
<g class="retry"><rect x="170" y="166" width="67" height="34" rx="8" fill="#d79555"/><text x="182" y="188" fill="white" style="fill:white;font:700 12px ui-monospace,monospace">retry 1</text></g>
<path d="M409 176v32" stroke="#a46f39" stroke-width="2"/><path d="m404 205 5 6 5-6" fill="none" stroke="#a46f39" stroke-width="2"/><text x="321" y="236" class="small">duplicate discarded, not re-rendered</text>
<path d="M27 259H733" stroke="#c9d8ca"/><text x="28" y="278" class="small">BEFORE  every arrival writes to socket</text><text x="406" y="278" class="small">AFTER  contiguous, idempotent apply</text>
</svg>
