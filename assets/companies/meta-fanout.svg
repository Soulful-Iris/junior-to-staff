<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
<title id="title">Notification fanout under a celebrity spike</title><desc id="desc">One post fans out to many followers. Synchronous writes block the post path, whereas a durable event and batched workers protect the latency boundary.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#26354e}.l{font-size:12px;fill:#52647b}.m{font:700 13px ui-monospace,monospace}.b{fill:#fff;stroke:#91a8cb;stroke-width:1.5}.pulse{animation:fan 2.8s ease-out infinite}.pulse2{animation:fan 2.8s ease-out .55s infinite}@keyframes fan{0%{opacity:0;transform:translateX(-45px)}30%{opacity:1}75%,100%{opacity:1;transform:translateX(0)}}</style>
<rect width="760" height="290" rx="16" fill="#edf3fc"/><text x="27" y="33" class="l" letter-spacing="2">FANOUT / WRITE PATH MUST NOT WAIT FOR EVERY INBOX</text>
<rect class="b" x="31" y="105" width="125" height="69" rx="10"/><text x="48" y="134" class="m">POST API</text><text x="48" y="154" class="l">one write</text>
<path d="M156 139H235M365 139H439M553 139H611" stroke="#8ca3c2" stroke-width="2"/><path d="m225 134 10 5-10 5m204-10 10 5-10 5m162-10 10 5-10 5" fill="none" stroke="#8ca3c2" stroke-width="2"/>
<rect class="b" x="235" y="105" width="130" height="69" rx="10"/><text x="249" y="134" class="m">EVENT LOG</text><text x="249" y="154" class="l">durable handoff</text>
<rect class="b" x="439" y="105" width="114" height="69" rx="10"/><text x="454" y="134" class="m">WORKERS</text><text x="454" y="154" class="l">bounded rate</text>
<rect class="b" x="611" y="62" width="118" height="40" rx="8"/><text x="625" y="87" class="m">INBOX A</text><rect class="b" x="611" y="121" width="118" height="40" rx="8"/><text x="625" y="146" class="m">INBOX B</text><rect class="b" x="611" y="180" width="118" height="40" rx="8"/><text x="625" y="205" class="m">INBOX …</text>
<path d="M553 139q29-57 58-57M553 139q29 61 58 61" fill="none" stroke="#8ca3c2" stroke-width="2"/><circle class="pulse" cx="574" cy="139" r="7" fill="#4769b4"/><circle class="pulse2" cx="583" cy="139" r="6" fill="#6989d0"/>
<path d="M29 245H731" stroke="#c9d6e9"/><text x="30" y="267" class="l">BEFORE  one request waits on millions of writes</text><text x="425" y="267" class="l">AFTER  event log absorbs burst</text>
</svg>
