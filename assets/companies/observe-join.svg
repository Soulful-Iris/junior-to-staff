<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-labelledby="title desc">
<title id="title">Event-time watermark and late telemetry</title><desc id="desc">A trace and a log within an event-time window form a correlated pair. A later arrival beyond the watermark goes to a visible late-data lane.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#263c42}.l{font-size:12px;fill:#5c7278}.m{font:700 13px ui-monospace,monospace}.lane{stroke:#93b6bd;stroke-width:2;stroke-dasharray:5 5}.trace{animation:trace 4.5s linear infinite}.late{animation:late 4.5s linear infinite}.join{animation:glow 4.5s ease-in-out infinite}@keyframes trace{0%,12%{transform:translateX(0);opacity:0}22%{opacity:1}65%,100%{transform:translateX(240px);opacity:1}}@keyframes late{0%,45%{transform:translateX(0);opacity:0}56%{opacity:1}90%,100%{transform:translateX(500px);opacity:1}}@keyframes glow{0%,58%,100%{fill:#fff}67%,85%{fill:#d9f0e6}}</style>
<rect width="760" height="304" rx="16" fill="#eaf4f4"/><text x="26" y="34" class="l" letter-spacing="2">CORRELATION / EVENT TIME IS NOT ARRIVAL TIME</text>
<text x="32" y="89" class="m">TRACE t=12</text><text x="32" y="162" class="m">LOG t=10</text><path class="lane" d="M142 84H676M142 157H676"/><rect class="join" x="377" y="71" width="131" height="105" rx="12" stroke="#83a6aa"/><text x="395" y="115" class="m">JOIN WINDOW</text><text x="395" y="139" class="l">|Δt| ≤ 10s</text>
<g class="trace"><circle cx="174" cy="84" r="10" fill="#167d82"/></g><circle cx="420" cy="157" r="10" fill="#167d82"/><path d="M442 177v35h115" fill="none" stroke="#ab9470" stroke-width="2"/><text x="553" y="216" class="l">watermark closes</text>
<g class="late"><rect x="170" y="224" width="85" height="30" rx="7" fill="#d59555"/><text x="179" y="244" class="m" style="fill:white">late log</text></g><rect x="646" y="218" width="90" height="43" rx="8" fill="#f1e6d3" stroke="#c49d64"/><text x="657" y="245" class="m">SIDE LANE</text>
<text x="28" y="285" class="l">BEFORE  arrival clock hides missing pairs</text><text x="396" y="285" class="l">AFTER  explicit late path + completeness state</text>
</svg>
