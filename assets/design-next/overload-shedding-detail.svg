<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Queues cannot create database capacity: failure trace</title><desc id="desc">t = 0s: 0 backlog; t = 2s: 40k queued; t = 5s: 100k queued; After shedding: queue drains</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="57" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Queues cannot create database capacity  /  THE DECISION</text><text x="55" y="107" fill="#596b63" font-size="19" font-weight="normal" text-anchor="start">40k/s arrive · 20k/s finish · backlog gains 20k each second</text><path d="M97 405 H856 M97 405 V151" stroke="#668278" stroke-width="3"/><path d="M97 405 L277 352 L455 293 L635 235 L817 178" fill="none" stroke="#af563e" stroke-width="5"/><path d="M97 405 L277 378 L455 368 L635 362 L817 355" fill="none" stroke="#267259" stroke-width="5"/><text x="97" y="438" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">0s</text><text x="277" y="438" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">1s</text><text x="457" y="438" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">2s</text><text x="637" y="438" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">3s</text><text x="817" y="438" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">4s</text><text x="605" y="166" fill="#af563e" font-size="17" font-weight="700" text-anchor="start">Unbounded queue: +80k by 4s</text><text x="543" y="338" fill="#267259" font-size="17" font-weight="700" text-anchor="start">Admission holds queue near budget</text><text x="55" y="487" fill="#243c34" font-size="19" font-weight="normal" text-anchor="start">Larger buffers increase wait; they do not increase database throughput.</text></svg>