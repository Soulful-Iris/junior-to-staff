<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Queues cannot create database capacity: AWS architecture</title><desc id="desc">Architecture boxes: Amazon API Gateway, edge admission, Amazon ECS, priority compute, Amazon RDS, durable database, Amazon ElastiCache, cache, Amazon CloudWatch, load telemetry</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="44" y="55" fill="#596b63" font-size="16" font-weight="700" text-anchor="start">AWS BOXES  /  THE ROLE BELOW THE PRODUCT</text><text x="44" y="94" fill="#243c34" font-size="26" font-weight="700" text-anchor="start">Queues cannot create database capacity</text><path d="M312 200.0 L335 200.0" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M617 200.0 L640 200.0" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M479.0 254 L326.0 349" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M479.0 254 L631.0 349" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><rect x="40" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="174.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon API Gateway</text><text x="174.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">edge admission</text><rect x="345" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="479.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon ECS</text><text x="479.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">priority compute</text><rect x="650" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="784.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon RDS</text><text x="784.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">durable database</text><rect x="192" y="361" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="326.0" y="396" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon ElastiCache</text><text x="326.0" y="425" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">cache</text><rect x="497" y="361" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="631.0" y="396" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon CloudWatch</text><text x="631.0" y="425" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">load telemetry</text><text x="43" y="526" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">Trace identity, permission, and retries through the boxes; service names do not supply those guarantees.</text></svg>