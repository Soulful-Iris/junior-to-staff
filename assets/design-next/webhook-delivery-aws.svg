<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One event, multiple attempts: AWS architecture</title><desc id="desc">Architecture boxes: Amazon RDS / Aurora, transaction + outbox, Amazon EventBridge, event router, Amazon SQS, delivery queue, Amazon ECS, delivery worker, Amazon SQS DLQ, failed delivery inbox</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="44" y="55" fill="#596b63" font-size="16" font-weight="700" text-anchor="start">AWS BOXES  /  THE ROLE BELOW THE PRODUCT</text><text x="44" y="94" fill="#243c34" font-size="26" font-weight="700" text-anchor="start">One event, multiple attempts</text><path d="M312 200.0 L335 200.0" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M617 200.0 L640 200.0" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M784.0 254 L326.0 349" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M464 408.0 L487 408.0" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><rect x="40" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="174.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon RDS / Aurora</text><text x="174.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">transaction + outbox</text><rect x="345" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="479.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon EventBridge</text><text x="479.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">event router</text><rect x="650" y="153" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="784.0" y="188" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon SQS</text><text x="784.0" y="217" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">delivery queue</text><rect x="192" y="361" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="326.0" y="396" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon ECS</text><text x="326.0" y="425" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">delivery worker</text><rect x="497" y="361" width="268" height="94" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="631.0" y="396" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Amazon SQS DLQ</text><text x="631.0" y="425" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">failed delivery inbox</text><text x="43" y="526" fill="#596b63" font-size="15" font-weight="normal" text-anchor="start">Trace identity, permission, and retries through the boxes; service names do not supply those guarantees.</text></svg>