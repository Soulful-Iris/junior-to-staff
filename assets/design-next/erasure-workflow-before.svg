<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Deleting one row leaves nine copies</title><desc id="desc">Without: Primary deleted; Index still serves; False completed. With: Immediate tombstone; Delete all copies; Verify exceptions.</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="57" fill="#243c34" font-size="27" font-weight="700" text-anchor="start">Deleting one row leaves nine copies</text><rect x="35" y="93" width="424" height="424" rx="16" fill="#fff6f2"/><rect x="501" y="93" width="424" height="424" rx="16" fill="#eff8f2"/><text x="55" y="130" fill="#af563e" font-size="14" font-weight="700" text-anchor="start">WITHOUT A BOUNDARY</text><rect x="79" y="164" width="342" height="72" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="250.0" y="206.0" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Primary deleted</text><path d="M250 241 L250 268" fill="none" stroke="#af563e" stroke-width="2.5" marker-end="url(#bad)"/><rect x="79" y="275" width="342" height="72" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="250.0" y="317.0" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Index still serves</text><path d="M250 352 L250 379" fill="none" stroke="#af563e" stroke-width="2.5" marker-end="url(#bad)"/><rect x="79" y="386" width="342" height="72" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="250.0" y="428.0" fill="#243c34