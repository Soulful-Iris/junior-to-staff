<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One document, two writers: failure trace</title><desc id="desc">Ana starts: base v4; Ben starts: base v4; Ana commits: v5; op a17; Ben rebases: v6; no loss</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="57" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">One document, two writers  /  THE DECISION</text><text x="480" y="106" fill="#596b63" font-size="16" font-weight="normal" text-anchor="middle">Both edits start from v4. Only the authority assigns v5 and v6.</text><rect x="375" y="131" width="210" height="80" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.0" y="166" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Shared base</text><text x="480.0" y="195" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">version 4</text><path d="M390 218 L224 280" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M568 218 L733 280" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><rect x="85" y="287" width="284" height="88" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="227.0" y="322" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Ana submits a17</text><text x="227.0" y="351" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">base v4</text><rect x="590" y="287" width="284" height="88" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="732.0" y="322" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Ben submits b9</text><text x="732.0" y="351" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">base v4</text><path d="M227 380 L398 454" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><path d="M731 380 L566 454" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><rect x="358" y="453" width="245" height="77" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="480.5" y="488" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Authority</text><text x="480.5" y="517" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">v5 then rebase to v6</text></svg>