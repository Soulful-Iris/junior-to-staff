<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Relevance does not authorize a passage: failure trace</title><desc id="desc">Index: stale passage; Policy: access revoked; Gate: passage removed; Model: safe context only</desc><defs><marker id="good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267259"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#af563e"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}</style><rect x="1" y="1" width="958" height="558" rx="20" fill="#fbfcf8" stroke="#d9e2d9"/><text x="42" y="57" fill="#243c34" font-size="25" font-weight="700" text-anchor="start">Relevance does not authorize a passage  /  THE DECISION</text><text x="46" y="108" fill="#596b63" font-size="18" font-weight="normal" text-anchor="start">Relevance score is not an access decision.</text><rect x="56" y="154" width="263" height="100" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="187.5" y="189" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Search index</text><text x="187.5" y="218" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">candidate p17</text><path d="M328 203 L396 203" fill="none" stroke="#267259" stroke-width="2.5" marker-end="url(#good)"/><rect x="406" y="154" width="222" height="100" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="517.0" y="189" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Live ACL</text><text x="517.0" y="218" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">access revoked</text><path d="M638 203 L710 203" fill="none" stroke="#af563e" stroke-width="2.5" marker-end="url(#bad)"/><rect x="721" y="154" width="193" height="100" rx="12" fill="#edf7f2" stroke="#267259" stroke-width="2"/><text x="817.5" y="189" fill="#243c34" font-size="15" font-weight="600" text-anchor="middle">Model context</text><text x="817.5" y="218" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">omit p17</text><path d="M521 268 V390 H163" stroke="#b35b43" stroke-width="3" fill="none"/><rect x="54" y="402" width="848" height="100" rx="12" fill="#fff0ea" stroke="#af563e" stroke-width="2"/><text x="478.0" y="437" fill="#243c34" font-size="13" font-weight="600" text-anchor="middle">Cached answer also needs a new permission gate</text><text x="478.0" y="466" fill="#596b63" font-size="14" font-weight="normal" text-anchor="middle">A stale citation cannot be served to a newly unauthorized user.</text></svg>