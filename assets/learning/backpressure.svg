<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">A buffer is a reservoir, not capacity</title>
<desc id="desc">UNBOUNDED BUFFER BOUNDED ADMISSION arrival &amp;gt; service queue memory and wait time grow arrival &amp;gt; service queue 429 / 503 A queue stores a rate mismatch. A bound forces an explicit overload response. Choose reject, defer, or shed. Watch age as well as depth; autoscaling cannot erase startup delay. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
