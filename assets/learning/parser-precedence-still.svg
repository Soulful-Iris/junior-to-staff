<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="parser-precedence-title parser-precedence-desc">
<title id="parser-precedence-title">Parser precedence fixes structure before evaluation may skip a branch</title>
<desc id="parser-precedence-desc">The policy a equals TRUE OR b equals TRUE AND c equals TRUE is parsed as OR of predicate a and an AND subtree containing predicates b and c. The record has a true, b false, c false. The complete source, including the right subtree and end of input, is parsed before evaluation. The true result of a travels to OR, which skips evaluating its already-parsed AND branch and returns true. Parenthesizing a OR b first instead gives false. The 18-second loop uses illustrative timing. Its labeled replay reset is not an algorithm step. Reduced-motion and print modes show the completed still study.</desc>
<defs><marker id="parser-precedence-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#2f6f4e"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.still{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="650" rx="10" fill="#faf9f7"/>
<!-- QA sample times in seconds: 0, 2, 3.1, 4.3, 6.6, 8.1, 10.1, 11.1, 12.4, 13.3, 14.9, 17.4. Persistent geometry is outside the motion overlays. -->
<text x="32" y="35" font-size="17" fill="#6d6459" text-anchor="start" >PARSE THE WHOLE INPUT BEFORE SHORT-CIRCUIT EVALUATION</text><text x="32" y="62" font-size="14" fill="#1f2b24" text-anchor="start" >a = True · b = False · c = False · AND binds tighter than OR.</text><rect x="44" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="119.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">a == TRUE</text><rect x="206" y="103" width="45" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="228.5" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">OR</text><rect x="264" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="339.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">b == TRUE</text><rect x="426" y="103" width="52" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="452.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">AND</text><rect x="490" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="565.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">c == TRUE</text><rect x="652" y="103" width="63" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="683.5" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">EOF</text><text x="32" y="178" font-size="12" fill="#6d6459" text-anchor="start" >Solid outlines mark parsed structure; a traveling True value marks evaluation.</text><path d="M291 253 L151 321" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M333 247 L494 309" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M501 346 L450 426" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M539 345 L614 426" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="310" cy="236" r="28" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="310" y="241" font-size="15" fill="#6d6459" text-anchor="middle" >OR</text><circle cx="520" cy="324" r="28" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="520" y="329" font-size="15" fill="#6d6459" text-anchor="middle" >AND</text><rect x="70" y="321" width="124" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="132" y="348" font-size="14" fill="#6d6459" text-anchor="middle" class="mono">a == TRUE</text><rect x="370" y="426" width="124" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="432" y="453" font-size="14" fill="#6d6459" text-anchor="middle" class="mono">b == TRUE</text><rect x="570" y="426" width="124" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="632" y="453" font-size="14" fill="#6d6459" text-anchor="middle" class="mono">c == TRUE</text><rect x="566" y="207" width="149" height="56" rx="7" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="580" y="228" font-size="10" fill="#6d6459" text-anchor="start" >RESULT</text><text x="72" y="387" font-size="12" fill="#6d6459" text-anchor="start" >Record supplies a=True.</text><path d="M32 520 H728" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="548" font-size="13" fill="#1f2b24" text-anchor="start" >With parentheses: (a == TRUE OR b == TRUE) AND c == TRUE → False.</text><text x="32" y="576" font-size="14" fill="#6d6459" text-anchor="start" >That expression has AND at its root: grouping changes the answer.</text><text x="32" y="603" font-size="14" fill="#2f6f4e" text-anchor="start" >A syntax error must still fail, even inside a branch evaluation would skip.</text><text x="32" y="633" font-size="12" fill="#6d6459" text-anchor="start" >Illustrative replay: reset parsed structure and result after the final hold.</text><rect x="70" y="321" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="132" y="348" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">a == TRUE</text><rect x="370" y="426" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="432" y="453" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">b == TRUE</text><rect x="570" y="426" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="632" y="453" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">c == TRUE</text><circle cx="520" cy="324" r="28" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.8"/><text x="520" y="329" font-size="15" fill="#2f6f4e" text-anchor="middle" >AND</text><circle cx="310" cy="236" r="28" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.8"/><text x="310" y="241" font-size="15" fill="#2f6f4e" text-anchor="middle" >OR</text><path d="M501 346 L450 426" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M539 345 L614 426" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M291 253 L151 321" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M333 247 L494 309" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="652" y="150" width="63" height="3" fill="#c2703d"/><text x="32" y="496" font-size="13" fill="#2f6f4e" text-anchor="start" >EOF checked. The entire expression is valid.</text><text x="628" y="249" font-size="19" fill="#2f6f4e" text-anchor="middle" >True</text><text x="501" y="490" font-size="12" fill="#c2703d" text-anchor="start" >Parsed, then skipped:</text><text x="501" y="508" font-size="12" fill="#6d6459" text-anchor="start" >left OR operand is True.</text></svg>
