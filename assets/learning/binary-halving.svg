<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Keep the first qualifying index</title><desc id="desc">Keep the first qualifying index. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">KEEP THE FIRST QUALIFYING INDEX</text><g class="moving"><text x="90.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">0</text><rect x="55" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="90.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">1</text><text x="185.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">1</text><rect x="150" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="185.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">2</text><text x="280.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">2</text><rect x="245" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="280.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">2</text><text x="375.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">3</text><rect x="340" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="375.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">5</text><text x="470.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">4</text><rect x="435" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="470.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">8</text><text x="565.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">5</text><rect x="530" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="565.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">12</text><text x="55" y="77" font-size="17" fill="#1f2b24" text-anchor="start">First value ≥ 2     search interval [lo, hi)</text><path d="M95 0 v12 H95 v-12" transform="translate(50 184)" fill="none" stroke="#2f6f4e" stroke-width="3"><animate attributeName="d" values="M0 0 v12 H550 v-12;M0 0 v12 H265 v-12;M0 0 v12 H75 v-12;M95 0 v12 H95 v-12;M0 0 v12 H550 v-12" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/></path><path d="M185 203 l-8 12 h16 Z" fill="#c2703d" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/></path><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>lo=0  hi=6  mid=3 → value 5</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>lo=0  hi=3  mid=1 → value 2</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>lo=0  hi=1  mid=0 → value 1</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>lo=1  hi=1 → answer index 1</text><text x="55" y="306" font-size="16" fill="#1f2b24" text-anchor="start">Keep mid when it qualifies. The first match may be there.</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>5 qualifies: set hi to 3.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>2 qualifies: set hi to 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>1 is too small: set lo to 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>The search interval is empty; the insertion point remains.</text></g><g class="still"><text x="90.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">0</text><rect x="55" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="90.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">1</text><text x="185.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">1</text><rect x="150" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="185.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">2</text><text x="280.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">2</text><rect x="245" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="280.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">2</text><text x="375.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">3</text><rect x="340" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="375.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">5</text><text x="470.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">4</text><rect x="435" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="470.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">8</text><text x="565.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">5</text><rect x="530" y="118" width="70" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="565.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">12</text><text x="55" y="77" font-size="17" fill="#1f2b24" text-anchor="start">First value ≥ 2     search interval [lo, hi)</text><path d="M95 0 v12 H95 v-12" transform="translate(50 184)" fill="none" stroke="#2f6f4e" stroke-width="3"></path><path d="M185 203 l-8 12 h16 Z" fill="#c2703d" opacity="1"></path><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">lo=0  hi=6  mid=3 → value 5</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">lo=0  hi=3  mid=1 → value 2</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">lo=0  hi=1  mid=0 → value 1</text><text x="55" y="255" font-size="20" fill="#1f2b24" text-anchor="start" opacity="1">lo=1  hi=1 → answer index 1</text><text x="55" y="306" font-size="16" fill="#1f2b24" text-anchor="start">Keep mid when it qualifies. The first match may be there.</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">5 qualifies: set hi to 3.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">2 qualifies: set hi to 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">1 is too small: set lo to 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">The search interval is empty; the insertion point remains.</text></g></svg>