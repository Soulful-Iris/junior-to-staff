<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Expiry jitter spreads the refresh wave</title>
<desc id="desc">SAME EXPIRY → ONE SPIKE JITTER → SPREAD REFRESH WORK k1 k2 k3 k4 k5 k6 k1 k2 k3 k4 k5 k6 Equal TTLs synchronize misses. Randomized expiry spreads their arrival times. Jitter does not reduce total refresh work. Pair it with coalescing, stale policy, and a load budget. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
