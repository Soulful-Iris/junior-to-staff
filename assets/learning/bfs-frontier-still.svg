<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">A graph becomes distance layers</title><desc id="desc">A graph becomes distance layers. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A GRAPH BECOMES DISTANCE LAYERS</text><line x1="110" y1="100" x2="285" y2="90" stroke="#ded9d1" stroke-width="1.5"></line><line x1="110" y1="100" x2="285" y2="240" stroke="#ded9d1" stroke-width="1.5"></line><line x1="285" y1="90" x2="475" y2="150" stroke="#ded9d1" stroke-width="1.5"></line><line x1="285" y1="240" x2="475" y2="150" stroke="#ded9d1" stroke-width="1.5"></line><line x1="475" y1="150" x2="645" y2="235" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="110" cy="100" r="28" stroke="#2f6f4e" stroke-width="2" fill="#2f6f4e"></circle><text x="110" y="106" font-size="20" fill="#faf9f7" text-anchor="middle">A</text><circle cx="285" cy="90" r="28" stroke="#2f6f4e" stroke-width="2" fill="#2f6f4e"></circle><text x="285" y="96" font-size="20" fill="#faf9f7" text-anchor="middle">B</text><circle cx="285" cy="240" r="28" stroke="#2f6f4e" stroke-width="2" fill="#2f6f4e"></circle><text x="285" y="246" font-size="20" fill="#faf9f7" text-anchor="middle">C</text><circle cx="475" cy="150" r="28" stroke="#2f6f4e" stroke-width="2" fill="#2f6f4e"></circle><text x="475" y="156" font-size="20" fill="#faf9f7" text-anchor="middle">D</text><circle cx="645" cy="235" r="28" stroke="#2f6f4e" stroke-width="2" fill="#c2703d"></circle><text x="645" y="241" font-size="20" fill="#faf9f7" text-anchor="middle">E</text><text x="435" y="80" font-size="13" fill="#6d6459" text-anchor="start">orange: frontier   green: visited</text><text x="45" y="316" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">frontier: [A]    distance 0</text><text x="45" y="316" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">frontier: [B, C]    distance 1</text><text x="45" y="316" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">frontier: [D]    distance 2</text><text x="45" y="316" font-size="18" fill="#1f2b24" text-anchor="start" opacity="1">frontier: [E]    distance 3</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">FIFO frontier starts at the source.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Visit all neighbors one edge away.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Both B and C reach D. Enqueue D only once.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Layers give shortest distance only for equal-cost edges.</text></svg>