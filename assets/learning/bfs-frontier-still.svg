<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">A graph becomes distance layers</title><desc id="desc">BREADTH FIRST · EACH EDGE HAS EQUAL COST A d=0 B d=1 C d=1 D d=2 E d=3 A  →  [B, C]  →  [D]  →  [E] Two edges discover D; only the first discovery enqueues it. Mark visited at enqueue time. FIFO processes complete distance layers: O(V + E). Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A GRAPH BECOMES DISTANCE LAYERS</text><text x="40" y="69" font-size="11" fill="#6d6459" text-anchor="start">BREADTH FIRST · EACH EDGE HAS EQUAL COST</text><path d="M90 165 L270 98" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M90 165 L270 245" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M270 98 L460 165" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M270 245 L460 165" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M460 165 L650 165" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="90" cy="165" r="25" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"></circle><circle cx="90" cy="165" r="31" fill="none" stroke="#c2703d" stroke-width="2"></circle><text x="90" y="171" font-size="20" fill="#1f2b24" text-anchor="middle">A</text><text x="90" y="214" font-size="13" fill="#2f6f4e" text-anchor="middle">d=0</text><circle cx="270" cy="98" r="25" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"></circle><circle cx="270" cy="98" r="31" fill="none" stroke="#c2703d" stroke-width="2"></circle><text x="270" y="104" font-size="20" fill="#1f2b24" text-anchor="middle">B</text><text x="270" y="147" font-size="13" fill="#2f6f4e" text-anchor="middle">d=1</text><circle cx="270" cy="245" r="25" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"></circle><circle cx="270" cy="245" r="31" fill="none" stroke="#c2703d" stroke-width="2"></circle><text x="270" y="251" font-size="20" fill="#1f2b24" text-anchor="middle">C</text><text x="270" y="294" font-size="13" fill="#2f6f4e" text-anchor="middle">d=1</text><circle cx="460" cy="165" r="25" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"></circle><circle cx="460" cy="165" r="31" fill="none" stroke="#c2703d" stroke-width="2"></circle><text x="460" y="171" font-size="20" fill="#1f2b24" text-anchor="middle">D</text><text x="460" y="214" font-size="13" fill="#2f6f4e" text-anchor="middle">d=2</text><circle cx="650" cy="165" r="25" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"></circle><circle cx="650" cy="165" r="31" fill="none" stroke="#c2703d" stroke-width="2"></circle><text x="650" y="171" font-size="20" fill="#1f2b24" text-anchor="middle">E</text><text x="650" y="214" font-size="13" fill="#2f6f4e" text-anchor="middle">d=3</text><text x="40" y="319" font-size="20" fill="#2f6f4e" text-anchor="start">A  →  [B, C]  →  [D]  →  [E]</text><path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">Two edges discover D; only the first discovery enqueues it.</text><text x="32" y="402" font-size="13" fil