<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Choose, explore, undo, try the next branch</title>
<desc id="desc">SUBSETS OF [A, B] · ONE WORKING PATH, COPIED AT LEAVES [] [A] [] [A,B] [A] [B] [] down: choose up: undo Depth-first traversal returns to a choice point before trying the next branch. Append → recurse → pop. Copy at a leaf; otherwise every saved answer may alias the same list. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
