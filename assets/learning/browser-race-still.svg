<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">The older response arrives last</title><desc id="desc">The older response arrives last. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">THE OLDER RESPONSE ARRIVES LAST</text><text x="45" y="80" font-size="12" fill="#6d6459" text-anchor="start">REQUEST</text><text x="300" y="80" font-size="12" fill="#6d6459" text-anchor="start">TIME →</text><text x="40" y="145" font-size="20" fill="#c2703d" text-anchor="start">cat</text><text x="40" y="225" font-size="20" fill="#2f6f4e" text-anchor="start">car</text><line x1="130" y1="140" x2="660" y2="140" stroke="#c2703d" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="270" y1="220" x2="455" y2="220" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="130" y="120" font-size="13" fill="#6d6459" text-anchor="start">start 1</text><text x="270" y="200" font-size="13" fill="#6d6459" text-anchor="start">start 2</text><text x="480" y="223" font-size="15" fill="#2f6f4e" text-anchor="start">response 2 arrives first</text><text x="495" y="122" font-size="15" fill="#c2703d" text-anchor="start">response 1 arrives late</text><line x1="660" x2="660" y1="95" y2="246" stroke="#1f2b24" stroke-width="2"></line><rect x="40" y="280" width="675" height="48" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="62" y="311" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">UI: loading cat · generation 1</text><text x="62" y="311" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">UI: loading car · generation 2</text><text x="62" y="311" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">UI: car · accepted generation 2</text><text x="62" y="311" font-size="18" fill="#1f2b24" text-anchor="start" opacity="1">UI: car · reject obsolete generation 1</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Each search gets an increasing generation.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">New intent supersedes the old request.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Commit the result only if its generation is current.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Abort saves work when supported; the generation guard is essential.</text></svg>