<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">The older response arrives last</title><desc id="desc">NEWER INTENT WINS · RESPONSES CAN ARRIVE OUT OF ORDER cat · v1 car · v2 UI: car · generation 2 reject obsolete v1 arrives first arrives last Commit a response only if its generation still matches the current request. Aborting obsolete work can save resources; the generation guard protects the UI either way. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">THE OLDER RESPONSE ARRIVES LAST</text><text x="40" y="72" font-size="11" fill="#6d6459" text-anchor="start">NEWER INTENT WINS · RESPONSES CAN ARRIVE OUT OF ORDER</text><text x="40" y="128" font-size="16" fill="#c2703d" text-anchor="start">cat · v1</text><text x="40" y="226" font-size="16" fill="#2f6f4e" text-anchor="start">car · v2</text><path d="M155 124 H650" stroke="#c2703d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><path d="M285 222 H465" stroke="#2f6f4e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><path d="M465 228 V300 H355" stroke="#2f6f4e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><rect x="135" y="278" width="220" height=