</rect>
<path d="M738 91 V318" stroke="#c2703d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="738" y="337" font-size="13" fill="#c2703d" text-anchor="end">300 ms</text>
<text x="245" y="183" font-size="14" fill="#6d6459" text-anchor="start">auth spent 50 ms</text>
<text x="340" y="257" font-size="15" fill="#c2703d" text-anchor="start">at most 250 ms remain</text>
<path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
