</path>
<text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">Extend the current end to max(end, next.end); a gap starts another interval.</text>
<text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">O(n log n) for sorting, O(n) for the scan. Half-open intervals need an explicit touching policy.</text>
