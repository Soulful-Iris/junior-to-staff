<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Overlap extends the current interval</title>
<desc id="desc">SORT BY START · MERGE OVERLAPPING CLOSED INTERVALS [1, 4] [3, 6] [8, 10] [1, 6] [8, 10] Extend the current end to max(end, next.end); a gap starts another interval. O(n log n) for sorting, O(n) for the scan. Half-open intervals need an explicit touching policy. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
<path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/>
</marker>
</defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="420" rx="10" fill="#faf9f7"/>
<text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">OVERLAP EXTENDS THE CURRENT INTERVAL</text>
