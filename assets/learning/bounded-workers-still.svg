<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 675" width="760" height="675" role="img" aria-labelledby="title desc">
<title id="title">Bound active work and make waiting visible · all four states</title><desc id="desc">Teaching timeline. States are illustrative, not measured latency. A still storyboard is linked beside this image.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} </style>
<rect width="760" height="675" rx="14" fill="#faf9f7"/>
<text x="28" y="32" font-size="11" fill="#706a61" text-anchor="start">LEARN / PREDICT / EXPLAIN</text>
<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">Bound active work and make waiting visible · all four</text><text x="28" y="92" font-size="22" fill="#26342e" text-anchor="start">states</text>
<text x="28" y="119" font-size="12" fill="#706a61" text-anchor="start">STEP</text><text x="90" y="119" font-size="12" fill="#a45134" text-anchor="start">WITHOUT</text><text x="416" y="119" font-size="12" fill="#27664c" text-anchor="start">WITH</text><rect x="24" y="140" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="173" font-size="22" fill="#26342e" text-anchor="start">1</text><text x="90" y="166" font-size="16" fill="#85472f" text-anchor="start">Submit 12 jobs immediately</text><text x="416" y="166" font-size="16" fill="#27664c" text-anchor="start">Submit 12 jobs</text><rect x="24" y="248" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="281" font-size="22" fill="#26342e" text-anchor="start">2</text><text x="90" y="274" font-size="16" fill="#85472f" text-anchor="start">Start all 12 at once</text><text x="416" y="274" font-size="16" fill="#27664c" text-anchor="start">Start 3; 9 wait locally</text><rect x="24" y="356" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="389" font-size="22" fill="#26342e" text-anchor="start">3</text><text x="90" y="382" font-size="16" fill="#85472f" text-anchor="start">Dependency capacity is only 3</text><text x="416" y="382" font-size="16" fill="#27664c" text-anchor="start">One completes; start the next</text><rect x="24" y="464" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="497" font-size="22" fill="#26342e" text-anchor="start">4</text><text x="90" y="490" font-size="16" fill="#85472f" text-anchor="start">Failures and retries increase</text><text x="90" y="517" font-size="16" fill="#85472f" text-anchor="start">the load</text><text x="416" y="490" font-size="16" fill="#27664c" text-anchor="start">Peak active work stays at 3</text><text x="28" y="607" font-size="15" fill="#26342e" text-anchor="start">What happens when arrival rate exceeds completion rate forever?</text></svg>