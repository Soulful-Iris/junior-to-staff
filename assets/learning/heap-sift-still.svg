<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Repair the heap along one branch</title>
<desc id="desc">MIN HEAP · AFTER REMOVING THE ROOT, REPAIR ONE BRANCH 6 8 4 7 9 Swap with the smaller child until the parent is no larger than its children. One path through a complete binary tree: O(log n). A heap orders parents, not all siblings. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
