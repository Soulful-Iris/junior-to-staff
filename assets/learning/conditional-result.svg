<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Duplicate delivery, one stored result</title><desc id="desc">Duplicate delivery, one stored result. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">DUPLICATE DELIVERY, ONE STORED RESULT</text><g class="moving"><rect x="40" y="95" width="145" height="45" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="112.5" y="122.5" font-size="14" fill="#2f6f4e" text-anchor="middle">delivery A</text><rect x="40" y="210" width="145" height="45" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="112.5" y="237.5" font-size="14" fill="#2f6f4e" text-anchor="middle">retry of A</text><rect x="320" y="135" width="185" height="70" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="412.5" y="175.0" font-size="14" fill="#2f6f4e" text-anchor="middle">conditional write</text><rect x="580" y="135" width="130" height="70" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="645.0" y="175.0" font-size="14" fill="#2f6f4e" text-anchor="middle">one result</text><line x1="185" y1="118" x2="320" y2="153" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="185" y1="232" x2="320" y2="188" stroke="#c2703d" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="505" y1="170" x2="580" y2="170" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><circle r="4" fill="#2f6f4e"><animateMotion path="M190 118 L315 153" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle r="4" fill="#c2703d"><animateMotion path="M190 232 L315 188" dur="3s" begin="1s" repeatCount="indefinite"/></circle><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>First attempt: result key absent</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Atomic insert commits the result</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Acknowledgement lost; same job redelivered</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Same ID and payload: return prior success</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Identity belongs to the logical job, not each delivery.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Only the first conditional insert can create this result item.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Two deliveries can race; the store decides the winner.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>External email or payment needs its own idempotency protocol.</text></g><g class="still"><rect x="40" y="95" width="145" height="45" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="112.5" y="122.5" font-size="14" fill="#2f6f4e" text-anchor="middle">delivery A</text><rect x="40" y="210" width="145" height="45" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="112.5" y="237.5" font-size="14" fill="#2f6f4e" text-anchor="middle">retry of A</text><rect x="320" y="135" width="185" height="70" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="412.5" y="175.0" font-size="14" fill="#2f6f4e" text-anchor="middle">conditional write</text><rect x="580" y="135" width="130" height="70" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="645.0" y="175.0" font-size="14" fill="#2f6f4e" text-anchor="middle">one result</text><line x1="185" y1="118" x2="320" y2="153" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="185" y1="232" x2="320" y2="188" stroke="#c2703d" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="505" y1="170" x2="580" y2="170" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">First attempt: result key absent</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">Atomic insert commits the result</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">Acknowledgement lost; same job redelivered</text><text x="45" y="309" font-size="18" fill="#1f2b24" text-anchor="start" opacity="1">Same ID and payload: return prior success</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Identity belongs to the logical job, not each delivery.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Only the first conditional insert can create this result item.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Two deliveries can race; the store decides the winner.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">External email or payment needs its own idempotency protocol.</text></g></svg>