<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Keep the first qualifying index</title>
<desc id="desc">LOWER BOUND · FIRST VALUE ≥ 2 1 0 2 1 2 2 5 3 8 4 12 5 qualifies → hi = mid too small → lo = mid + 1 [0,6) → [0,3) → [0,1) → [1,1) The interval contracts around the insertion point; duplicates stay eligible. Answer: index 1. O(log n) comparisons · O(1) space. The rewind marks a new demonstration. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
