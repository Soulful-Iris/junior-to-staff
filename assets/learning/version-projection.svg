<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">A late event must not rewrite the present</title><desc id="desc">A late event must not rewrite the present. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A LATE EVENT MUST NOT REWRITE THE PRESENT</text><g class="moving"><rect x="45" y="100" width="170" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="130.0" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">job result: done</text><rect x="295" y="100" width="180" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="385.0" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">completion log</text><rect x="545" y="100" width="165" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="627.5" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">status view</text><line x1="215" y1="127" x2="295" y2="127" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="475" y1="127" x2="545" y2="127" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><circle r="4" fill="#2f6f4e"><animateMotion path="M220 127 H290" dur="3s" begin="0s" repeatCount="indefinite"/></circle><text x="45" y="205" font-size="12" fill="#6d6459" text-anchor="start">EVENTS ARRIVE</text><text x="475" y="205" font-size="12" fill="#6d6459" text-anchor="start">STORED STATE</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>running / v2</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>completed / v3</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>running / v2</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>running / v2</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>completed / v3</text><line x1="290" y1="244" x2="447" y2="244" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Apply newer event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Apply newer event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Reject stale event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Duplicate: no change</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Status is a projection; result storage is a separate boundary.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>A newer version advances the projection.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>A delayed event cannot overwrite a newer version.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Same version with different payload is a conflict, not a no-op.</text></g><g class="still"><rect x="45" y="100" width="170" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="130.0" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">job result: done</text><rect x="295" y="100" width="180" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="385.0" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">completion log</text><rect x="545" y="100" width="165" height="54" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="627.5" y="132.0" font-size="14" fill="#2f6f4e" text-anchor="middle">status view</text><line x1="215" y1="127" x2="295" y2="127" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="475" y1="127" x2="545" y2="127" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="45" y="205" font-size="12" fill="#6d6459" text-anchor="start">EVENTS ARRIVE</text><text x="475" y="205" font-size="12" fill="#6d6459" text-anchor="start">STORED STATE</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">running / v2</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">completed / v3</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">running / v2</text><text x="45" y="250" font-size="22" fill="#1f2b24" text-anchor="start" opacity="1">completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0">running / v2</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0">completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="0">completed / v3</text><text x="475" y="250" font-size="22" fill="#2f6f4e" text-anchor="start" opacity="1">completed / v3</text><line x1="290" y1="244" x2="447" y2="244" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0">Apply newer event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0">Apply newer event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="0">Reject stale event</text><text x="45" y="318" font-size="18" fill="#c2703d" text-anchor="start" opacity="1">Duplicate: no change</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Status is a projection; result storage is a separate boundary.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">A newer version advances the projection.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">A delayed event cannot overwrite a newer version.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Same version with different payload is a conflict, not a no-op.</text></g></svg>