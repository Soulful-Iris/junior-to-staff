<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-labelledby="recursion-return-state-title recursion-return-state-desc">
<title id="recursion-return-state-title">Recursive return state separates branch height from tree diameter</title>
<desc id="recursion-return-state-desc">Leaves d and e each return height one to b. Only after both arrive does b return height two. Node c returns height one to a. Node a returns height three while its two child branches give diameter three edges. A returned height is one extendable branch, not both branches joined together. The 15-second loop uses illustrative timing. Its labeled replay reset is not an algorithm step. Reduced-motion and print modes show the completed still study.</desc>
<defs><marker id="recursion-return-state-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#2f6f4e"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="556" rx="10" fill="#faf9f7"/>
<!-- QA sample times in seconds: 0, 2, 3.1, 5.6, 7.5, 8.6, 10, 11.1, 12.6, 14.4. Persistent geometry is outside the motion overlays. -->
