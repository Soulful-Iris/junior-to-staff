<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">A read changes eviction order</title><desc id="desc">A read changes eviction order. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A READ CHANGES EVICTION ORDER</text><g class="moving"><text x="45" y="80" font-size="18" fill="#1f2b24" text-anchor="start">capacity = 2</text><text x="105" y="125" font-size="12" fill="#6d6459" text-anchor="start">LEAST RECENT</text><text x="490" y="125" font-size="12" fill="#2f6f4e" text-anchor="start">MOST RECENT</text><line x1="235" y1="190" x2="505" y2="190" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><g transform="translate(0 0)" opacity="1"><animate attributeName="transform" values="translate(0 0);translate(0 0);translate(385 0);translate(0 0);translate(0 0)" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;1;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#2f6f4e" text-anchor="middle">A</text></g><g transform="translate(0 0)" opacity="0"><animate attributeName="transform" values="translate(385 0);translate(385 0);translate(0 0);translate(0 0);translate(385 0)" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#c2703d" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#c2703d" text-anchor="middle">B</text></g><g transform="translate(385 0)" opacity="1"><animate attributeName="transform" values="translate(385 0);translate(385 0);translate(385 0);translate(385 0);translate(385 0)" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#2f6f4e" text-anchor="middle">C</text></g><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>put(A): [A]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>put(B): [A, B]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>get(A): [B, A]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>put(C): evict B → [A, C]</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>First item occupies one entry.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>New items join the most-recent end.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Reading A moves the same node; it does not add a slot.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Eviction removes the least-recent node, B.</text></g><g class="still"><text x="45" y="80" font-size="18" fill="#1f2b24" text-anchor="start">capacity = 2</text><text x="105" y="125" font-size="12" fill="#6d6459" text-anchor="start">LEAST RECENT</text><text x="490" y="125" font-size="12" fill="#2f6f4e" text-anchor="start">MOST RECENT</text><line x1="235" y1="190" x2="505" y2="190" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><g transform="translate(0 0)" opacity="1"><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#2f6f4e" text-anchor="middle">A</text></g><g transform="translate(0 0)" opacity="0"><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#c2703d" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#c2703d" text-anchor="middle">B</text></g><g transform="translate(385 0)" opacity="1"><rect x="100" y="160" width="145" height="60" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="172.5" y="195.0" font-size="14" fill="#2f6f4e" text-anchor="middle">C</text></g><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">put(A): [A]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">put(B): [A, B]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="0">get(A): [B, A]</text><text x="45" y="293" font-size="22" fill="#1f2b24" text-anchor="start" opacity="1">put(C): evict B → [A, C]</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">First item occupies one entry.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">New items join the most-recent end.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Reading A moves the same node; it does not add a slot.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Eviction removes the least-recent node, B.</text></g></svg>