<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Remember the complement</title>
<desc id="desc">TARGET 9 · LOOK UP BEFORE INSERTING 2 0 7 1 11 2 15 3 EARLIER VALUE → INDEX insert 2 → 0 2 → 0 7 needs 2: one lookup return (0, 1) The second value finds work remembered from the first. Expected O(n) time · O(n) space · lookup first prevents using one item twice. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
