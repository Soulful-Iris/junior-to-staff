" y="96" font-size="14" fill="#1f2b24" text-anchor="start">62.5 / 62.5 / 62.5 / 62.5</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Bars grow to arrival rates. Orange line: capacity 100 units/s.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Averages hide one overloaded partition and three idle ones.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Independent writes can spread; strictly ordered work may not.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Logical DynamoDB keys do not guarantee physical placement.</text></svg>