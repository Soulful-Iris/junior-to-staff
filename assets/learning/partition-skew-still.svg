<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Unused capacity beside a hot partition</title><desc id="desc">Unused capacity beside a hot partition. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">UNUSED CAPACITY BESIDE A HOT PARTITION</text><text x="40" y="75" font-size="12" fill="#c2703d" text-anchor="start">ONE HOT KEY</text><text x="425" y="75" font-size="12" fill="#2f6f4e" text-anchor="start">FOUR LOGICAL BUCKETS</text><rect x="50" y="107" width="52" height="185" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><rect x="58" y="132" width="36" height="150" fill="#c2703d"></rect><line x1="50" y1="222" x2="102" y2="222" stroke="#c2703d" stroke-width="1.5"></line><text x="76" y="317" font-size="15" fill="#6d6459" text-anchor="middle">A</text><rect x="126" y="107" width="52" height="185" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><rect x="134" y="282" width="36" height="0" fill="#c2703d"></rect><line x1="126" y1="222" x2="178" y2="222" stroke="#c2703d" stroke-width="1.5"></line><text x="152" y="317" font-size="15" fill="#6d6459" text-anchor="middle">B</text><rect x="202" y="107" width="52" height="185" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><rect x="210" y="282" width="36" height="0" fill="#c2703d"></rect><line