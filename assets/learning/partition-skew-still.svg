<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Route around a hot key</title>
<desc id="desc">ONE HOT KEY FOUR INDEPENDENT BUCKETS A B C D 250 / 0 / 0 / 0 A B C D 62.5 each Route independent writes across keys; one hot key cannot use its idle neighbors. Bars grow to arrival rates, not stored bytes. Black line = 100 units/s; logical ≠ physical partition. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
