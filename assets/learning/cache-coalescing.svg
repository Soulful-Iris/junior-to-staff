city="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>One loader shares its result with local waiters.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>A process-local promise does not coordinate other processes.</text></g><g class="still"><text x="40" y="75" font-size="12" fill="#c2703d" text-anchor="start">SIX INDEPENDENT MISSES</text><text x="425" y="75" font-size="12" fill="#2f6f4e" text-anchor="start">ONE SHARED IN-FLIGHT LOAD</text><circle cx="55" cy="110" r="10" fill="#c2703d"></circle><line x1="55" y1="123" x2="55" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="106" cy="110" r="10" fill="#c2703d"></circle><line x1="106" y1="123" x2="106" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="157" cy="110" r="10" fill="#c2703d"></circle><line x1="157" y1="123" x2="157" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="208" cy="110" r="10" fill="#c2703d"></circle><line x1="208" y1="123" x2="208" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="259" cy="110" r="10" fill="#c2703d"></circle><line x1="259" y1="123" x2="259" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle cx="310" cy="110" r="10" fill="#c2703d"></circle><line x1="310" y1="123" x2="310" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><rect x="40" y="212" width="300" height="40" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="190.0" y="237.0" font-size="14" fill="#1f2b24" text-anchor="middle">cache miss</text><line x1="55" y1="252" x2="55" y2="285" stroke="#c2703d" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="106" y1="252" x2="106" y2="285" stroke="#c2703d" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="