<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">One miss, one local loader</title><desc id="desc">One miss, one local loader. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">ONE MISS, ONE LOCAL LOADER</text><g class="moving"><text x="40" y="75" font-size="12" fill="#c2703d" text-anchor="start">SIX INDEPENDENT MISSES</text><text x="425" y="75" font-size="12" fill="#2f6f4e" text-anchor="start">ONE SHARED IN-FLIGHT LOAD</text><circle cx="55" cy="110" r="10" fill="#c2703d"></circle><line x1="55" y1="123" x2="55" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle r="4" fill="#c2703d"><animateMotion path="M55 125 V282" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="106" cy="110" r="10" fill="#c2703d"></circle><line x1="106" y1="123" x2="106" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle r="4" fill="#c2703d"><animateMotion path="M106 125 V282" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="157" cy="110" r="10" fill="#c2703d"></circle><line x1="157" y1="123" x2="157" y2="207" stroke="#ded9d1" stroke-width="1.5"></line><circle r="4" fill="#c2703d"><animateMotion path="M157 125 V282" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="208" cy="110" r="10" fill="#c2703d"></circle><line x1="208" y1="123"