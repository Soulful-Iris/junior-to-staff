<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">A graph becomes distance layers</title>
<desc id="desc">BREADTH FIRST · EACH EDGE HAS EQUAL COST A d=0 B d=1 C d=1 D d=2 E d=3 A  →  [B, C]  →  [D]  →  [E] Two edges discover D; only the first discovery enqueues it. Mark visited at enqueue time. FIFO processes complete distance layers: O(V + E). Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
