</rect>
<text x="108.0" y="167.5" font-size="14" fill="#1f2b24" text-anchor="middle">caller</text>
<rect x="562" y="137" width="155" height="51" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef">
</rect>
<text x="639.5" y="167.5" font-size="14" fill="#1f2b24" text-anchor="middle">dependency</text>
<path d="M176 162 H330 M410 162 H562" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<circle cx="330" cy="162" r="5" fill="#1f2b24">
</circle>
<circle cx="410" cy="162" r="5" fill="#1f2b24">
</circle>
<g transform="rotate(-42 330 162)">
<path d="M330 162 H410" stroke="#c2703d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
</g>
<path d="M315 162 Q325 162 325 190 V259 H176" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
</path>
<text x="45" y="282" font-size="16" fill="#c2703d" text-anchor="start">fail fast while open</text>
<text x="410" y="246" font-size="16" fill="#2f6f4e" text-anchor="start">one probe after cooldown</text>
<text x="43" y="328" font-size="18" fill="#1f2b24" text-anchor="start">closed  →  open  →  half-open probe  →  closed if healthy</text>
<path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">An open circuit blocks normal calls. A bounded probe tests recovery.</text>
<text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">Thresholds, cooldown, and fallback are policy. A failed probe reopens the circuit.</text>
