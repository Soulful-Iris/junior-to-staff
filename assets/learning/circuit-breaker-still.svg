<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">A circuit opens, then probes recovery</title>
<desc id="desc">STOP SPENDING REQUESTS ON A FAILING DEPENDENCY caller dependency fail fast while open one probe after cooldown closed  →  open  →  half-open probe  →  closed if healthy An open circuit blocks normal calls. A bounded probe tests recovery. Thresholds, cooldown, and fallback are policy. A failed probe reopens the circuit. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
<path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/>
</marker>
</defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="420" rx="10" fill="#faf9f7"/>
