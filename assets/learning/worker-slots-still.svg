<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">A completion releases one slot</title><desc id="desc">A completion releases one slot. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A COMPLETION RELEASES ONE SLOT</text><text x="45" y="80" font-size="12" fill="#6d6459" text-anchor="start">WAITING</text><text x="290" y="80" font-size="12" fill="#2f6f4e" text-anchor="start">THREE ACTIVE SLOTS</text><text x="580" y="80" font-size="12" fill="#6d6459" text-anchor="start">COMPLETED</text><rect x="300" y="105" width="145" height="48" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="372.5" y="134.0" font-size="14" fill="#1f2b24" text-anchor="middle">slot 1</text><rect x="300" y="173" width="145" height="48" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="372.5" y="202.0" font-size="14" fill="#1f2b24" text-anchor="middle">slot 2</text><rect x="300" y="241" width="145" height="48" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="372.5" y="270.0" font-size="14" fill="#1f2b24" text-anchor="middle">slot 3</text><circle cx="605" cy="121" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="143" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="165" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="187" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="209" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="231" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="253" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="275" r="9" fill="#2f6f4e"></circle><circle cx="605" cy="297" r="9" fill="#2f6f4e"></circle><line x1="139" y1="214" x2="279" y2="214" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="455" y1="214" x2="558" y2="214" stroke="#ded9d1" stroke-width="1.5" marker-end="url(#arrow)"></line><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Jobs 1–3 occupy the three slots; six wait.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Only completion releases slots for jobs 4–6.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Jobs 7–9 start. Active work never exceeds three.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">All nine finish. Concurrency is distinct from requests per second.</text></svg>