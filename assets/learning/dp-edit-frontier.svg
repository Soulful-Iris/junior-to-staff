roke="#ded9d1" stroke-width="1.5" /><rect x="92" y="269" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="156" y="269" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="220" y="269" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="284" y="269" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="92" y="324" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="156" y="324" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="220" y="324" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><rect x="284" y="324" width="64" height="55" rx="0" fill="none" stroke="#ded9d1" stroke-width="1.5" /><text x="95" y="412" font-size="13" fill="#2f6f4e" text-anchor="start" >Green band = two retained rows.</text><rect x="417" y="126" width="311" height="278" rx="7" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="434" y="149" font-size="12" fill="#6d6459" text-anchor="start" >FIRST FOCUS: ca → cu</text><text x="435" y="182" font-size="14" fill="#c2703d" text-anchor="start" >delete a</text><text x="435" y="203" font-size="13" fill="#6d6459" text-anchor="start" >D(c, cu) + 1</text><text x="435" y="242" font-size="14" fill="#c2703d" text-anchor="start" >insert u</text><text x="435" y="263" font-size="13" fill="#6d6459" text-anchor="start" >D(ca, c) + 1</text><text x="435" y="302" font-size="14" fill="#2f6f4e" text-anchor="start" >replace a with u</text><text x="435" y="323" font-size="13" fill="#6d6459" text-anchor="start" >D(c, c) + 1</text><path d="M433 342 H711" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="435" y="372" font-size="16" fill="#1f2b24" text-anchor="start" >minimum:</text><path d="M32 443 H728" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="470" font-size="14" fill="#1f2b24" text-anchor="start" >Each cell needs optimal costs from above, left, and the upper-left diagonal.</text><text x="32" y="496" font-size="14" fill="#6d6459" text-anchor="start" >Only two numeric rows are retained for distance: O(min(m, n) + 1) space.</text><text x="32" y="522" font-size="13" fill="#6d6459" text-anchor="start" >The full grid preserves teaching history. An edit script needs extra history.</text><text x="32" y="554" font-size="12" fill="#6d6459" text-anchor="start" >Illustrative replay: reset the frontier and unfinished cells after the final hold.</text><g class="moving"><rect x="92" y="214" width="256" height="110" fill="#2f6f4e" opacity="0.08"><animate attributeName="y" values="214;214;269;269" keyTimes="0;0.527778;0.611111;1" dur="18s" repeatCount="indefinite" calcMode="linear"/></rect><text x="124" y="193" font-size="19" fill="#6d6459" text-anchor="middle" >0</text><text x="188" y="193" font-size="19" fill="#6d6459" text-anchor="middle" >1</text><text x="252" y="193" font-size="19" fill="#6d6459" text-anchor="middle" >2</text><text x="316" y="193" font-size="19" fill="#6d6459" text-anchor="middle" >3</text><text x="124" y="248" font-size="19" fill="#1f2b24" text-anchor="middle" >1</text><text x="188" y="248" font-size="19" fill="#1f2b24" text-anchor="middle" >0</text><text x="252" y="248" font-size="19" fill="#1f2b24" text-anchor="middle" >1</text><text x="316" y="248" font-size="19" fill="#1f2b24" text-anchor="middle" >2</text><text x="124" y="303" font-size="19" fill="#1f2b24" text-anchor="middle" >2</text><text x="188" y="303" font-size="19" fill="#1f2b24" text-anchor="middle" >1</text><g opacity="1"><text x="247" y="303" font-size="18" fill="#6d6459" text-anchor="start" >·</text><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.444444;1.000000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></g><g opac