<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" width="760" height="574" role="img" aria-labelledby="dp-edit-frontier-title dp-edit-frontier-desc">
<title id="dp-edit-frontier-title">Edit-distance frontier combines optimal prefix costs</title>
<desc id="dp-edit-frontier-desc">The grid converts cat to cut. At cell D(ca,cu), deletion proposes two, insertion proposes two, and replacing a with u proposes one. The cell becomes one only after the candidates arrive. The frontier then completes the remaining cells, while a band moves from the previous/current rows to the next pair. Final distance is one. Matching, insertion, deletion and replacement use exact code-point semantics. The 18-second loop uses illustrative timing. Its labeled replay reset is not an algorithm step. Reduced-motion and print modes show the completed still study.</desc>
<defs><marker id="dp-edit-frontier-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#2f6f4e"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="574" rx="10" fill="#faf9f7"/>
