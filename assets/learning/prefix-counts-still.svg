<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">One prefix can represent several starts</title><desc id="desc">One prefix can represent several starts. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">ONE PREFIX CAN REPRESENT SEVERAL STARTS</text><text x="77.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">0</text><rect x="48" y="118" width="58" height="52" rx="5" fill="#eef2ef" stroke="#ded9d1" stroke-width="1.5"></rect><text x="77.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">1</text><text x="149.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">1</text><rect x="120" y="118" width="58" height="52" rx="5" fill="#eef2ef" stroke="#ded9d1" stroke-width="1.5"></rect><text x="149.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">-1</text><text x="221.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">2</text><rect x="192" y="118" width="58" height="52" rx="5" fill="#eef2ef" stroke="#ded9d1" stroke-width="1.5"></rect><text x="221.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">1</text><text x="48" y="79" font-size="17" fill="#1f2b24" text-anchor="start">target = 1</text><text x="370" y="84" font-size="12" fill="#6d6459" text-anchor="start">COUNT OF EARLIER PREFIXES</text><text x="385" y="139" font-size="20" fill="#1f2b24" text-anchor="start">0</text><rect x="425" y="115" height="35" width="144" fill="#2f6f4e" rx="4"></rect><text x="385" y="203" font-size="20" fill="#1f2b24" text-anchor="start">1</text><rect x="425" y="179" height="35" width="144" fill="#2f6f4e" rx="4"></rect><text x="590" y="139" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">1</text><text x="590" y="139" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">1</text><text x="590" y="139" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">2</text><text x="590" y="139" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="1">2</text><text x="590" y="203" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">0</text><text x="590" y="203" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">1</text><text x="590" y="203" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="0">1</text><text x="590" y="203" font-size="20" fill="#2f6f4e" text-anchor="start" opacity="1">2</text><text x="48" y="235" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">prefix = 0</text><text x="48" y="235" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">prefix = 1</text><text x="48" y="235" font-size="20" fill="#1f2b24" text-anchor="start" opacity="0">prefix = 0</text><text x="48" y="235" font-size="20" fill="#1f2b24" text-anchor="start" opacity="1">prefix = 1</text><text x="48" y="276" font-size="24" fill="#2f6f4e" text-anchor="start" opacity="0">matches = 0</text><text x="48" y="276" font-size="24" fill="#2f6f4e" text-anchor="start" opacity="0">matches = 1</text><text x="48" y="276" font-size="24" fill="#2f6f4e" text-anchor="start" opacity="0">matches = 1</text><text x="48" y="276" font-size="24" fill="#2f6f4e" text-anchor="start" opacity="1">matches = 3</text><text x="370" y="287" font-size="15" fill="#6d6459" text-anchor="start">Bar length = number of earlier starts</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Seed prefix 0 once: ranges may start at index 0.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Need prefix 0. One earlier start matches.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Need prefix -1. No match; store another prefix 0.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Need prefix 0 again. Two starts add two matches.</text></svg>