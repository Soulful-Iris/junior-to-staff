<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Lease connections within a fixed budget</title>
<desc id="desc">MANY REQUESTS SHARE A SMALL CONNECTION BUDGET request 1 request 2 request 3 request 4 request 5 request 6 connection 1 connection 2 DB acquire → use → release in finally Bound connections and the wait to acquire one. Always release a checked-out resource. Per-process pools add up across replicas; pool size × replica count must fit the database budget. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
