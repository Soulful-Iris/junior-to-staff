<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Remember the complement</title><desc id="desc">Remember the complement. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">REMEMBER THE COMPLEMENT</text><text x="84.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">0</text><rect x="55" y="118" width="58" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="84.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">2</text><text x="156.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">1</text><rect x="127" y="118" width="58" height="52" rx="5" fill="#eef2ef" stroke="#ded9d1" stroke-width="1.5"></rect><text x="156.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">7</text><text x="228.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">2</text><rect x="199" y="118" width="58" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="228.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">11</text><text x="300.0" y="106" font-size="12" fill="#6d6459" text-anchor="middle">3</text><rect x="271" y="118" width="58" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="300.0" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">15</text><text x="55" y="78" font-size="17" fill="#1f2b24" text-anchor="start">target = 9</text><text x="410" y="93" font-size="12" fill="#6d6459" text-anchor="start">VALUE → EARLIER INDEX</text><rect x="415" y="114" width="275" height="115" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="440" y="150" font-size="22" fill="#2f6f4e" text-anchor="start">2 → 0</text><line x1="290" y1="178" x2="455" y2="215" stroke="#2f6f4e" stroke-width="1.5" marker-end="url(#arrow)"></line><text x="55" y="224" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">Read 2: need 7</text><text x="55" y="224" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">Read 7: need 2</text><text x="55" y="224" font-size="18" fill="#1f2b24" text-anchor="start" opacity="0">2 is already in the map</text><text x="55" y="224" font-size="18" fill="#1f2b24" text-anchor="start" opacity="1">Return indices (0, 1)</text><path d="M55 185 v12 h130 v-12" fill="none" stroke="#c2703d" stroke-width="3" opacity="1"></path><text x="55" y="280" font-size="16" fill="#1f2b24" text-anchor="start">Lookup first. Insert only if no pair was found.</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Map starts empty; insert 2 at index 0.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">The next value finds its complement in earlier work.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Two different indices; never reuse the current item.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">One pass + remembered values: expected O(n).</text></svg>