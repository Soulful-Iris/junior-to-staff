changes the answer.</text><text x="32" y="603" font-size="14" fill="#2f6f4e" text-anchor="start" >A syntax error must still fail, even inside a branch evaluation would skip.</text><text x="32" y="633" font-size="12" fill="#6d6459" text-anchor="start" >Illustrative replay: reset parsed structure and result after the final hold.</text><g class="moving"><g opacity="0"><rect x="70" y="321" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="132" y="348" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">a == TRUE</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.166667;1.000000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="370" y="426" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="432" y="453" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">b == TRUE</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.361111;1.000000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="570" y="426" width="124" height="42" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><text x="632" y="453" font-size="14" fill="#1f2b24" text-anchor="middle" class="mono">c == TRUE</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.555556;1.000000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><circle cx="520" cy="324" r="28" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.8"/><text x="520" y="329" font-size="15" fill="#2f6f4e" text-anchor="middle" >AND</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.555556;1.000000" dur="18s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><circle cx="310" cy="236" r="28" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.8"/><text x="31