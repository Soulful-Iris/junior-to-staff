<text x="32" y="35" font-size="17" fill="#6d6459" text-anchor="start" >PARSE THE WHOLE INPUT BEFORE SHORT-CIRCUIT EVALUATION</text><text x="32" y="62" font-size="14" fill="#1f2b24" text-anchor="start" >a = True · b = False · c = False · AND binds tighter than OR.</text><rect x="44" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="119.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">a == TRUE</text><rect x="206" y="103" width="45" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="228.5" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">OR</text><rect x="264" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="339.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">b == TRUE</text><rect x="426" y="103" width="52" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="452.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">AND</text><rect x="490" y="103" width="150" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="565.0" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">c == TRUE</text><rect x="652" y="103" width="63" height="42" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5" /><text x="683.5" y="130" font-size="15" fill="#1f2b24" text-anchor="middle" class="mono">EOF</text><text x="32" y="178" font-size="12" fill="#6d6459" text-anchor="start" >Solid outlines mark parsed structure; a traveling True value marks evaluation.</text><path d="M291 253 L151 321" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M333 247 L494 309" fill="none" stroke="#ded9d1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M501 346 L450 426" fill="none" st