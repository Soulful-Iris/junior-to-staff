<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="parser-precedence-title parser-precedence-desc">
<title id="parser-precedence-title">Parser precedence fixes structure before evaluation may skip a branch</title>
<desc id="parser-precedence-desc">The policy a equals TRUE OR b equals TRUE AND c equals TRUE is parsed as OR of predicate a and an AND subtree containing predicates b and c. The record has a true, b false, c false. The complete source, including the right subtree and end of input, is parsed before evaluation. The true result of a travels to OR, which skips evaluating its already-parsed AND branch and returns true. Parenthesizing a OR b first instead gives false. The 18-second loop uses illustrative timing. Its labeled replay reset is not an algorithm step. Reduced-motion and print modes show the completed still study.</desc>
<defs><marker id="parser-precedence-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#2f6f4e"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="650" rx="10" fill="#faf9f7"/>
