28" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Jobs 1–3 occupy the three slots; six wait.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Only completion releases slots for jobs 4–6.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Jobs 7–9 start. Active work never exceeds three.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">All nine finish. Concurrency is distinct from requests per second.</text></g></svg>