<text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">Commit the business change and its event together; publish after commit.</text>
<text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">The relay can duplicate events. Consumers still need idempotency; the outbox closes the lost-event gap.</text>
