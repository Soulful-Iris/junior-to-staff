</rect>
</g>
<path d="M475 308 H735" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
</path>
<text x="475" y="334" font-size="12" fill="#6d6459" text-anchor="start">time →</text>
<path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">Start independent I/O together; total wait approaches the slowest call.</text>
<text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">Dependent operations stay ordered. Bound fan-out and handle partial failure; concurrency has a cost.</text>
