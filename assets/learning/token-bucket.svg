<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Store burst credit, refill over time</title>
<desc id="desc">BURST CAPACITY AND REFILL RATE ARE DIFFERENT LIMITS refill tokens / sec BUCKET CAPACITY: 4 admitted requests no token → reject A token pays for admission. A burst can use stored tokens, then refill limits arrivals. Ghost tokens mark bucket slots. Distributed enforcement needs atomic accounting and a clock policy. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
