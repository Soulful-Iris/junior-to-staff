<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Candidates flow into a minimum</title>
<desc id="desc">COINS [1, 3, 4] · AMOUNT 6 GREEDY 4 + 1 + 1 3 coins 1 + dp[5] 3 1 + dp[3] 2 1 + dp[2] 3 min = 2 3 + 3 Evaluate every valid last coin, then keep the smallest candidate. The recurrence exposes a choice greedy misses. O(amount × coin types) time; O(amount) space. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
<path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/>
</marker>
</defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="420" rx="10" fill="#faf9f7"/>
<text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">CANDIDATES FLOW INTO A MINIMUM</text>
<text x="40" y="73" font-size="11" fill="#6d6459" text-anchor="start">COINS [1, 3, 4] · AMOUNT 6</text>
<text x="45" y="110" font-size="11" fill="#c2703d" text-anchor="start">GREEDY</text>
<text x="45" y="152" font-size="26" fill="#c2703d" text-anchor="start">4 + 1 + 1</text>
<text x="45" y="188" font-size="17" fill="#c2703d" text-anchor="start">3 coins</text>
<rect x="320" y="105" width="165" height="46" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef">
</rect>
<text x="402.5" y="133.0" font-size="14" fill="#1f2b24" text-anchor="middle">1 + dp[5]</text>
<path d="M485 128 C535 128 520 209 585 209" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="500" y="119" font-size="14" fill="#6d6459" text-anchor="start">3</text>
<rect x="320" y="186" width="165" height="46" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef">
</rect>
<text x="402.5" y="214.0" font-size="14" fill="#1f2b24" text-anchor="middle">1 + dp[3]</text>
<path d="M485 209 C535 209 520 209 585 209" stroke="#2f6f4e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="500" y="200" font-size="14" fill="#2f6f4e" text-anchor="start">2</text>
<rect x="320" y="267" width="165" height="46" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef">
</rect>
<text x="402.5" y="295.0" font-size="14" fill="#1f2b24" text-anchor="middle">1 + dp[2]</text>
<path d="M485 290 C535 290 520 209 585 209" stroke="#ded9d1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="500" y="281" font-size="14" fill="#6d6459" text-anchor="start">3</text>
<rect x="585" y="181" width="125" height="56" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef">
</rect>
<text x="647.5" y="214.0" font-size="14" fill="#1f2b24" text-anchor="middle">min = 2</text>
<text x="590" y="268" font-size="24" fill="#2f6f4e" text-anchor="start">3 + 3</text>
<path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">Evaluate every valid last coin, then keep the smallest candidate.</text>
<text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">The recurrence exposes a choice greedy misses. O(amount × coin types) time; O(amount) space.</text>
