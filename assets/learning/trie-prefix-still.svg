<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">One prefix opens several completions</title>
<desc id="desc">PREFIX &amp;quot;ca&amp;quot; · SHARED CHARACTERS SHARE A PATH root c a r t d cat car / card Walk the prefix once, then explore descendants for matching words. Mark word endings explicitly: car is a word even though card continues. Work includes output size. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
