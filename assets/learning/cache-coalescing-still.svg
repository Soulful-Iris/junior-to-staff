<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">One load, six waiting callers</title>
<desc id="desc">INDEPENDENT MISSES ONE SHARED IN-FLIGHT LOAD independent loaders DB: 6 reads shared promise DB: 1 read Six callers converge on one loader; its result fans back out to all waiters. This promise coordinates one process. Cross-process stampedes need a separate strategy. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
