<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="760" height="568" role="img" aria-labelledby="linked-pointer-reversal-title linked-pointer-reversal-desc">
<title id="linked-pointer-reversal-title">Linked pointer reversal preserves the saved suffix</title>
<desc id="linked-pointer-reversal-desc">Three stationary nodes a, b, c show one in-place reversal iteration. Save c before b.next changes from c to a. Then previous moves to b and current to c. Node a already points to None. The final reversed prefix is b to a to None and the untouched suffix is c to None. The 13-second loop uses illustrative timing. Its labeled replay reset is not an algorithm step. Reduced-motion and print modes show the completed still study.</desc>
<defs><marker id="linked-pointer-reversal-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#2f6f4e"/></marker></defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="568" rx="10" fill="#faf9f7"/>
<!-- QA sample times in seconds: 0, 2, 3.1, 5, 6.1, 8.1, 9.6, 12.4. Persistent geometry is outside the motion overlays. -->
<text x="32" y="35" font-size="18" fill="#6d6459" text-anchor="start" >SAVE THE SUFFIX BEFORE REVERSING A LINK</text><text x="32" y="62" font-size="14" fill="#1f2b24" text-anchor="start" >Same node objects · starting state: previous = a, current = b</text><path d="M32 79 H728" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="120" y="190" width="100" height="62" rx="7" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><path d="M182 190 V252" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="229" font-size="24" fill="#2f6f4e" text-anchor="middle" >a</text><text x="201" y="207" font-size="10" fill="#6d6459" text-anchor="middle" >next</text><circle cx="201" cy="225" r="4" fill="#2f6f4e"/><rect x="320" y="190" width="100" height="62" rx="7" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><path d="M382 190 V252" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="350" y="229" font-size="24" fill="#2f6f4e" text-anchor="middle" >b</text><text x="401" y="207" font-size="10" fill="#6d6459" text-anchor="middle" >next</text><circle cx="401" cy="225" r="4" fill="#2f6f4e"/><rect x="520" y="190" width="100" height="62" rx="7" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5" /><path d="M582 190 V252" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="550" y="229" font-size="24" fill="#2f6f4e" text-anchor="middle" >c</text><text x="601" y="207" font-size="10" fill="#6d6459" text-anchor="middle" >next</text><circle cx="601" cy="225" r="4" fill="#2f6f4e"/><path d="M201 225 C235 280 155 309 99 309" fill="none" stroke="#2f6f4e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><text x="62" y="315" font-size="15" fill="#6d6459" text-anchor="start" >None</text><path d="M601 225 H669" fill="none" stroke="#2f6f4e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><text x="679" y="230" font-size="15" fill="#6d6459" text-anchor="start" >None</text><rect x="495" y="339" width="150" height="48" rx="7" fill="#faf9f7" stroke="#c2703d" stroke-width="1.5" /><text x="508" y="357" font-size="11" fill="#6d6459" text-anchor="start" >saved successor</text><text x="32" y="424" font-size="14" fill="#1f2b24" text-anchor="start" >Invariant: the reversed prefix and untouched suffix retain every original node.</text><text x="32" y="451" font-size="14" fill="#6d6459" text-anchor="start" >Save following, redirect current.next, then advance previous and current.</text><path d="M32 474 H728" fill="none" stroke="#ded9d1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="500" font-size="14" fill="#2f6f4e" text-anchor="start" >Only b.next changes in this iteration. The suffix must remain reachable.</text><text x="32" y="524" font-size="12" fill="#6d6459" text-anchor="start" >Arrow travel illustrates a reference assignment; the stored link changes at arrival.</text><text x="32" y="549" font-size="12" fill="#6d6459" text-anchor="start" >Illustrative replay: after the final hold, reset to the same starting state.</text><g class="moving"><g opacity="1"><path d="M401 225 H512" fill="none" stroke="#2f6f4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.461538;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><path d="M401 225 C425 292 270 292 226 234" fill="none" stroke="#2f6f4e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.461538;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><path d="M570 339 V261" fill="none" stroke="#c2703d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.230769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="1"><text x="508" y="378" font-size="15" fill="#6d6459" text-anchor="start" >following = —</text><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.230769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="508" y="378" font-size="15" fill="#c2703d" text-anchor="start" >following = c</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.230769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><g><rect x="-14.0" y="-13" width="28" height="26" rx="6" fill="#faf9f7" stroke="#c2703d" stroke-width="1.5" /><text x="0" y="5" font-size="13" fill="#c2703d" text-anchor="middle" >c</text><animateMotion path="M401 225 H570 V367" keyPoints="0;0;1;1" keyTimes="0;0.076923;0.230769;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></g><animate data-state-update="true" attributeName="opacity" values="0;1;0;0" keyTimes="0.000000;0.076923;0.230769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><g><rect x="-27.0" y="-13" width="54" height="26" rx="6" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.5" /><text x="0" y="5" font-size="13" fill="#2f6f4e" text-anchor="middle" >b.next</text><animateMotion path="M401 225 C425 292 270 292 226 234" keyPoints="0;0;1;1" keyTimes="0;0.307692;0.461538;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></g><animate data-state-update="true" attributeName="opacity" values="0;1;0;0" keyTimes="0.000000;0.307692;0.461538;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g><text x="150" y="109" font-size="14" fill="#2f6f4e" text-anchor="middle" >previous</text><path d="M150 116 V181" fill="none" stroke="#2f6f4e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;200 0;200 0" keyTimes="0;0.538462;0.615385;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></g><g><text x="350" y="148" font-size="14" fill="#c2703d" text-anchor="middle" >current</text><path d="M350 155 V181" fill="none" stroke="#c2703d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;200 0;200 0" keyTimes="0;0.653846;0.730769;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></g><g opacity="1"><text x="32" y="365" font-size="14" fill="#2f6f4e" text-anchor="start" >previous: a</text><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.615385;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="32" y="365" font-size="14" fill="#2f6f4e" text-anchor="start" >previous: b</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.615385;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="1"><text x="192" y="365" font-size="14" fill="#c2703d" text-anchor="start" >current: b</text><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.730769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="192" y="365" font-size="14" fill="#c2703d" text-anchor="start" >current: c</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.730769;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="1"><text x="32" y="389" font-size="14" fill="#1f2b24" text-anchor="start" >b.next: c</text><animate data-state-update="true" attributeName="opacity" values="1;0;0" keyTimes="0.000000;0.461538;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="32" y="389" font-size="14" fill="#1f2b24" text-anchor="start" >b.next: a</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.461538;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="728" y="549" font-size="11" fill="#c2703d" text-anchor="end" >REPLAY NEXT</text><animate data-state-update="true" attributeName="opacity" values="0;1;1" keyTimes="0.000000;0.923077;1.000000" dur="13s" repeatCount="indefinite" calcMode="discrete"/></g></g><g class="still"><path d="M401 225 C425 292 270 292 226 234" fill="none" stroke="#2f6f4e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><text x="350" y="109" font-size="14" fill="#2f6f4e" text-anchor="middle" >previous</text><path d="M350 116 V181" fill="none" stroke="#2f6f4e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><text x="550" y="148" font-size="14" fill="#c2703d" text-anchor="middle" >current</text><path d="M550 155 V181" fill="none" stroke="#c2703d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#linked-pointer-reversal-arrow)"/><path d="M570 339 V261" fill="none" stroke="#c2703d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="508" y="378" font-size="15" fill="#c2703d" text-anchor="start" >following = c</text><text x="32" y="365" font-size="14" fill="#2f6f4e" text-anchor="start" >previous: b</text><text x="192" y="365" font-size="14" fill="#c2703d" text-anchor="start" >current: c</text><text x="32" y="389" font-size="14" fill="#1f2b24" text-anchor="start" >b.next: a</text></g></svg>
