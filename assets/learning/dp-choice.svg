<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Greedy versus a recurrence</title><desc id="desc">Greedy versus a recurrence. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">GREEDY VERSUS A RECURRENCE</text><g class="moving"><text x="45" y="75" font-size="18" fill="#1f2b24" text-anchor="start">coins = [1, 3, 4]    amount = 6</text><text x="45" y="112" font-size="12" fill="#c2703d" text-anchor="start">GREEDY</text><text x="425" y="112" font-size="12" fill="#2f6f4e" text-anchor="start">REMEMBER SUBPROBLEMS</text><circle cx="80" cy="170" r="26" fill="#c2703d"></circle><text x="80" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">4</text><circle cx="163" cy="170" r="26" fill="#c2703d"></circle><text x="163" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">1</text><circle cx="246" cy="170" r="26" fill="#c2703d"></circle><text x="246" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">1</text><circle cx="475" cy="170" r="26" fill="#2f6f4e"></circle><text x="475" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">3</text><circle cx="565" cy="170" r="26" fill="#2f6f4e"></circle><text x="565" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">3</text><text x="48" y="224" font-size="19" fill="#c2703d" text-anchor="start">3 coins</text><text x="447" y="224" font-size="19" fill="#2f6f4e" text-anchor="start">2 coins</text><text x="45" y="272" font-size="16" fill="#1f2b24" text-anchor="start">dp[6] candidates:</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>1 + dp[5] = 3</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>1 + dp[3] = 2</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>1 + dp[2] = 3</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>min(3, 2, 3) = 2</text><text x="45" y="315" font-size="17" fill="#6d6459" text-anchor="start">dp[0..5] = [0, 1, 2, 1, 1, 2]</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Try the final coin 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Try the final coin 3: a better result.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Try the final coin 4; it does not improve the best.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.0;0.25;0.5;0.75;1.0" calcMode="discrete" dur="12s" repeatCount="indefinite"/>Greedy misses a choice that the recurrence considers.</text></g><g class="still"><text x="45" y="75" font-size="18" fill="#1f2b24" text-anchor="start">coins = [1, 3, 4]    amount = 6</text><text x="45" y="112" font-size="12" fill="#c2703d" text-anchor="start">GREEDY</text><text x="425" y="112" font-size="12" fill="#2f6f4e" text-anchor="start">REMEMBER SUBPROBLEMS</text><circle cx="80" cy="170" r="26" fill="#c2703d"></circle><text x="80" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">4</text><circle cx="163" cy="170" r="26" fill="#c2703d"></circle><text x="163" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">1</text><circle cx="246" cy="170" r="26" fill="#c2703d"></circle><text x="246" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">1</text><circle cx="475" cy="170" r="26" fill="#2f6f4e"></circle><text x="475" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">3</text><circle cx="565" cy="170" r="26" fill="#2f6f4e"></circle><text x="565" y="178" font-size="23" fill="#faf9f7" text-anchor="middle">3</text><text x="48" y="224" font-size="19" fill="#c2703d" text-anchor="start">3 coins</text><text x="447" y="224" font-size="19" fill="#2f6f4e" text-anchor="start">2 coins</text><text x="45" y="272" font-size="16" fill="#1f2b24" text-anchor="start">dp[6] candidates:</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0">1 + dp[5] = 3</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0">1 + dp[3] = 2</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="0">1 + dp[2] = 3</text><text x="230" y="272" font-size="21" fill="#2f6f4e" text-anchor="start" opacity="1">min(3, 2, 3) = 2</text><text x="45" y="315" font-size="17" fill="#6d6459" text-anchor="start">dp[0..5] = [0, 1, 2, 1, 1, 2]</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Try the final coin 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Try the final coin 3: a better result.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Try the final coin 4; it does not improve the best.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Greedy misses a choice that the recurrence considers.</text></g></svg>