<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">A warmer day empties the stack</title>
<desc id="desc">DAILY TEMPERATURES · WAITING FOR A WARMER DAY 73 0 74 1 71 2 75 3 PENDING STACK day 1 · 74 day 2 · 71 75 resolves 71, then 74 result: [1, 2, 1, 0] Pop from the top while the new temperature is warmer. Each index enters and leaves once: O(n) time. Ghost slots show where the resolved nodes came from. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
<path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/>
</marker>
</defs>
<style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style>
<rect width="760" height="420" rx="10" fill="#faf9f7"/>
<text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">A WARMER DAY EMPTIES THE STACK</text>
<text x="40" y="74" font-size="11" fill="#6d6459" text-anchor="start">DAILY TEMPERATURES · WAITING FOR A WARMER DAY</text>
