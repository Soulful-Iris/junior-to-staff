<text x="157.0" y="90" font-size="11" fill="#6d6459" text-anchor="middle">1</text>
<rect x="209" y="100" width="60" height="48" rx="5" stroke="#ded9d1" stroke-width="1.5" fill="#faf9f7">
</rect>
<text x="239.0" y="130" font-size="21" fill="#1f2b24" text-anchor="middle">71</text>
<text x="239.0" y="90" font-size="11" fill="#6d6459" text-anchor="middle">2</text>
<rect x="291" y="100" width="60" height="48" rx="5" stroke="#ded9d1" stroke-width="1.5" fill="#faf9f7">
</rect>
<text x="321.0" y="130" font-size="21" fill="#1f2b24" text-anchor="middle">75</text>
<text x="321.0" y="90" font-size="11" fill="#6d6459" text-anchor="middle">3</text>
<text x="490" y="80" font-size="11" fill="#6d6459" text-anchor="start">PENDING STACK</text>
<path d="M480 115 V291 H690 V115" stroke="#2f6f4e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
</path>
<rect x="510" y="235" width="150" height="42" rx="5" stroke="#ded9d1" stroke-width="1.5" fill="#faf9f7">
</rect>
<text x="585.0" y="261.0" font-size="14" fill="#1f2b24" text-anchor="middle">day 1 · 74</text>
<rect x="510" y="185" width="150" height="42" rx="5" stroke="#ded9d1" stroke-width="1.5" fill="#faf9f7">
