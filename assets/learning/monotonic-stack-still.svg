<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Resolve only what the new value proves</title><desc id="desc">Resolve only what the new value proves. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">RESOLVE ONLY WHAT THE NEW VALUE PROVES</text><text x="82.5" y="106" font-size="12" fill="#6d6459" text-anchor="middle">0</text><rect x="50" y="118" width="65" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="82.5" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">73</text><text x="172.5" y="106" font-size="12" fill="#6d6459" text-anchor="middle">1</text><rect x="140" y="118" width="65" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="172.5" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">74</text><text x="262.5" y="106" font-size="12" fill="#6d6459" text-anchor="middle">2</text><rect x="230" y="118" width="65" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="262.5" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">71</text><text x="352.5" y="106" font-size="12" fill="#6d6459" text-anchor="middle">3</text><rect x="320" y="118" width="65" height="52" rx="5" fill="#faf9f7" stroke="#ded9d1" stroke-width="1.5"></rect><text x="352.5" y="151" font-size="22" fill="#1f2b24" text-anchor="middle">75</text><text x="475" y="76" font-size="12" fill="#6d6459" text-anchor="start">UNRESOLVED INDICES</text><g opacity="0" transform="translate(0 0)"><rect x="500" y="252" width="135" height="40" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="567.5" y="277.0" font-size="14" fill="#2f6f4e" text-anchor="middle">0:73</text></g><g opacity="0" transform="translate(0 0)"><rect x="500" y="252" width="135" height="40" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="567.5" y="277.0" font-size="14" fill="#2f6f4e" text-anchor="middle">1:74</text></g><g opacity="0" transform="translate(0 0)"><rect x="500" y="252" width="135" height="40" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="567.5" y="277.0" font-size="14" fill="#2f6f4e" text-anchor="middle">2:71</text></g><g opacity="1" transform="translate(0 0)"><rect x="500" y="252" width="135" height="40" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="567.5" y="277.0" font-size="14" fill="#2f6f4e" text-anchor="middle">3:75</text></g><line x1="485" y1="296" x2="654" y2="296" stroke="#2f6f4e" stroke-width="1.5"></line><text x="52" y="242" font-size="15" fill="#6d6459" text-anchor="start">output wait distances</text><text x="52" y="280" font-size="23" fill="#1f2b24" text-anchor="start" opacity="0">[0, 0, 0, 0]</text><text x="52" y="280" font-size="23" fill="#1f2b24" text-anchor="start" opacity="0">[1, 0, 0, 0]</text><text x="52" y="280" font-size="23" fill="#1f2b24" text-anchor="start" opacity="0">[1, 0, 0, 0]</text><text x="52" y="280" font-size="23" fill="#1f2b24" text-anchor="start" opacity="1">[1, 2, 1, 0]</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">73 waits for something warmer.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">74 resolves 73. Pop once, then push index 1.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">71 is colder, so both pending days remain.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">75 resolves two pending days. Each index pops once.</text></svg>