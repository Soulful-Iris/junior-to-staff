<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
<title id="title">Contain the slow neighbor</title>
<desc id="desc">ONE SHARED POOL SEPARATE RESOURCE BUDGETS slow A consumes all slots slow A      healthy B A bulkhead reserves capacity so one slow dependency cannot occupy every slot. Isolation trades some utilization for containment. Shared databases and CPU can still couple the pools. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc>
