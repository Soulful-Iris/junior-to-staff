<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="title desc">
<title id="title">Stabilize first, then repair the mechanism · implementation sequence</title><desc id="desc">Teaching timeline. States are illustrative, not measured latency. A still storyboard is linked beside this image.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} .event0{animation:e0 16s step-end infinite} @keyframes e0{0%{opacity:1} 0%{opacity:1} 99.99%{opacity:1} 100%{opacity:.12}}.event1{animation:e1 16s step-end infinite} @keyframes e1{0%{opacity:0.12} 25%{opacity:1} 99.99%{opacity:1} 100%{opacity:.12}}.event2{animation:e2 16s step-end infinite} @keyframes e2{0%{opacity:0.12} 50%{opacity:1} 99.99%{opacity:1} 100%{opacity:.12}}.event3{animation:e3 16s step-end infinite} @keyframes e3{0%{opacity:0.12} 75%{opacity:1} 99.99%{opacity:1} 100%{opacity:.12}} @media(prefers-reduced-motion:reduce){.event{animation:none!important;opacity:1}}</style>
<rect width="760" height="560" rx="14" fill="#faf9f7"/>
<text x="28" y="32" font-size="11" fill="#706a61" text-anchor="start">LEARN / PREDICT / EXPLAIN</text>
<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">Stabilize first, then repair the mechanism ·</text><text x="28" y="92" font-size="22" fill="#26342e" text-anchor="start">implementation sequence</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#27664c"/></marker></defs><rect x="25" y="102" width="200" height="42" rx="7" fill="#eef2ef" stroke="#b7c8bd"/><text x="125" y="129" font-size="16" fill="#26342e" text-anchor="middle">Incident lead</text><line x1="125" y1="144" x2="125" y2="450" stroke="#c9c4bb" stroke-dasharray="4 6"/><rect x="280" y="102" width="200" height="42" rx="7" fill="#eef2ef" stroke="#b7c8bd"/><text x="380" y="129" font-size="16" fill="#26342e" text-anchor="middle">Service</text><line x1="380" y1="144" x2="380" y2="450" stroke="#c9c4bb" stroke-dasharray="4 6"/><rect x="535" y="102" width="200" height="42" rx="7" fill="#eef2ef" stroke="#b7c8bd"/><text x="635" y="129" font-size="16" fill="#26342e" text-anchor="middle">Follow-up</text><line x1="635" y1="144" x2="635" y2="450" stroke="#c9c4bb" stroke-dasharray="4 6"/><g class="event event0"><line x1="125" y1="195" x2="380" y2="195" stroke="#27664c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="167" width="664" height="25" rx="4" fill="#faf9f7"/><text x="58" y="185" font-size="15" fill="#26342e" text-anchor="start">1. Apply one bounded mitigation</text></g><g class="event event1"><line x1="380" y1="268" x2="125" y2="268" stroke="#27664c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="240" width="664" height="25" rx="4" fill="#faf9f7"/><text x="58" y="258" font-size="15" fill="#26342e" text-anchor="start">2. Report user outcome and error rate</text></g><g class="event event2"><line x1="125" y1="341" x2="635" y2="341" stroke="#27664c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="313" width="664" height="25" rx="4" fill="#faf9f7"/><text x="58" y="331" font-size="15" fill="#26342e" text-anchor="start">3. Record contributing conditions</text></g><g class="event event3"><line x1="635" y1="414" x2="380" y2="414" stroke="#27664c" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="386" width="664" height="25" rx="4" fill="#faf9f7"/><text x="58" y="404" font-size="15" fill="#26342e" text-anchor="start">4. Add prevention and verify its failure test</text></g><text x="28" y="492" font-size="15" fill="#26342e" text-anchor="start">What would prove the follow-up prevents recurrence rather than just documenting it?</text></svg>