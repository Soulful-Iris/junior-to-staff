<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Duplicate delivery, one stored result</title><desc id="desc">SAME LOGICAL JOB · TWO DELIVERIES delivery A retry of A insert if absent one result return prior success atomic boundary The store admits one insert. A matching retry receives the saved result. Reuse the logical job ID and verify its payload. External side effects need their own protocol. Motion timing is illustrative, not a production measurement. The loop restart is not a system event.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">DUPLICATE DELIVERY, ONE STORED RESULT</text><text x="40" y="73" font-size="11" fill="#6d6459" text-anchor="start">SAME LOGICAL JOB · TWO DELIVERIES</text><rect x="40" y="105" width="140" height="42" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef"></rect><text x="110.0" y="131.0" font-size="14" fill="#1f2b24" text-anchor="middle">delivery A</text><rect x="40" y="229" width="140" height="42" rx="5" stroke="#c2703d" stroke-width="1.5" fill="#eef2ef"></rect><text x="110.0" y="255.0" font-size="14" fill="#1f2b24" text-anchor="middle">retry of A</text><rect x="335" y="151" width="164" height="58" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef"></rect><text x="417.0" y="185.0" font-size="14" fill="#1f2b24" text-anchor="middle">insert if absent</text><rect x="592" y="151" width="124" height="58" rx="5" stroke="#2f6f4e" stroke-width="1.5" fill="#eef2ef"></rect><text x="654.0" y="185.0" font-size="14" fill="#1f2b24" text-anchor="middle">one result</text><path d="M180 126 L335 166" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><path d="M180 250 L335 194" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><path d="M499 180 H592" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><path d="M417 209 V305 H110 V278" stroke="#2f6f4e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"></path><text x="439" y="286" font-size="15" fill="#2f6f4e" text-anchor="start">return prior success</text><text x="340" y="130" font-size="13" fill="#6d6459" text-anchor="start">atomic boundary</text><path d="M32 350 H728" stroke="#ded9d1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="379" font-size="15" fill="#1f2b24" text-anchor="start">The store admits one insert. A matching retry receives the saved result.</text><text x="32" y="402" font-size="13" fill="#6d6459" text-anchor="start">Reuse the logical job ID and verify its payload. External side effects need their own protocol.</text></svg>
