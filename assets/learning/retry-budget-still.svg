<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">Retries consume capacity and time · all four states</text>
<text x="28" y="119" font-size="12" fill="#706a61" text-anchor="start">STEP</text><text x="90" y="119" font-size="12" fill="#a45134" text-anchor="start">WITHOUT</text><text x="416" y="119" font-size="12" fill="#27664c" text-anchor="start">WITH</text><rect x="24" y="140" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="173" font-size="22" fill="#26342e" text-anchor="start">1</text><text x="90" y="166" font-size="16" fill="#85472f" text-anchor="start">One user request starts</text><text x="416" y="166" font-size="16" fill="#27664c" text-anchor="start">One user request starts</text><rect x="24" y="248" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="281" font-size="22" fill="#26342e" text-anchor="start">2</text><text x="90" y="274" font-size="16" fill="#85472f" text-anchor="start">Three edge attempts reach the</text><text x="90" y="301" font-size="16" fill="#85472f" text-anchor="start">service</text><text x="416" y="274" font-size="16" fill="#27664c" text-anchor="start">One layer owns a three-</text><text x="416" y="301" font-size="16" fill="#27664c" text-anchor="start">attempt budget</text><rect x="24" y="356" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="389" font-size="22" fill="#26342e" text-anchor="start">3</text><text x="90" y="382" font-size="16" fill="#85472f" text-anchor="start">Each starts three service</text><text x="90" y="409" font-size="16" fill="#85472f" text-anchor="start">attempts</text><text x="416" y="382" font-size="16" fill="#27664c" text-anchor="start">Other layers do not add</text><text x="416" y="409" font-size="16" fill="#27664c" text-anchor="start">retries</text><rect x="24" y="464" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="497" font-size="22" fill="#26342e" text-anchor="start">4</text><text x="90" y="490" font-size="16" fill="#85472f" text-anchor="start">Each starts three DB</text><text x="90" y="517" font-size="16" fill="#85472f" text-anchor="start">attempts: up to 27</text><text x="416" y="490" font-size="16" fill="#27664c" text-anchor="start">At most three DB attempts</text><text x="416" y="517" font-size="16" fill="#27664c" text-anchor="start">within deadline</text><text x="28" y="607" font-size="15" fill="#26342e" text-anchor="start">How does a bounded retry count still overload a dependency during a large outage?</text></svg>