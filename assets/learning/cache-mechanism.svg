<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
<title id="title">A cache miss can become a traffic multiplier</title><desc id="desc">Teaching timeline. States are illustrative, not measured latency. A still storyboard is linked beside this image.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} .f0{opacity:0;animation:f0 16s step-end infinite} @keyframes f0{0%,100%{opacity:0} 0%,24.99%{opacity:1}}.f1{opacity:0;animation:f1 16s step-end infinite} @keyframes f1{0%,100%{opacity:0} 25%,49.989999999999995%{opacity:1}}.f2{opacity:0;animation:f2 16s step-end infinite} @keyframes f2{0%,100%{opacity:0} 50%,74.99%{opacity:1}}.f3{opacity:0;animation:f3 16s step-end infinite} @keyframes f3{0%,100%{opacity:0} 75%,99.99%{opacity:1}} .f3{opacity:1} @media(prefers-reduced-motion:reduce){.frame{animation:none!important;opacity:0}.f3{opacity:1}}</style>
<rect width="760" height="500" rx="14" fill="#faf9f7"/>
<text x="28" y="32" font-size="11" fill="#706a61" text-anchor="start">LEARN / PREDICT / EXPLAIN</text>
<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">A cache miss can become a traffic multiplier</text>
<g class="frame f0"><text x="35" y="125" font-size="14" fill="#a45134" text-anchor="start">INDEPENDENT MISSES</text><circle cx="51" cy="175" r="13" fill="#a45134"/><circle cx="101" cy="175" r="13" fill="#a45134"/><circle cx="151" cy="175" r="13" fill="#a45134"/><circle cx="201" cy="175" r="13" fill="#a45134"/><circle cx="251" cy="175" r="13" fill="#a45134"/><circle cx="301" cy="175" r="13" fill="#a45134"/><rect x="40" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="190" y="280" font-size="16" fill="#26342e" text-anchor="middle">Expired key</text><rect x="40" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="190" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 0 calls</text><text x="405" y="125" font-size="14" fill="#27664c" text-anchor="start">ONE SHARED LOAD</text><circle cx="421" cy="175" r="13" fill="#27664c"/><circle cx="471" cy="175" r="13" fill="#27664c"/><circle cx="521" cy="175" r="13" fill="#27664c"/><circle cx="571" cy="175" r="13" fill="#27664c"/><circle cx="621" cy="175" r="13" fill="#27664c"/><circle cx="671" cy="175" r="13" fill="#27664c"/><rect x="410" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="560" y="280" font-size="16" fill="#26342e" text-anchor="middle">Expired key</text><rect x="410" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="560" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 0 calls</text><text x="32" y="442" font-size="17" fill="#26342e" text-anchor="start">Six requests arrive for the same key.</text></g><g class="frame f1"><text x="35" y="125" font-size="14" fill="#a45134" text-anchor="start">INDEPENDENT MISSES</text><circle cx="51" cy="175" r="13" fill="#a45134"/><line x1="51" y1="189" x2="51" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="101" cy="175" r="13" fill="#a45134"/><line x1="101" y1="189" x2="101" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="151" cy="175" r="13" fill="#a45134"/><line x1="151" y1="189" x2="151" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="201" cy="175" r="13" fill="#a45134"/><line x1="201" y1="189" x2="201" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="251" cy="175" r="13" fill="#a45134"/><line x1="251" y1="189" x2="251" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="301" cy="175" r="13" fill="#a45134"/><line x1="301" y1="189" x2="301" y2="252" stroke="#a45134" stroke-width="2"/><rect x="40" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="190" y="280" font-size="16" fill="#26342e" text-anchor="middle">Expired key</text><rect x="40" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="190" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 0 calls</text><text x="405" y="125" font-size="14" fill="#27664c" text-anchor="start">ONE SHARED LOAD</text><circle cx="421" cy="175" r="13" fill="#27664c"/><line x1="421" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="471" cy="175" r="13" fill="#27664c"/><line x1="471" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="521" cy="175" r="13" fill="#27664c"/><line x1="521" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="571" cy="175" r="13" fill="#27664c"/><line x1="571" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="621" cy="175" r="13" fill="#27664c"/><line x1="621" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="671" cy="175" r="13" fill="#27664c"/><line x1="671" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><rect x="410" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="560" y="280" font-size="16" fill="#26342e" text-anchor="middle">Expired key</text><rect x="410" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="560" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 0 calls</text><text x="32" y="442" font-size="17" fill="#26342e" text-anchor="start">All observe a miss. Electing a loader is the crucial step.</text></g><g class="frame f2"><text x="35" y="125" font-size="14" fill="#a45134" text-anchor="start">INDEPENDENT MISSES</text><circle cx="51" cy="175" r="13" fill="#a45134"/><line x1="51" y1="189" x2="51" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="101" cy="175" r="13" fill="#a45134"/><line x1="101" y1="189" x2="101" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="151" cy="175" r="13" fill="#a45134"/><line x1="151" y1="189" x2="151" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="201" cy="175" r="13" fill="#a45134"/><line x1="201" y1="189" x2="201" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="251" cy="175" r="13" fill="#a45134"/><line x1="251" y1="189" x2="251" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="301" cy="175" r="13" fill="#a45134"/><line x1="301" y1="189" x2="301" y2="252" stroke="#a45134" stroke-width="2"/><rect x="40" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="190" y="280" font-size="16" fill="#26342e" text-anchor="middle">Every caller loads</text><line x1="51" y1="296" x2="51" y2="350" stroke="#a45134" stroke-width="3"/><line x1="101" y1="296" x2="101" y2="350" stroke="#a45134" stroke-width="3"/><line x1="151" y1="296" x2="151" y2="350" stroke="#a45134" stroke-width="3"/><line x1="201" y1="296" x2="201" y2="350" stroke="#a45134" stroke-width="3"/><line x1="251" y1="296" x2="251" y2="350" stroke="#a45134" stroke-width="3"/><line x1="301" y1="296" x2="301" y2="350" stroke="#a45134" stroke-width="3"/><rect x="40" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="190" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 6 calls</text><text x="405" y="125" font-size="14" fill="#27664c" text-anchor="start">ONE SHARED LOAD</text><circle cx="421" cy="175" r="13" fill="#27664c"/><line x1="421" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="471" cy="175" r="13" fill="#27664c"/><line x1="471" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="521" cy="175" r="13" fill="#27664c"/><line x1="521" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="571" cy="175" r="13" fill="#27664c"/><line x1="571" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="621" cy="175" r="13" fill="#27664c"/><line x1="621" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="671" cy="175" r="13" fill="#27664c"/><line x1="671" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><rect x="410" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="560" y="280" font-size="16" fill="#26342e" text-anchor="middle">In-flight promise</text><line x1="547" y1="296" x2="547" y2="350" stroke="#27664c" stroke-width="3"/><rect x="410" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="560" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 1 call</text><text x="32" y="442" font-size="17" fill="#26342e" text-anchor="start">Without coordination, the database repeats identical work.</text></g><g class="frame f3"><text x="35" y="125" font-size="14" fill="#a45134" text-anchor="start">INDEPENDENT MISSES</text><circle cx="51" cy="175" r="13" fill="#a45134"/><line x1="51" y1="189" x2="51" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="101" cy="175" r="13" fill="#a45134"/><line x1="101" y1="189" x2="101" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="151" cy="175" r="13" fill="#a45134"/><line x1="151" y1="189" x2="151" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="201" cy="175" r="13" fill="#a45134"/><line x1="201" y1="189" x2="201" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="251" cy="175" r="13" fill="#a45134"/><line x1="251" y1="189" x2="251" y2="252" stroke="#a45134" stroke-width="2"/><circle cx="301" cy="175" r="13" fill="#a45134"/><line x1="301" y1="189" x2="301" y2="252" stroke="#a45134" stroke-width="2"/><rect x="40" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="190" y="280" font-size="16" fill="#26342e" text-anchor="middle">Every caller loads</text><line x1="51" y1="296" x2="51" y2="350" stroke="#a45134" stroke-width="3"/><line x1="101" y1="296" x2="101" y2="350" stroke="#a45134" stroke-width="3"/><line x1="151" y1="296" x2="151" y2="350" stroke="#a45134" stroke-width="3"/><line x1="201" y1="296" x2="201" y2="350" stroke="#a45134" stroke-width="3"/><line x1="251" y1="296" x2="251" y2="350" stroke="#a45134" stroke-width="3"/><line x1="301" y1="296" x2="301" y2="350" stroke="#a45134" stroke-width="3"/><rect x="40" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="190" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 6 calls</text><text x="405" y="125" font-size="14" fill="#27664c" text-anchor="start">ONE SHARED LOAD</text><circle cx="421" cy="175" r="13" fill="#27664c"/><line x1="421" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="471" cy="175" r="13" fill="#27664c"/><line x1="471" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="521" cy="175" r="13" fill="#27664c"/><line x1="521" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="571" cy="175" r="13" fill="#27664c"/><line x1="571" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="621" cy="175" r="13" fill="#27664c"/><line x1="621" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><circle cx="671" cy="175" r="13" fill="#27664c"/><line x1="671" y1="189" x2="547" y2="252" stroke="#27664c" stroke-width="2"/><rect x="410" y="253" width="300" height="43" rx="6" fill="#eee9e0" stroke="#b5afa4"/><text x="560" y="280" font-size="16" fill="#26342e" text-anchor="middle">In-flight promise</text><line x1="547" y1="296" x2="547" y2="350" stroke="#27664c" stroke-width="3"/><rect x="410" y="350" width="300" height="48" rx="6" fill="#eef2ef" stroke="#8ea996"/><text x="560" y="380" font-size="18" fill="#26342e" text-anchor="middle">Database: 1 call</text><text x="32" y="442" font-size="17" fill="#26342e" text-anchor="start">A successful shared load fills the cache and releases waiters.</text></g></svg>