roke="#2f6f4e" stroke-width="1.5"></rect><text x="560.0" y="115.0" font-size="14" fill="#2f6f4e" text-anchor="middle">API</text><line x1="491.0" y1="128" x2="470.0" y2="160" stroke="#2f6f4e" stroke-width="1.5"></line><rect x="480" y="165" width="160" height="36" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="560.0" y="188.0" font-size="14" fill="#2f6f4e" text-anchor="middle">Service</text><line x1="491.0" y1="201" x2="470.0" y2="233" stroke="#2f6f4e" stroke-width="1.5"></line><rect x="480" y="238" width="160" height="36" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="560.0" y="261.0" font-size="14" fill="#2f6f4e" text-anchor="middle">Data client</text><line x1="491.0" y1="274" x2="470.0" y2="306" stroke="#2f6f4e" stroke-width="1.5"></line><line x1="558.5" y1="274" x2="547.5" y2="306" stroke="#2f6f4e" stroke-width="1.5"></line><line x1="626.0" y1="274" x2="625.0" y2="306" stroke="#2f6f4e" stroke-width="1.5"></line><text x="555" y="337" font-size="19" fill="#2f6f4e" text-anchor="middle">up to 3 leaf calls</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Each layer permits three total attempts in the left design.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">A retry creates more downstream retries.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">On the right, only the data-client layer repeats the call.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Bounds are per logical request; also bound aggregate retry load.</text></svg>