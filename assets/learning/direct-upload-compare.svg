<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title desc">
<title id="title">Separate metadata control from file-byte transfer</title><desc id="desc">Teaching timeline. States are illustrative, not measured latency. A still storyboard is linked beside this image.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} .step0{opacity:0;animation:s0 16s step-end infinite} @keyframes s0{0%,100%{opacity:0} 0%,24.99%{opacity:1}}.step1{opacity:0;animation:s1 16s step-end infinite} @keyframes s1{0%,100%{opacity:0} 25%,49.989999999999995%{opacity:1}}.step2{opacity:0;animation:s2 16s step-end infinite} @keyframes s2{0%,100%{opacity:0} 50%,74.99%{opacity:1}}.step3{opacity:0;animation:s3 16s step-end infinite} @keyframes s3{0%,100%{opacity:0} 75%,99.99%{opacity:1}} .step3{opacity:1} @media(prefers-reduced-motion:reduce){.frame{animation:none!important;opacity:0}.step3{opacity:1}}</style>
<rect width="760" height="480" rx="14" fill="#faf9f7"/>
<text x="28" y="32" font-size="11" fill="#706a61" text-anchor="start">LEARN / PREDICT / EXPLAIN</text>
<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">Separate metadata control from file-byte transfer</text>
<rect x="24" y="104" width="344" height="270" rx="10" fill="white" stroke="#ddd8cf"/><text x="42" y="133" font-size="12" fill="#a45134" text-anchor="start">WITHOUT THE MECHANISM</text><rect x="392" y="104" width="344" height="270" rx="10" fill="white" stroke="#ddd8cf"/><text x="410" y="133" font-size="12" fill="#27664c" text-anchor="start">WITH THE MECHANISM</text><g class="frame step0"><text x="42" y="172" font-size="13" fill="#a45134" text-anchor="start">STATE 1 / 4</text><text x="42" y="213" font-size="20" fill="#26342e" text-anchor="start">Request upload</text><rect x="42" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="119" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="196" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="273" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="42" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text><text x="410" y="172" font-size="13" fill="#27664c" text-anchor="start">STATE 1 / 4</text><text x="410" y="213" font-size="20" fill="#26342e" text-anchor="start">Request upload session</text><rect x="410" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="487" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="564" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="641" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="410" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text></g><g class="frame step1"><text x="42" y="172" font-size="13" fill="#a45134" text-anchor="start">STATE 2 / 4</text><text x="42" y="213" font-size="20" fill="#26342e" text-anchor="start">API accepts every file byte</text><rect x="42" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="119" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="196" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="273" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="42" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text><text x="410" y="172" font-size="13" fill="#27664c" text-anchor="start">STATE 2 / 4</text><text x="410" y="213" font-size="20" fill="#26342e" text-anchor="start">API returns scoped temporary</text><text x="410" y="240" font-size="20" fill="#26342e" text-anchor="start">capability</text><rect x="410" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="487" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="564" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><rect x="641" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="410" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text></g><g class="frame step2"><text x="42" y="172" font-size="13" fill="#a45134" text-anchor="start">STATE 3 / 4</text><text x="42" y="213" font-size="20" fill="#26342e" text-anchor="start">API forwards the same bytes</text><text x="42" y="240" font-size="20" fill="#26342e" text-anchor="start">to storage</text><rect x="42" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="119" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="196" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="273" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="42" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text><text x="410" y="172" font-size="13" fill="#27664c" text-anchor="start">STATE 3 / 4</text><text x="410" y="213" font-size="20" fill="#26342e" text-anchor="start">Browser sends bytes directly</text><text x="410" y="240" font-size="20" fill="#26342e" text-anchor="start">to S3</text><rect x="410" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="487" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="564" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="641" y="326" width="65" height="7" rx="3" fill="#e8e4dd"/><text x="410" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text></g><g class="frame step3"><text x="42" y="172" font-size="13" fill="#a45134" text-anchor="start">STATE 4 / 4</text><text x="42" y="213" font-size="20" fill="#26342e" text-anchor="start">Long transfers occupy API</text><text x="42" y="240" font-size="20" fill="#26342e" text-anchor="start">capacity</text><rect x="42" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="119" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="196" y="326" width="65" height="7" rx="3" fill="#a45134"/><rect x="273" y="326" width="65" height="7" rx="3" fill="#a45134"/><text x="42" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text><text x="410" y="172" font-size="13" fill="#27664c" text-anchor="start">STATE 4 / 4</text><text x="410" y="213" font-size="20" fill="#26342e" text-anchor="start">API verifies and finalizes</text><text x="410" y="240" font-size="20" fill="#26342e" text-anchor="start">metadata</text><rect x="410" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="487" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="564" y="326" width="65" height="7" rx="3" fill="#27664c"/><rect x="641" y="326" width="65" height="7" rx="3" fill="#27664c"/><text x="410" y="359" font-size="11" fill="#706a61" text-anchor="start">Cause → state change → observable result</text></g><text x="28" y="409" font-size="15" fill="#26342e" text-anchor="start">Why must finalization still check ownership and expected metadata version?</text></svg>