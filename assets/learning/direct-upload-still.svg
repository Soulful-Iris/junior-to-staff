<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc"><title id="title">Separate permission from the byte stream</title><desc id="desc">Separate permission from the byte stream. Logical teaching states; not measured production timing. See adjacent lesson for the invariant and static alternative.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#6d6459"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}@media print{.moving{display:none}.still{display:inline}}</style><rect width="760" height="420" rx="10" fill="#faf9f7"/><text x="32" y="35" font-size="16" fill="#6d6459" text-anchor="start">SEPARATE PERMISSION FROM THE BYTE STREAM</text><rect x="50" y="115" width="165" height="55" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="132.5" y="147.5" font-size="14" fill="#2f6f4e" text-anchor="middle">browser</text><rect x="480" y="72" width="195" height="55" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="577.5" y="104.5" font-size="14" fill="#2f6f4e" text-anchor="middle">API: authorize</text><rect x="480" y="247" width="195" height="65" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"></rect><text x="577.5" y="284.5" font-size="14" fill="#2f6f4e" text-anchor="middle">S3: object bytes</text><path d="M215 128 L480 99" stroke="#2f6f4e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"></path><path d="M480 120 L215 153" stroke="#2f6f4e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"></path><path d="M132 170 V278 H480" stroke="#c2703d" stroke-width="5" fill="none" marker-end="url(#arrow)"></path><text x="270" y="89" font-size="14" fill="#2f6f4e" text-anchor="start">small metadata</text><text x="259" y="163" font-size="14" fill="#2f6f4e" text-anchor="start">scoped upload capability</text><text x="170" y="263" font-size="16" fill="#c2703d" text-anchor="start">large bytes bypass API</text><line x1="32" y1="352" x2="728" y2="352" stroke="#ded9d1" stroke-width="1.5"></line><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">The API checks user permission and chooses an object key.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">The browser receives a short-lived upload capability.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="0">Bytes go directly to S3; the API is not a file proxy.</text><text x="32" y="383" font-size="16" fill="#1f2b24" text-anchor="start" opacity="1">Finalize only after checking the uploaded object and ownership.</text></svg>