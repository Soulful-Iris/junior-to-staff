<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 675" width="760" height="675" role="img" aria-labelledby="title desc">
<title id="title">Carry context across synchronous and queued work · all four states</title><desc id="desc">Teaching timeline. States are illustrative, not measured latency. A still storyboard is linked beside this image.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} </style>
<rect width="760" height="675" rx="14" fill="#faf9f7"/>
<text x="28" y="32" font-size="11" fill="#706a61" text-anchor="start">LEARN / PREDICT / EXPLAIN</text>
<text x="28" y="65" font-size="22" fill="#26342e" text-anchor="start">Carry context across synchronous and queued work · all</text><text x="28" y="92" font-size="22" fill="#26342e" text-anchor="start">four states</text>
<text x="28" y="119" font-size="12" fill="#706a61" text-anchor="start">STEP</text><text x="90" y="119" font-size="12" fill="#a45134" text-anchor="start">WITHOUT</text><text x="416" y="119" font-size="12" fill="#27664c" text-anchor="start">WITH</text><rect x="24" y="140" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="173" font-size="22" fill="#26342e" text-anchor="start">1</text><text x="90" y="166" font-size="16" fill="#85472f" text-anchor="start">API returns 202</text><text x="416" y="166" font-size="16" fill="#27664c" text-anchor="start">API records request and job</text><text x="416" y="193" font-size="16" fill="#27664c" text-anchor="start">ids</text><rect x="24" y="248" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="281" font-size="22" fill="#26342e" text-anchor="start">2</text><text x="90" y="274" font-size="16" fill="#85472f" text-anchor="start">Queue accepts the task</text><text x="416" y="274" font-size="16" fill="#27664c" text-anchor="start">Queue message carries</text><text x="416" y="301" font-size="16" fill="#27664c" text-anchor="start">correlation context</text><rect x="24" y="356" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="389" font-size="22" fill="#26342e" text-anchor="start">3</text><text x="90" y="382" font-size="16" fill="#85472f" text-anchor="start">Worker fails without request</text><text x="90" y="409" font-size="16" fill="#85472f" text-anchor="start">context</text><text x="416" y="382" font-size="16" fill="#27664c" text-anchor="start">Worker links processing span</text><text x="416" y="409" font-size="16" fill="#27664c" text-anchor="start">to job</text><rect x="24" y="464" width="712" height="98" rx="7" fill="white" stroke="#e4dfd6"/><text x="42" y="497" font-size="22" fill="#26342e" text-anchor="start">4</text><text x="90" y="490" font-size="16" fill="#85472f" text-anchor="start">User success metric hides</text><text x="90" y="517" font-size="16" fill="#85472f" text-anchor="start">unfinished work</text><text x="416" y="490" font-size="16" fill="#27664c" text-anchor="start">Completion-age metric exposes</text><text x="416" y="517" font-size="16" fill="#27664c" text-anchor="start">failure</text><text x="28" y="607" font-size="15" fill="#26342e" text-anchor="start">What metric detects jobs never completed despite successful API responses?</text></svg>