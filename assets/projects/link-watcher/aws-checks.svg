<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">Check execution on AWS</title><desc id="desc">One scheduled run → durable jobs → bounded HTTP checks → atomic history and notification intent</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#586979"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182e3e}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#526575}.service{font-size:22px;font-weight:700}.role{font-size:18px;fill:#405565}.detail{font-size:16px;fill:#526575}.edge{font-size:16px;font-weight:600}.note{font-size:18px}</style><rect width="1100" height="830" fill="#f8fafc" rx="18"/><text x="36" y="45" class="title">Check execution on AWS</text><text x="36" y="76" class="sub">One scheduled run → durable jobs → bounded HTTP checks → atomic history and notification intent</text>
<path d="M338 170 L398 170" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="335.4" y="138" width="65.19999999999999" height="24" rx="5" fill="#f8fafc"/><text x="368" y="155" text-anchor="middle" class="edge">invoke</text>
