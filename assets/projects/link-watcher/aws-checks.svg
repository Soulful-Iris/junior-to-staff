<rect x="706.6" y="138" width="48.8" height="24" rx="5" fill="#f8fafc"/><text x="731" y="155" text-anchor="middle" class="edge">send</text>
<path d="M912 227 L912 327" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="842.5" y="264" width="139.0" height="24" rx="5" fill="#f8fafc"/><text x="912" y="281" text-anchor="middle" class="edge">poll batch of 1</text>
<path d="M760 379 L338 379" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="419.0" y="348" width="262.0" height="24" rx="5" fill="#f8fafc"/><text x="550" y="365" text-anchor="middle" class="edge">claim host; read current state</text>
<path d="M760 434 L338 434" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="398.5" y="438" width="303.0" height="24" rx="5" fill="#f8fafc"/><text x="550" y="455" text-anchor="middle" class="edge">commit result + notification intent</text>
<path d="M808 472 L808 503 L550 503 L550 537" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="621.1" y="476" width="89.8" height="24" rx="5" fill="#f8fafc"/><text x="666" y="493" text-anchor="middle" class="edge">HTTPS GET</text>
<path d="M1040 227 L1080 227 L1080 598 L1064 598" stroke="#586979" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>
<rect x="36" y="115" width="302" height="112" rx="10" fill="white" stroke="#985ca9" stroke-width="2"/><rect x="36" y="115" width="6" height="112" rx="3" fill="#985ca9"/>
<text x="56" y="147" class="service">EventBridge Scheduler</text><text x="56" y="175" class="role">(scheduled trigger)</text>
<text x="56" y="202" class="detail">Monday 09:00 UTC</text>
<rect x="398" y="115" width="304" height="112" rx="10" fill="white" stroke="#c27720" stroke-width="2"/><rect x="398" y="115" width="6" height="112" rx="3" fill="#c27720"/>
<text x="418" y="147" class="service">AWS Lambda</text><text x="418" y="175" class="role">(run dispatcher)</text>
<text x="418" y="202" class="detail">Create run; enqueue stable job IDs</text>
<rect x="760" y="115" width="304" height="112" rx="10" fill="white" stroke="#985ca9" stroke-width="2"/><rect x="760" y="115" width="6" height="112" rx="3" fill="#985ca9"/>
<text x="780" y="147" class="service">Amazon SQS</text><text x="780" y="175" class="role">(durable work queue)</text>
<text x="780" y="202" class="detail">Duplicate delivery is possible</text>
<rect x="760" y="327" width="304" height="145" rx="10" fill="white" stroke="#c27720" stroke-width="2"/><rect x="760" y="327" width="6" height="145" rx="3" fill="#c27720"/>
<text x="780" y="359" class="service">AWS Lambda</text><text x="780" y="387" class="role">(HTTP check worker)</text>
<text x="780" y="414" class="detail">One job per invocation; 30 s limit</text>
<text x="780" y="436" class="detail">At most 20 concurrent invocations</text>
<rect x="36" y="327" width="302" height="145" rx="10" fill="white" stroke="#327cba" stroke-width="2"/><rect x="36" y="327" width="6" height="145" rx="3" fill="#327cba"/>
<text x="56" y="359" class="service">Amazon DynamoDB</text><text x="56" y="387" class="role">(state and coordination store)</text>
<text x="56" y="414" class="detail">Links, observations, host admission</text>
<text x="56" y="436" class="detail">Transitions + outbox in one commit</text>
<rect x="398" y="537" width="304" height="123" rx="10" fill="white" stroke="#4f7c6a" stroke-width="2"/><rect x="398" y="537" width="6" height="123" rx="3" fill="#4f7c6a"/>
<text x="418" y="569" class="service">Public HTTPS origins</text><text x="418" y="597" class="role">(external websites)</text>
<text x="418" y="624" class="detail">Validate DNS and each redirect</text>
<text x="418" y="646" class="detail">10 s total request deadline</text>
<rect x="760" y="537" width="304" height="123" rx="10" fill="white" stroke="#ac4852" stroke-width="2"/><rect x="760" y="537" width="6" height="123" rx="3" fill="#ac4852"/>
<text x="780" y="569" class="service">Amazon SQS</text><text x="780" y="597" class="role">(dead-letter queue)</text>
<text x="780" y="624" class="detail">After 5 failed deliveries</text>
<text x="780" y="646" class="detail">Alarm; inspect before redrive</text>
<text x="36" y="720" class="note">Durable truth: DynamoDB. Queue acknowledgment happens only after the result commit.</text>
<text x="36" y="753" class="note">Host admission is shared across workers; a Lambda concurrency cap alone does not protect one website.</text>
<text x="36" y="786" class="note">The supplied infrastructure foundation creates the two queues, the table and a dead-letter alarm.</text>
</svg>