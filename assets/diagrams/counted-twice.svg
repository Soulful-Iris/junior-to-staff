<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="One quarter of work counted two ways. Ten things shipped. Of those ten, two would not have happened without this engineer, three would have happened more slowly, and five would have happened anyway. The first row is the number people quote; the second row is the number the staff ladder is asking about.">
  <rect width="760" height="292" rx="10" fill="#faf9f7"/>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">ONE QUARTER, COUNTED TWICE</text>

  <!-- row 1: what shipped -->
  <text x="44" y="105" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">things I shipped</text>
  <g fill="#2f6f4e">
    <rect x="280" y="84" width="26" height="26" rx="4"/><rect x="316" y="84" width="26" height="26" rx="4"/>
    <rect x="352" y="84" width="26" height="26" rx="4"/><rect x="388" y="84" width="26" height="26" rx="4"/>
    <rect x="424" y="84" width="26" height="26" rx="4"/><rect x="460" y="84" width="26" height="26" rx="4"/>
    <rect x="496" y="84" width="26" height="26" rx="4"/><rect x="532" y="84" width="26" height="26" rx="4"/>
    <rect x="568" y="84" width="26" height="26" rx="4"/><rect x="604" y="84" width="26" height="26" rx="4"/>
  </g>
  <text x="648" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#2f6f4e">10</text>

  <!-- row 2: the counterfactual -->
  <text x="44" y="164" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">things that would not have</text>
  <text x="44" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">happened without me</text>
  <rect x="280" y="156" width="26" height="26" rx="4" fill="#2f6f4e"/>
  <rect x="316" y="156" width="26" height="26" rx="4" fill="#2f6f4e"/>
  <rect x="352" y="156" width="26" height="26" rx="4" fill="#2f6f4e" opacity="0.32"/>
  <rect x="388" y="156" width="26" height="26" rx="4" fill="#2f6f4e" opacity="0.32"/>
  <rect x="424" y="156" width="26" height="26" rx="4" fill="#2f6f4e" opacity="0.32"/>
  <g fill="#faf9f7" stroke="#c9c3b8" stroke-width="1.2">
    <rect x="460" y="156" width="26" height="26" rx="4"/><rect x="496" y="156" width="26" height="26" rx="4"/>
    <rect x="532" y="156" width="26" height="26" rx="4"/><rect x="568" y="156" width="26" height="26" rx="4"/>
    <rect x="604" y="156" width="26" height="26" rx="4"/>
  </g>
  <text x="648" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#2f6f4e">2</text>

  <!-- legend -->
  <rect x="280" y="208" width="14" height="14" rx="3" fill="#2f6f4e"/>
  <text x="302" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">only you</text>
  <rect x="420" y="208" width="14" height="14" rx="3" fill="#2f6f4e" opacity="0.32"/>
  <text x="442" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">slower without you</text>
  <rect x="570" y="208" width="14" height="14" rx="3" fill="#faf9f7" stroke="#c9c3b8" stroke-width="1.2"/>
  <text x="592" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">happened anyway</text>

  <line x1="44" y1="240" x2="716" y2="240" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="262" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">The top number is the one people quote. The middle band is senior work, done well.</text>
  <text x="44" y="282" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">There is no correct count. There is only whether you have ever done this counting honestly.</text>
</svg>
