<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="A publishing pipeline with a control and a way around it. The designed path runs from your repository through CI publishing over OIDC, through a gate that requires provenance, and into the registry. A second path runs from a compromised maintainer laptop straight to the registry using a long-lived publish token, passing underneath the gate without being checked. Both arrows end in the same place; only one was designed.">
  <rect width="760" height="336" rx="10" fill="#faf9f7"/>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">THE CONTROL YOU BUILT, AND THE PATH AROUND IT</text>

  <!-- ===== the designed path ===== -->
  <text x="44" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2f6f4e" letter-spacing="1.2">DESIGNED</text>

  <rect x="44" y="90" width="96" height="40" rx="6" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
  <text x="92" y="115" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">your repo</text>

  <line x1="140" y1="110" x2="180" y2="110" stroke="#2f6f4e" stroke-width="1.4"/>
  <path d="M 180 110 l -6 -3.5 l 0 7 z" fill="#2f6f4e"/>

  <rect x="186" y="90" width="144" height="40" rx="6" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
  <text x="258" y="107" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">CI</text>
  <text x="258" y="122" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d6459">publishes over OIDC</text>

  <line x1="330" y1="110" x2="370" y2="110" stroke="#2f6f4e" stroke-width="1.4"/>
  <path d="M 370 110 l -6 -3.5 l 0 7 z" fill="#2f6f4e"/>

  <!-- the gate -->
  <rect x="376" y="80" width="110" height="60" rx="6" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="431" y="102" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">provenance</text>
  <text x="431" y="116" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">required</text>
  <path d="M 423 126 l 5 6 l 11 -13" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="486" y1="110" x2="524" y2="110" stroke="#2f6f4e" stroke-width="1.4"/>
  <path d="M 524 110 l -6 -3.5 l 0 7 z" fill="#2f6f4e"/>

  <rect x="530" y="90" width="110" height="40" rx="6" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
  <text x="585" y="115" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">the registry</text>

  <text x="652" y="107" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">and then</text>
  <text x="652" y="121" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">everyone</text>

  <circle r="4" fill="#2f6f4e" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"
                   path="M 144 110 L 528 110"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.37;0.41;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== the second path ===== -->
  <text x="44" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#a85d2f" letter-spacing="1.2">NOT DESIGNED, STILL OPEN</text>

  <rect x="186" y="222" width="144" height="42" rx="6" fill="#faf0e9" stroke="#c2703d" stroke-width="1.3"/>
  <text x="258" y="240" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">maintainer laptop</text>
  <text x="258" y="255" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#a85d2f">compromised</text>

  <path id="bypass" d="M 330 243 L 480 243 C 530 243, 552 243, 568 164 L 568 136"
        fill="none" stroke="#c2703d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 568 130 l -4.5 7.5 l 9 0 z" fill="#c2703d"/>

  <text x="344" y="235" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a85d2f">long-lived publish token</text>

  <!-- the gate is directly above this stretch, and is never consulted -->
  <text x="376" y="178" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a857d">the gate is directly above</text>
  <text x="376" y="192" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8a857d">this stretch, and is never asked</text>

  <circle r="4" fill="#c2703d" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.9;1"
                   path="M 330 243 L 480 243 C 530 243, 552 243, 568 164 L 568 136"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.87;0.91;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <line x1="44" y1="284" x2="716" y2="284" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="306" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">Both arrows end in the same place. Only one of them was designed, and the gate is real.</text>
  <text x="44" y="326" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">The audit that matters is never "is the gate strong". It is "is the gate the only way in".</text>
</svg>
