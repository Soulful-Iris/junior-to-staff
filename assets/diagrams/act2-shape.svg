<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The act one shape drawn in grey — browser, api, store and one outside call — with the act two additions drawn in green: a pipeline that puts the artefact out, a cache in front of the store, a bounded queue with a worker, telemetry leaving to somewhere queryable, and a timeout and breaker around the outside call.">
  <rect width="760" height="380" rx="10" fill="#faf9f7"/>

  <text x="44" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">NOTHING A USER CAN SEE IS ADDED HERE</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">
    <rect x="44" y="42" width="12" height="12" rx="2" fill="#faf9f7" stroke="#a8a29a" stroke-width="1.3"/>
    <text x="62" y="52" fill="#6d6459">what act 1 gave you</text>
    <rect x="196" y="42" width="12" height="12" rx="2" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
    <text x="214" y="52" fill="#2f6f4e">what act 2 adds</text>
  </g>

  <!-- pipeline (new) -->
  <rect x="44" y="76" width="112" height="34" rx="4" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
  <text x="100" y="98" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">pipeline</text>
  <path d="M 156 93 L 307 93 L 307 120" fill="none" stroke="#2f6f4e" stroke-width="1.3"/>
  <polygon points="307,126 302,116 312,116" fill="#2f6f4e"/>
  <text x="168" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">artefact</text>

  <!-- the act 1 spine, muted -->
  <rect x="44" y="150" width="104" height="48" rx="5" fill="#faf9f7" stroke="#a8a29a" stroke-width="1.4"/>
  <text x="96" y="179" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e">browser</text>

  <rect x="242" y="126" width="130" height="96" rx="5" fill="#faf9f7" stroke="#a8a29a" stroke-width="1.4"/>
  <text x="307" y="152" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e">your api</text>

  <rect x="598" y="150" width="118" height="48" rx="5" fill="#faf9f7" stroke="#a8a29a" stroke-width="1.4"/>
  <text x="657" y="179" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e">the store</text>

  <line x1="148" y1="174" x2="236" y2="174" stroke="#a8a29a" stroke-width="1.4"/>
  <polygon points="242,174 233,170 233,178" fill="#a8a29a"/>

  <!-- cache (new), between api and store -->
  <rect x="432" y="150" width="112" height="48" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="488" y="172" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">cache</text>
  <text x="488" y="188" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d6459">stampede-guarded</text>
  <line x1="372" y1="174" x2="426" y2="174" stroke="#2f6f4e" stroke-width="1.3"/>
  <polygon points="432,174 423,170 423,178" fill="#2f6f4e"/>
  <line x1="544" y1="174" x2="592" y2="174" stroke="#2f6f4e" stroke-width="1.3"/>
  <polygon points="598,174 589,170 589,178" fill="#2f6f4e"/>

  <!-- queue + worker (new) -->
  <rect x="242" y="250" width="118" height="44" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="301" y="270" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">queue</text>
  <text x="301" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d6459">bounded, on purpose</text>

  <rect x="400" y="250" width="118" height="44" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="459" y="270" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">worker</text>
  <text x="459" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d6459">idempotent handler</text>

  <line x1="307" y1="222" x2="307" y2="244" stroke="#2f6f4e" stroke-width="1.3"/>
  <polygon points="307,250 302,240 312,240" fill="#2f6f4e"/>
  <line x1="360" y1="272" x2="394" y2="272" stroke="#2f6f4e" stroke-width="1.3"/>
  <polygon points="400,272 391,268 391,276" fill="#2f6f4e"/>

  <!-- the bounded outside call -->
  <rect x="560" y="250" width="156" height="44" rx="5" fill="#faf9f7" stroke="#c2703d" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="638" y="270" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">somebody else's</text>
  <text x="638" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">computer</text>
  <line x1="518" y1="272" x2="554" y2="272" stroke="#c2703d" stroke-width="1.6"/>
  <circle cx="536" cy="272" r="4" fill="#faf9f7" stroke="#c2703d" stroke-width="1.5"/>
  <text x="536" y="318" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#a85d2f">timeout + breaker</text>

  <!-- telemetry leaving -->
  <rect x="44" y="250" width="150" height="44" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="119" y="270" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">telemetry</text>
  <text x="119" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d6459">somewhere you can query</text>
  <g stroke="#2f6f4e" stroke-width="1.1" stroke-dasharray="3 3" fill="none">
    <path d="M 242 206 C 200 206, 160 230, 130 244"/>
    <path d="M 242 272 L 200 272"/>
  </g>

  <text x="44" y="352" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">Five new boxes, none of them a feature. This is the whole difference between something that</text>
  <text x="44" y="369" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">works while you watch it and something that survives while you sleep.</text>

  <circle r="4" fill="#c2703d">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
      path="M 148 174 L 307 174 L 488 174 L 657 174 L 488 174 L 307 174 L 148 174"/>
  </circle>
</svg>
