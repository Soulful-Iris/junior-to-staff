<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-label="Potential label-combination bound, not measured active series. Four methods times twenty routes times five statuses times ten thousand customers is four million combinations.">
  <rect width="760" height="456" rx="10" fill="#faf9f7"/>

  <defs>
    <g id="r10">
      <circle cx="3" cy="3" r="2"/><circle cx="10" cy="3" r="2"/><circle cx="17" cy="3" r="2"/><circle cx="24" cy="3" r="2"/><circle cx="31" cy="3" r="2"/><circle cx="38" cy="3" r="2"/><circle cx="45" cy="3" r="2"/><circle cx="52" cy="3" r="2"/><circle cx="59" cy="3" r="2"/><circle cx="66" cy="3" r="2"/>
    </g>
    <g id="r20"><use href="#r10"/><use href="#r10" x="70"/></g>
    <g id="r40"><use href="#r20"/><use href="#r20" x="140"/></g>
    <clipPath id="grow">
      <rect x="298" y="310" width="268" height="34">
        <animate attributeName="width" from="0" to="268" dur="1.4s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">EVERY LABEL MULTIPLIES EVERY SERIES THAT ALREADY EXISTS</text>

  <!-- row 1: the bare metric -->
  <text x="44" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1f2b24">http_request_duration</text>
  <text x="44" y="88" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">no labels</text>
  <circle cx="303" cy="76" r="2" fill="#2f6f4e"/>
  <text x="716" y="80" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">1 series</text>
  <line x1="44" y1="102" x2="716" y2="102" stroke="#ded9d1" stroke-width="1"/>

  <!-- row 2: + method -->
  <text x="44" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1f2b24">+ method</text>
  <text x="44" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2f6f4e">&#215; 4 values</text>
  <g fill="#2f6f4e"><circle cx="303" cy="132" r="2"/><circle cx="310" cy="132" r="2"/><circle cx="317" cy="132" r="2"/><circle cx="324" cy="132" r="2"/></g>
  <text x="716" y="134" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">4 series</text>
  <line x1="44" y1="156" x2="716" y2="156" stroke="#ded9d1" stroke-width="1"/>

  <!-- row 3: + route, 80 dots -->
  <text x="44" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1f2b24">+ route</text>
  <text x="44" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2f6f4e">&#215; 20 values</text>
  <g transform="translate(300,164)" fill="#2f6f4e">
    <use href="#r20"/><use href="#r20" y="7"/><use href="#r20" y="14"/><use href="#r20" y="21"/>
  </g>
  <text x="716" y="180" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">80 series</text>
  <line x1="44" y1="204" x2="716" y2="204" stroke="#ded9d1" stroke-width="1"/>

  <!-- row 4: + status_class, 400 dots -->
  <text x="44" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1f2b24">+ status_class</text>
  <text x="44" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2f6f4e">&#215; 5 values</text>
  <g transform="translate(300,218)" fill="#2f6f4e">
    <use href="#r40"/><use href="#r40" y="7"/><use href="#r40" y="14"/><use href="#r40" y="21"/><use href="#r40" y="28"/><use href="#r40" y="35"/><use href="#r40" y="42"/><use href="#r40" y="49"/><use href="#r40" y="56"/><use href="#r40" y="63"/>
  </g>
  <text x="716" y="252" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">400 series</text>
  <line x1="44" y1="298" x2="716" y2="298" stroke="#ded9d1" stroke-width="1"/>

  <!-- row 5: + customer_id, off the scale -->
  <text x="44" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#c2703d">+ customer_id</text>
  <text x="44" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c2703d">&#215; 10,000 values</text>
  <g clip-path="url(#grow)">
    <path d="M300,314 H552 l9,4.33 l-9,4.34 l9,4.33 l-9,4.34 l9,4.33 l-9,4.33 H300 Z" fill="#c2703d"/>
  </g>
  <text x="300" y="356" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c2703d">does not fit at this scale</text>
  <text x="716" y="330" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c2703d">4,000,000 series</text>

  <!-- the arithmetic -->
  <rect x="44" y="376" width="404" height="28" rx="6" fill="#eef2ef"/>
  <text x="58" y="395" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2b24">1 &#215; 4 &#215; 20 &#215; 5 &#215; 10,000 = <tspan fill="#c2703d">4,000,000 time series</tspan></text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">
    <text x="44" y="424">A series is stored and billed whether anyone ever queries it. At this dot density, four million</text>
    <text x="44" y="442">would cover about 565 pages this size. Unbounded ids belong on spans and logs, not on a metric.</text>
  </g>
</svg>
