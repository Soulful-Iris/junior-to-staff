<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Two pull requests branch from the same commit on main. One renames a function, the other adds a call to the old name. Each is tested against main as it stood at the branch point and each passes. Both then land, and main goes red. Every check was true about a state that no longer existed when the change shipped.">
  <rect width="760" height="330" rx="10" fill="#faf9f7"/>

  <text x="44" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">EVERY CHECK TOLD THE TRUTH</text>

  <!-- PR A -->
  <rect x="300" y="62" width="110" height="30" rx="6" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
  <text x="355" y="81" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2b24">PR A · renames fn</text>
  <path d="M 230 142 C 244 142, 250 77, 300 77" fill="none" stroke="#2f6f4e" stroke-width="1.3"/>
  <path d="M 410 77 C 456 77, 460 142, 470 142" fill="none" stroke="#2f6f4e" stroke-width="1.3"/>
  <path d="M 420 52 l 5 6 l 11 -13" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="54" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f6f4e">all checks passed</text>

  <!-- PR B -->
  <rect x="300" y="182" width="124" height="30" rx="6" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.3"/>
  <text x="362" y="201" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2b24">PR B · calls old fn</text>
  <path d="M 230 142 C 244 142, 250 197, 300 197" fill="none" stroke="#2f6f4e" stroke-width="1.3"/>
  <path d="M 424 197 C 494 197, 526 197, 545 142" fill="none" stroke="#2f6f4e" stroke-width="1.3"/>
  <path d="M 434 222 l 5 6 l 11 -13" fill="none" stroke="#2f6f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="454" y="224" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f6f4e">all checks passed</text>

  <!-- main -->
  <text x="44" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#6d6459" letter-spacing="1.2">MAIN</text>
  <line x1="110" y1="142" x2="545" y2="142" stroke="#2f6f4e" stroke-width="1.8"/>
  <line x1="545" y1="142" x2="680" y2="142" stroke="#c2703d" stroke-width="1.8"/>

  <circle cx="160" cy="142" r="4.5" fill="#2f6f4e"/>
  <circle cx="230" cy="142" r="6.5" fill="#faf9f7" stroke="#2f6f4e" stroke-width="2"/>
  <circle cx="470" cy="142" r="4.5" fill="#2f6f4e"/>
  <circle cx="545" cy="142" r="5.5" fill="#c2703d"/>

  <line x1="230" y1="150" x2="230" y2="158" stroke="#c9c3b8" stroke-width="1"/>
  <text x="224" y="170" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">tested against this state</text>

  <line x1="562" y1="118" x2="574" y2="130" stroke="#a85d2f" stroke-width="1.8"/>
  <line x1="574" y1="118" x2="562" y2="130" stroke="#a85d2f" stroke-width="1.8"/>
  <text x="584" y="129" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a85d2f">main is red</text>

  <!-- time moving forward under main -->
  <line x1="230" y1="126" x2="230" y2="158" stroke="#c2703d" stroke-width="1.4" opacity="0">
    <animate attributeName="x1" values="230;680;680;230" keyTimes="0;0.78;1;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="230;680;680;230" keyTimes="0;0.78;1;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0.45;0;0" keyTimes="0;0.05;0.78;0.85;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <line x1="44" y1="252" x2="716" y2="252" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="274" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">Both checks were true. Neither was true about the state that shipped, because the state that</text>
  <text x="44" y="291" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">shipped did not exist when either one ran.</text>
  <text x="44" y="314" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">A merge queue tests main plus everything ahead of you — the only state that ever ships.</text>
</svg>
