<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Illustrative coexistence overhead rises while both systems run, then falls at retirement. A stalled migration retains old-system obligations even when migrated users already benefit. The shape is a teaching example, not measured data.">
  <rect width="760" height="340" rx="10" fill="#faf9f7"/>

  <text x="44" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">COEXISTENCE OVERHEAD · RETIREMENT REMOVES THE OLD OBLIGATION</text>

  <!-- axes -->
  <line x1="90" y1="256" x2="716" y2="256" stroke="#c9c3b8" stroke-width="1.3"/>
  <line x1="90" y1="256" x2="90" y2="66" stroke="#c9c3b8" stroke-width="1.3"/>
  <text x="46" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d">COST</text>

  <!-- the double-running band -->
  <path d="M 90 240 C 150 240, 190 136, 250 130 L 636 126 C 664 126, 676 170, 690 244"
        fill="none" stroke="#2f6f4e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 90 240 C 150 240, 190 136, 250 130 L 636 126 C 664 126, 676 170, 690 244 L 690 256 L 90 256 Z"
        fill="#2f6f4e" opacity="0.07"/>

  <text x="300" y="112" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3b36">both systems running, both maintained, both understood</text>

  <!-- the abandonment point -->
  <line x1="560" y1="126" x2="560" y2="256" stroke="#c2703d" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="560" cy="127" r="5" fill="#c2703d"/>
  <text x="544" y="178" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">stop before retirement:</text>
  <text x="544" y="195" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">old-system obligations remain;</text>
  <text x="544" y="212" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">some user benefits may already exist</text>

  <!-- phase bands -->
  <g stroke="#ded9d1" stroke-width="1.4">
    <line x1="90" y1="276" x2="246" y2="276"/>
    <line x1="254" y1="276" x2="496" y2="276"/>
    <line x1="504" y1="276" x2="690" y2="276"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.5">
    <text x="90" y="294">DE-RISK</text>
    <text x="254" y="294">ENABLE</text>
    <text x="504" y="294">FINISH</text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d6459">
    <text x="90" y="312">safe hard-case tests</text>
    <text x="254" y="312">make it cheap for everyone else</text>
    <text x="504" y="312">block, count down, delete</text>
  </g>
</svg>
