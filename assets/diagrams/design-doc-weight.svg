<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Two columns comparing how much of a design document people typically write against how much each part actually carries. Background and the design itself take most of the pages but carry little. Non-goals and alternatives considered are short and carry almost all of the weight.">
  <rect width="760" height="330" rx="10" fill="#faf9f7"/>

  <text x="44" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">WHAT GETS WRITTEN  ·  WHAT ACTUALLY CARRIES THE ARGUMENT</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">
    <text x="264" y="62">PAGES WRITTEN</text>
    <text x="470" y="62">WEIGHT IT CARRIES</text>
  </g>

  <!-- rows -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">
    <text x="44" y="94">context and background</text>
    <text x="44" y="140">the design itself</text>
    <text x="44" y="186">non-goals</text>
    <text x="44" y="232">alternatives considered</text>
    <text x="44" y="278">the API listing</text>
  </g>

  <!-- written column -->
  <g fill="#dfe7e1" stroke="#7f9b8b" stroke-width="1.1">
    <rect x="256" y="80" width="118" height="18" rx="3"/>
    <rect x="256" y="126" width="152" height="18" rx="3"/>
    <rect x="256" y="172" width="22"  height="18" rx="3"/>
    <rect x="256" y="218" width="34"  height="18" rx="3"/>
    <rect x="256" y="264" width="136" height="18" rx="3"/>
  </g>

  <!-- weight column -->
  <g>
    <rect x="466" y="80"  width="30"  height="18" rx="3" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.1"/>
    <rect x="466" y="126" width="72"  height="18" rx="3" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.1"/>
    <rect x="466" y="172" width="168" height="18" rx="3" fill="#c2703d" stroke="#a85d2f" stroke-width="1.1"/>
    <rect x="466" y="218" width="190" height="18" rx="3" fill="#c2703d" stroke="#a85d2f" stroke-width="1.1"/>
    <rect x="466" y="264" width="14"  height="18" rx="3" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.1"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a85d2f">
    <text x="644" y="186">the two</text>
    <text x="662" y="232">everyone skips</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">
    <text x="44" y="310">Non-goals let a reviewer stop worrying. Alternatives are where credibility lives. Both are short.</text>
  </g>
</svg>
