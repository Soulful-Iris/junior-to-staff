<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="One artefact is built once from a commit and promoted unchanged through local, staging and production. Configuration is injected per environment and secrets are injected separately at run time, never built into the artefact.">
  <rect width="760" height="320" rx="10" fill="#faf9f7"/>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">BUILD ONCE · PROMOTE THE SAME THING</text>

  <!-- commit -> build -->
  <rect x="44" y="60" width="96" height="40" rx="4" fill="#faf9f7" stroke="#8a857d" stroke-width="1.3"/>
  <text x="92" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3f3b36">commit</text>

  <line x1="140" y1="80" x2="180" y2="80" stroke="#8a857d" stroke-width="1.3"/>
  <polygon points="186,80 178,76 178,84" fill="#8a857d"/>

  <rect x="186" y="60" width="104" height="40" rx="4" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.6"/>
  <text x="238" y="85" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2b24">artefact</text>

  <!-- promotion rail -->
  <line x1="290" y1="80" x2="706" y2="80" stroke="#2f6f4e" stroke-width="1.6"/>
  <g fill="#2f6f4e">
    <polygon points="712,80 702,75 702,85"/>
  </g>

  <!-- environments -->
  <g>
    <rect x="360" y="132" width="104" height="40" rx="4" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.4"/>
    <rect x="490" y="132" width="104" height="40" rx="4" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.4"/>
    <rect x="620" y="132" width="104" height="40" rx="4" fill="#2f6f4e" stroke="#2f6f4e" stroke-width="1.4"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">
    <text x="412" y="157" fill="#1f2b24">local</text>
    <text x="542" y="157" fill="#1f2b24">staging</text>
    <text x="672" y="157" fill="#faf9f7">production</text>
  </g>
  <g stroke="#2f6f4e" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="412" y1="88" x2="412" y2="130"/>
    <line x1="542" y1="88" x2="542" y2="130"/>
    <line x1="672" y1="88" x2="672" y2="130"/>
  </g>

  <!-- config injected -->
  <rect x="44" y="196" width="150" height="34" rx="4" fill="#faf9f7" stroke="#8a857d" stroke-width="1.2"/>
  <text x="119" y="218" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3b36">configuration</text>
  <rect x="44" y="244" width="150" height="34" rx="4" fill="#faf9f7" stroke="#c2703d" stroke-width="1.4"/>
  <text x="119" y="266" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">secrets</text>

  <g stroke="#8a857d" stroke-width="1.1">
    <path d="M 194 213 C 300 213, 320 182, 412 176" fill="none"/>
    <path d="M 194 213 C 340 213, 430 182, 542 176" fill="none"/>
    <path d="M 194 213 C 380 213, 540 182, 672 176" fill="none"/>
  </g>
  <g stroke="#c2703d" stroke-width="1.3">
    <path d="M 194 261 C 360 261, 560 210, 672 178" fill="none"/>
  </g>

  <text x="214" y="300" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">The artefact never changes. Only what it is told changes. Secrets arrive last,</text>
  <text x="214" y="300" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36" dy="17">at run time, from somewhere that can take them away again.</text>

  <circle r="4" fill="#c2703d">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M 290 80 L 706 80"/>
  </circle>
</svg>
