  <text x="330" y="214" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6d6459">is always a mechanism: shared state, a real clock, or</text>
  <text x="330" y="231" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6d6459">an assumption about the order tests run in</text>

  <text x="330" y="262" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">"just re-run it" is deciding not to find out which</text>

  <line x1="60" y1="288" x2="700" y2="288" stroke="#ded9d1" stroke-width="1"/>
  <text x="60" y="312" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">You cannot see this from one run, which is why nobody sees it. It takes a hundred and a record of the seeds.</text>
