<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="One request travels from the browser through the router, auth and handler to the database and back as the reply; seven numbered markers show where it can stop: the network, the router, auth, the handler, the outbound fetch to someone else's server, the database, and the reply itself">
  <rect width="760" height="384" rx="10" fill="#faf9f7"/>

  <text x="32" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">ONE REQUEST, AND EVERY PLACE IT CAN STOP</text>

  <!-- your process panel -->
  <rect x="178" y="56" width="326" height="72" rx="8" fill="none" stroke="#ded9d1" stroke-width="1.5"/>
  <text x="182" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.4">YOUR PROCESS</text>

  <!-- forward wires (drawn before boxes and markers so they sit underneath) -->
  <g stroke="#6d6459" stroke-width="1.5">
    <line x1="120" y1="93" x2="182" y2="93"/>
    <line x1="274" y1="93" x2="290" y2="93"/>
    <line x1="382" y1="93" x2="398" y2="93"/>
    <line x1="490" y1="93" x2="552" y2="93"/>
    <line x1="448" y1="116" x2="448" y2="162"/>
  </g>
  <g fill="#6d6459">
    <polygon points="190,93 182,89 182,97"/>
    <polygon points="298,93 290,89 290,97"/>
    <polygon points="406,93 398,89 398,97"/>
    <polygon points="560,93 552,89 552,97"/>
    <polygon points="448,170 444,162 452,162"/>
  </g>

  <!-- reply path -->
  <path d="M 612 116 L 612 246 L 76 246 L 76 124" fill="none" stroke="#8a857d" stroke-width="1.5"/>
  <polygon points="76,116 72,124 80,124" fill="#8a857d"/>
  <text x="94" y="240" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">the reply</text>

  <!-- stations -->
  <g>
    <rect x="32" y="70" width="88" height="46" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
    <rect x="190" y="70" width="84" height="46" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
    <rect x="298" y="70" width="84" height="46" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
    <rect x="406" y="70" width="84" height="46" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
    <rect x="560" y="70" width="104" height="46" rx="5" fill="#2f6f4e" stroke="#2f6f4e" stroke-width="1.5"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b24" text-anchor="middle">
    <text x="76" y="98">browser</text>
    <text x="232" y="98">router</text>
    <text x="340" y="98">auth</text>
    <text x="448" y="98">handler</text>
    <text x="612" y="98" fill="#faf9f7">database</text>
  </g>

  <!-- the outside world -->
  <rect x="368" y="170" width="160" height="40" rx="5" fill="none" stroke="#8a857d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="448" y="194" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6d6459" text-anchor="middle">someone else's server</text>

  <!-- failure markers -->
  <g>
    <circle cx="152" cy="93" r="9" fill="#c2703d"/>
    <circle cx="274" cy="70" r="9" fill="#c2703d"/>
    <circle cx="382" cy="70" r="9" fill="#c2703d"/>
    <circle cx="490" cy="70" r="9" fill="#c2703d"/>
    <circle cx="528" cy="170" r="9" fill="#c2703d"/>
    <circle cx="664" cy="70" r="9" fill="#c2703d"/>
    <circle cx="344" cy="246" r="9" fill="#c2703d"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#faf9f7" text-anchor="middle">
    <text x="152" y="96.5">1</text>
    <text x="274" y="73.5">2</text>
    <text x="382" y="73.5">3</text>
    <text x="490" y="73.5">4</text>
    <text x="528" y="173.5">5</text>
    <text x="664" y="73.5">6</text>
    <text x="344" y="249.5">7</text>
  </g>

  <!-- one request, travelling -->
  <circle r="5" fill="#2f6f4e">
    <animateMotion dur="10s" repeatCount="indefinite" path="M 130,93 H 612 V 246 H 76 V 93 H 130"/>
  </circle>

  <!-- legend -->
  <line x1="32" y1="268" x2="728" y2="268" stroke="#ded9d1" stroke-width="1"/>
  <g>
    <circle cx="40" cy="288" r="8" fill="#c2703d"/>
    <circle cx="40" cy="310" r="8" fill="#c2703d"/>
    <circle cx="40" cy="332" r="8" fill="#c2703d"/>
    <circle cx="40" cy="354" r="8" fill="#c2703d"/>
    <circle cx="396" cy="288" r="8" fill="#c2703d"/>
    <circle cx="396" cy="310" r="8" fill="#c2703d"/>
    <circle cx="396" cy="332" r="8" fill="#c2703d"/>
    <circle cx="396" cy="354" r="5" fill="#2f6f4e"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#faf9f7" text-anchor="middle">
    <text x="40" y="291.5">1</text>
    <text x="40" y="313.5">2</text>
    <text x="40" y="335.5">3</text>
    <text x="40" y="357.5">4</text>
    <text x="396" y="291.5">5</text>
    <text x="396" y="313.5">6</text>
    <text x="396" y="335.5">7</text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3b36">
    <text x="56" y="292">network: DNS, TLS, a dropped wire</text>
    <text x="56" y="314">router: no route &#8594; 404 &#183; wrong method &#8594; 405</text>
    <text x="56" y="336">auth: not signed in &#8594; 401 &#183; not yours &#8594; 403</text>
    <text x="56" y="358">handler: bad input &#8594; 400 &#183; your bug &#8594; 500</text>
    <text x="412" y="292">outbound fetch: hangs until a timeout you chose</text>
    <text x="412" y="314">database: down, slow, or two writers on one row</text>
    <text x="412" y="336">the reply: the browser may have already given up</text>
    <text x="412" y="358" fill="#6d6459">one request, travelling the whole loop</text>
  </g>
</svg>
