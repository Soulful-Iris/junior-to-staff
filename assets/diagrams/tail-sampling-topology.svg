<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Two collector topologies for tail sampling, animated. Top: three spans of one trace pass through a round-robin load balancer and land on two different collectors. Each collector samples its fragment alone — the fragment without the error is dropped, and what reaches the backend is a one-span stump. Bottom: a stateless first layer hashes the trace id, all three spans land on the same collector, and the whole trace survives. The sampling policy is identical in both pictures; the topology is the difference.">
  <rect width="760" height="600" rx="10" fill="#faf9f7"/>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">ONE TRACE, THREE SPANS — WHERE THEY LAND DECIDES WHETHER IT SURVIVES</text>

  <!-- ===================== panel A: round robin ===================== -->
  <text x="44" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#a85d2f" letter-spacing="1.3">ROUND ROBIN — WHAT THE DEFAULT DOES TO ONE TRACE</text>

  <!-- services -->
  <g fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.2">
    <rect x="44" y="84" width="96" height="32" rx="5"/>
    <rect x="44" y="130" width="96" height="32" rx="5"/>
    <rect x="44" y="176" width="96" height="32" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">
    <text x="92" y="104">api</text>
    <text x="92" y="150">fetcher</text>
    <text x="92" y="196">worker</text>
  </g>
  <text x="44" y="228" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">three spans · one trace</text>
  <text x="44" y="243" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2f6f4e">trace 4f2a</text>

  <!-- load balancer -->
  <rect x="196" y="118" width="92" height="56" rx="5" fill="#faf9f7" stroke="#c9c3b8" stroke-width="1.4"/>
  <text x="242" y="141" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">load</text>
  <text x="242" y="157" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">balancer</text>
  <text x="242" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a857d" letter-spacing="1">ROUND ROBIN</text>

  <!-- collectors -->
  <text x="352" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a857d" letter-spacing="1">EACH SAMPLES WHATEVER ARRIVES</text>
  <g fill="#faf9f7" stroke="#c9c3b8" stroke-width="1.4">
    <rect x="352" y="84" width="118" height="36" rx="5"/>
    <rect x="352" y="172" width="118" height="36" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">
    <text x="411" y="106">collector 1</text>
    <text x="411" y="194">collector 2</text>
  </g>

  <!-- connectors -->
  <g stroke="#c9c3b8" stroke-width="1.2" fill="none">
    <line x1="140" y1="100" x2="196" y2="132"/>
    <line x1="140" y1="146" x2="196" y2="146"/>
    <line x1="140" y1="192" x2="196" y2="160"/>
    <line x1="288" y1="134" x2="352" y2="102"/>
    <line x1="288" y1="158" x2="352" y2="190"/>
  </g>

  <!-- outcome annotations -->
  <text x="492" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a85d2f">4f2a · 2 of 3 spans</text>
  <text x="492" y="112" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">no error in its half — dropped</text>
  <text x="492" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a85d2f">4f2a · 1 of 3 spans</text>
  <text x="492" y="200" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">the error span — kept</text>

  <text x="44" y="266" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">Same trace, two samplers, two verdicts. What reaches the backend is a one-span stump.</text>

  <!-- panel A spans in motion -->
  <circle r="5" fill="#2f6f4e" cx="146" cy="100">
    <animate attributeName="cx" values="146;146;242;366;366;146;146" keyTimes="0;0.05;0.17;0.29;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;100;146;102;102;100;100" keyTimes="0;0.05;0.17;0.29;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2f6f4e" cx="146" cy="146">
    <animate attributeName="cx" values="146;146;242;366;366;146;146" keyTimes="0;0.15;0.27;0.39;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="146;146;146;190;190;146;146" keyTimes="0;0.15;0.27;0.39;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2f6f4e" cx="146" cy="192">
    <animate attributeName="cx" values="146;146;242;380;380;146;146" keyTimes="0;0.25;0.37;0.49;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="192;192;146;102;102;192;192" keyTimes="0;0.25;0.37;0.49;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <line x1="44" y1="288" x2="716" y2="288" stroke="#ded9d1" stroke-width="1"/>

  <!-- ===================== panel B: routed by trace id ===================== -->
  <text x="44" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#2f6f4e" letter-spacing="1.3">ROUTED BY TRACE ID — THE TWO-LAYER FIX</text>

  <!-- services -->
  <g fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.2">
    <rect x="44" y="330" width="96" height="32" rx="5"/>
    <rect x="44" y="376" width="96" height="32" rx="5"/>
    <rect x="44" y="422" width="96" height="32" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">
    <text x="92" y="350">api</text>
    <text x="92" y="396">fetcher</text>
    <text x="92" y="442">worker</text>
  </g>
  <text x="44" y="474" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">the same three spans</text>

  <!-- layer 1 -->
  <rect x="196" y="364" width="92" height="56" rx="5" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.4"/>
  <text x="242" y="387" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">layer 1</text>
  <text x="242" y="403" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">stateless</text>
  <text x="242" y="436" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#2f6f4e" letter-spacing="1">HASH(TRACE ID)</text>

  <!-- layer 2 collectors -->
  <text x="352" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a857d" letter-spacing="1">LAYER 2 · BUFFERS AND DECIDES</text>
  <g fill="#faf9f7" stroke="#c9c3b8" stroke-width="1.4">
    <rect x="352" y="332" width="118" height="36" rx="5"/>
    <rect x="352" y="416" width="118" height="36" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2b24">
    <text x="411" y="354">collector 1</text>
    <text x="411" y="438">collector 2</text>
  </g>

  <!-- connectors -->
  <g stroke="#c9c3b8" stroke-width="1.2" fill="none">
    <line x1="140" y1="346" x2="196" y2="378"/>
    <line x1="140" y1="392" x2="196" y2="392"/>
    <line x1="140" y1="438" x2="196" y2="406"/>
    <line x1="288" y1="380" x2="352" y2="350"/>
    <line x1="288" y1="404" x2="352" y2="434"/>
  </g>

  <!-- outcome annotations -->
  <text x="492" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">other traces land here</text>
  <text x="492" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2f6f4e">4f2a · 3 of 3 spans</text>
  <text x="492" y="444" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">one decision, whole trace kept</text>

  <text x="44" y="498" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f4e">Same spans, same policy — but every 4f2a span reached one sampler, and the whole trace survived.</text>

  <!-- panel B spans in motion -->
  <circle r="5" fill="#2f6f4e" cx="146" cy="346">
    <animate attributeName="cx" values="146;146;242;366;366;146;146" keyTimes="0;0.05;0.17;0.29;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="346;346;392;434;434;346;346" keyTimes="0;0.05;0.17;0.29;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2f6f4e" cx="146" cy="392">
    <animate attributeName="cx" values="146;146;242;380;380;146;146" keyTimes="0;0.15;0.27;0.39;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="392;392;392;434;434;392;392" keyTimes="0;0.15;0.27;0.39;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2f6f4e" cx="146" cy="438">
    <animate attributeName="cx" values="146;146;242;394;394;146;146" keyTimes="0;0.25;0.37;0.49;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="438;438;392;434;434;438;438" keyTimes="0;0.25;0.37;0.49;0.84;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.80;0.83;0.93;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <line x1="44" y1="520" x2="716" y2="520" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="548" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">The policy is identical in both pictures — the difference is topology. One collector works by</text>
  <text x="44" y="566" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">accident; the accident ends at two. The routing layer is what keeps the policy true at scale.</text>
</svg>
