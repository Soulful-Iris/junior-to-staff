<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="A caller with a three-second budget: the handler spends half a second on auth and the database, hands 2.5 seconds down, but the title fetcher keeps its own ten-second timeout — so when the caller gives up at three seconds, the fetch and the worker holding it run on to 10.5 seconds, seven and a half seconds of work for nobody">
  <rect width="760" height="380" rx="10" fill="#faf9f7"/>

  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">A 3-SECOND BUDGET, SPENT DOWN A CALL CHAIN</text>

  <!-- time axis: x = 160 + 50 * seconds -->
  <line x1="160" y1="74" x2="685" y2="74" stroke="#ded9d1" stroke-width="1"/>
  <g stroke="#c9c3b8" stroke-width="1">
    <line x1="160" y1="68" x2="160" y2="74"/>
    <line x1="210" y1="68" x2="210" y2="74"/>
    <line x1="260" y1="68" x2="260" y2="74"/>
    <line x1="310" y1="68" x2="310" y2="74"/>
    <line x1="360" y1="68" x2="360" y2="74"/>
    <line x1="410" y1="68" x2="410" y2="74"/>
    <line x1="460" y1="68" x2="460" y2="74"/>
    <line x1="510" y1="68" x2="510" y2="74"/>
    <line x1="560" y1="68" x2="560" y2="74"/>
    <line x1="610" y1="68" x2="610" y2="74"/>
    <line x1="660" y1="68" x2="660" y2="74"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8a857d" text-anchor="middle">
    <text x="160" y="62">0s</text>
    <text x="210" y="62">1s</text>
    <text x="260" y="62">2s</text>
    <text x="310" y="62">3s</text>
    <text x="360" y="62">4s</text>
    <text x="410" y="62">5s</text>
    <text x="460" y="62">6s</text>
    <text x="510" y="62">7s</text>
    <text x="560" y="62">8s</text>
    <text x="610" y="62">9s</text>
    <text x="660" y="62">10s</text>
  </g>

  <!-- row 1: the caller -->
  <text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">CALLER</text>
  <text x="40" y="112" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">budget: 3.0s</text>
  <!-- remaining budget: the green region between now and the wall -->
  <rect x="161" y="85.5" width="148" height="27" rx="2" fill="#2f6f4e" fill-opacity="0.28">
    <animate attributeName="x" values="161;309;309;161" keyTimes="0;0.232;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="148;0;0;148" keyTimes="0;0.232;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="84" width="150" height="30" rx="3" fill="none" stroke="#2f6f4e" stroke-width="1.5"/>

  <!-- wall notes, right of the moment the caller leaves -->
  <text x="318" y="95" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">3.0s — the caller gives up</text>
  <text x="318" y="111" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">whatever arrives after this is thrown away</text>

  <!-- row 2: the handler -->
  <text x="40" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">YOUR HANDLER</text>
  <text x="40" y="178" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">given 3.0s</text>
  <text x="160" y="144" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">auth + db, 0.5s</text>
  <rect x="160" y="150" width="25" height="30" rx="2" fill="#2f6f4e"/>
  <rect x="185" y="150" width="500" height="30" rx="2" fill="#ded9d1" fill-opacity="0.45" stroke="#c9c3b8" stroke-width="1"/>
  <text x="497" y="169" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">blocked on the fetch — one worker, held the whole time</text>

  <!-- the budget handed down -->
  <line x1="185" y1="180" x2="185" y2="206" stroke="#2f6f4e" stroke-width="1.6"/>
  <polygon points="185,212 181,204 189,204" fill="#2f6f4e"/>
  <text x="195" y="202" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2f6f4e">2.5s left</text>

  <!-- row 3: the fetcher -->
  <text x="40" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">TITLE FETCHER</text>
  <text x="40" y="244" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">given 2.5s</text>
  <text x="40" y="260" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a85d2f">timeout: 10s</text>
  <text x="726" y="207" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#a85d2f">its own 10s timeout fires at 10.5s</text>
  <rect x="185" y="214" width="125" height="34" rx="2" fill="#eef2ef" stroke="#2f6f4e" stroke-width="1.5"/>
  <text x="247" y="235" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2f6f4e">someone waits</text>
  <rect x="310" y="214" width="375" height="34" rx="2" fill="#c2703d" fill-opacity="0.13" stroke="#c2703d" stroke-width="1.5">
    <animate attributeName="fill-opacity" values="0.13;0.24;0.13" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="497" y="235" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a85d2f">nobody is waiting</text>

  <!-- bracket under the unwanted work -->
  <path d="M 310 254 V 260 M 685 254 V 260 M 310 260 H 685" fill="none" stroke="#c2703d" stroke-width="1.2"/>
  <text x="497" y="277" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a85d2f">7.5 seconds of good work for nobody</text>

  <!-- the moment the caller leaves, drawn over everything it crosses -->
  <line x1="310" y1="74" x2="310" y2="300" stroke="#1f2b24" stroke-width="2"/>

  <!-- now: a sweep across the budget (invisible on frame one; fades in, crosses, fades out) -->
  <g opacity="0">
    <line x1="160" y1="74" x2="160" y2="300" stroke="#6d6459" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;525 0;525 0" keyTimes="0;0.8125;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.79;0.84;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <line x1="40" y1="306" x2="720" y2="306" stroke="#ded9d1" stroke-width="1"/>
  <text x="40" y="330" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">The fetch was given 2.5 seconds of the budget but kept its own 10-second timeout.</text>
  <text x="40" y="348" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">A timeout that is not derived from the budget is time spent working for nobody.</text>
</svg>
