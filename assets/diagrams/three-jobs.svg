<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img" aria-label="The same hour of an incident, staffed two ways. One person doing all three jobs has their time chopped into nineteen fragments as they switch between investigating, answering questions and deciding, with a longest clear stretch of four minutes. Three people with one job each have contiguous blocks, and the investigator gets thirty-one minutes uninterrupted.">
  <rect width="760" height="328" rx="10" fill="#faf9f7"/>

  <text x="44" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">THE SAME HOUR, STAFFED TWO WAYS</text>

  <text x="44" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#a85d2f" letter-spacing="1.2">ONE PERSON, THREE JOBS</text>

  <g>
    <rect x="150" y="76" width="40" height="24" fill="#2f6f4e"/>
    <rect x="190" y="76" width="18" height="24" fill="#c2703d"/>
    <rect x="208" y="76" width="26" height="24" fill="#2f6f4e"/>
    <rect x="234" y="76" width="14" height="24" fill="#8a857d"/>
    <rect x="248" y="76" width="22" height="24" fill="#c2703d"/>
    <rect x="270" y="76" width="34" height="24" fill="#2f6f4e"/>
    <rect x="304" y="76" width="16" height="24" fill="#c2703d"/>
    <rect x="320" y="76" width="12" height="24" fill="#8a857d"/>
    <rect x="332" y="76" width="28" height="24" fill="#2f6f4e"/>
    <rect x="360" y="76" width="20" height="24" fill="#c2703d"/>
    <rect x="380" y="76" width="30" height="24" fill="#2f6f4e"/>
    <rect x="410" y="76" width="16" height="24" fill="#8a857d"/>
    <rect x="426" y="76" width="24" height="24" fill="#c2703d"/>
    <rect x="450" y="76" width="36" height="24" fill="#2f6f4e"/>
    <rect x="486" y="76" width="18" height="24" fill="#c2703d"/>
    <rect x="504" y="76" width="22" height="24" fill="#2f6f4e"/>
    <rect x="526" y="76" width="14" height="24" fill="#8a857d"/>
    <rect x="540" y="76" width="20" height="24" fill="#c2703d"/>
    <rect x="560" y="76" width="40" height="24" fill="#2f6f4e"/>
  </g>
  <text x="612" y="85" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#a85d2f">longest stretch</text>
  <text x="612" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a85d2f">4 min</text>

  <rect x="150" y="120" width="12" height="12" rx="2" fill="#2f6f4e"/>
  <text x="168" y="130" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">investigating</text>
  <rect x="300" y="120" width="12" height="12" rx="2" fill="#c2703d"/>
  <text x="318" y="130" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">answering questions</text>
  <rect x="450" y="120" width="12" height="12" rx="2" fill="#8a857d"/>
  <text x="468" y="130" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6d6459">deciding</text>

  <line x1="44" y1="152" x2="716" y2="152" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#2f6f4e" letter-spacing="1.2">THREE PEOPLE, ONE JOB EACH</text>

  <text x="44" y="209" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">commander</text>
  <rect x="150" y="196" width="104" height="18" rx="2" fill="#8a857d"/>
  <rect x="268" y="196" width="128" height="18" rx="2" fill="#8a857d"/>
  <rect x="410" y="196" width="190" height="18" rx="2" fill="#8a857d"/>

  <text x="44" y="237" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">communicating</text>
  <rect x="150" y="224" width="450" height="18" rx="2" fill="#c2703d"/>

  <text x="44" y="265" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">investigating</text>
  <rect x="150" y="252" width="278" height="18" rx="2" fill="#2f6f4e"/>
  <rect x="442" y="252" width="158" height="18" rx="2" fill="#2f6f4e"/>
  <text x="612" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2f6f4e">31 min</text>

  <line x1="44" y1="286" x2="716" y2="286" stroke="#ded9d1" stroke-width="1"/>

  <text x="44" y="306" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">The interruptions are not rude. Somebody genuinely needs to know whether it is fixed, and the</text>
  <text x="44" y="323" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a85d2f">only person who can answer is the one who would otherwise have been finding out.</text>
</svg>
