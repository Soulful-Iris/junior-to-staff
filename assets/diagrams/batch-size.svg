  <text x="60" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">THE SAME WEEK OF WORK, SHIPPED TWO WAYS</text>
  <text x="60" y="56" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6d6459">one cell per file changed</text>

  <text x="60" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">shipped as one change: 38 files, one commit, merged on Friday</text>
  <text x="634" y="86" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d">one commit</text>
