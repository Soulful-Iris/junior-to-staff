<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" role="img" aria-label="The same week of work shipped two ways. Top: one commit touching 38 files; when production fails, every one of the 38 cells is implicated and a dark cursor sweeps slowly back and forth across the whole row, searching. Bottom: the same work as five small changes merged one at a time; the same fault ships with Thursday's seven-file change, only those seven cells are implicated, the cursor covers them almost immediately, and the other four changes stay proven good. Same bug; what changed is how much you must read to find it and how much you must undo to remove it.">
