<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="A schema change in four steps: add the new table, backfill it, switch the code, then drop the old column. The first three steps can each be walked back — drop the table, delete the copied rows, redeploy the previous code — but the drop is the point of no return: its down step re-creates the column, never the contents. A marker runs the migration forward, back, then forward past the wall and does not come back.">
  <rect width="760" height="352" rx="10" fill="#faf9f7"/>

  <text x="44" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8a857d" letter-spacing="1.6">ONE SCHEMA CHANGE · FOUR STEPS · WHERE REVERSIBILITY ENDS</text>

  <!-- the wall -->
  <text x="554" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#a85d2f" letter-spacing="1.2">POINT OF NO RETURN</text>
  <line x1="554" y1="58" x2="554" y2="300" stroke="#c2703d" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- the four steps -->
  <rect x="44" y="64" width="150" height="88" rx="6" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.4"/>
  <rect x="218" y="64" width="150" height="88" rx="6" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.4"/>
  <rect x="392" y="64" width="150" height="88" rx="6" fill="#faf9f7" stroke="#2f6f4e" stroke-width="1.4"/>
  <rect x="566" y="64" width="150" height="88" rx="6" fill="#faf9f7" stroke="#c2703d" stroke-width="1.5"/>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">
    <text x="119" y="84">STEP 1 · ADD</text>
    <text x="293" y="84">STEP 2 · BACKFILL</text>
    <text x="467" y="84">STEP 3 · SWITCH</text>
    <text x="641" y="84">STEP 4 · REMOVE</text>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2b24">
    <text x="119" y="105">CREATE TABLE reads</text>
    <text x="293" y="105">INSERT … SELECT</text>
    <text x="641" y="105">DROP COLUMN read</text>
  </g>
  <text x="467" y="105" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2b24">deploy the new code</text>

  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6459">
    <text x="119" y="124">a new, empty home;</text>
    <text x="119" y="139">nothing reads it yet</text>
    <text x="293" y="124">old facts copied in;</text>
    <text x="293" y="139">old column untouched</text>
    <text x="467" y="124">reads and writes now</text>
    <text x="467" y="139">use the new table</text>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a85d2f">
    <text x="641" y="124">the old home is gone,</text>
    <text x="641" y="139">and everything in it</text>
  </g>

  <!-- forward arrows between steps -->
  <g stroke="#8a857d" stroke-width="1.3">
    <line x1="196" y1="108" x2="206" y2="108"/>
    <line x1="370" y1="108" x2="380" y2="108"/>
    <line x1="544" y1="108" x2="554" y2="108"/>
  </g>
  <g fill="#8a857d">
    <polygon points="212,108 204,104 204,112"/>
    <polygon points="386,108 378,104 378,112"/>
    <polygon points="560,108 552,104 552,112"/>
  </g>

  <!-- rehearsal rail -->
  <text x="56" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a857d" letter-spacing="1.2">THE REHEARSAL · ON A COPY</text>
  <line x1="56" y1="170" x2="728" y2="170" stroke="#ded9d1" stroke-width="1.2"/>

  <!-- reversibility bands -->
  <rect x="44" y="186" width="506" height="106" rx="6" fill="#eef2ef"/>
  <rect x="558" y="186" width="158" height="106" rx="6" fill="#c2703d" fill-opacity="0.07"/>

  <text x="56" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#2f6f4e" letter-spacing="1.4">STILL REVERSIBLE</text>
  <text x="570" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#a85d2f" letter-spacing="1.4">NO WAY BACK</text>

  <line x1="536" y1="222" x2="68" y2="222" stroke="#2f6f4e" stroke-width="1.5"/>
  <polygon points="62,222 70,218 70,226" fill="#2f6f4e"/>

  <line x1="566" y1="213" x2="566" y2="231" stroke="#c2703d" stroke-width="3"/>
  <line x1="704" y1="222" x2="576" y2="222" stroke="#c2703d" stroke-width="1.5"/>
  <polygon points="570,222 578,218 578,226" fill="#c2703d"/>

  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#3f3b36">
    <text x="119" y="246">down: drop</text>
    <text x="119" y="261">the new table</text>
    <text x="293" y="246">down: delete</text>
    <text x="293" y="261">the copied rows</text>
    <text x="467" y="246">down: deploy</text>
    <text x="467" y="261">the previous code</text>
  </g>
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a85d2f">
    <text x="641" y="246">the down step re-adds</text>
    <text x="641" y="261">the column — empty;</text>
    <text x="641" y="276">not what was in it</text>
  </g>

  <text x="44" y="318" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">Rehearse it on a copy: up, down, up again. Every step walks back until the drop —</text>
  <text x="44" y="336" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3b36">its down step can re-create the column, never the contents. Back up before step 4, not after.</text>

  <!-- the rehearsing marker: up, down, up again, then past the wall and gone -->
  <circle r="4.5" fill="#2f6f4e">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="paced" path="M 56 170 L 467 170 L 56 170 L 728 170"/>
    <animate attributeName="fill" calcMode="discrete" values="#2f6f4e;#c2703d" keyTimes="0;0.8835" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.955;1" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
