{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "Learning lab: SQS Lambda DynamoDB conditional results",
  "Resources": {
    "DeadLetters": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600,
        "SqsManagedSseEnabled": true
      }
    },
    "Jobs": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 180,
        "MessageRetentionPeriod": 86400,
        "SqsManagedSseEnabled": true,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetters",
              "Arn"
            ]
          },
          "maxReceiveCount": 3
        }
      }
    },
    "Results": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "operation_id",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "operation_id",
            "KeyType": "HASH"
          }
        ],
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "Worker": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "Runtime": "python3.13",
        "Handler": "worker.handler",
        "CodeUri": "src/",
        "Timeout": 30,
        "MemorySize": 128,
        "ReservedConcurrentExecutions": 2,
        "Environment": {
          "Variables": {
            "RESULT_TABLE": {
              "Ref": "Results"
            }
          }
        },
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:PutItem",
                  "dynamodb:GetItem"
                ],
                "Resource": {
                  "Fn::GetAtt": [
                    "Results",
                    "Arn"
                  ]
                }
              }
            ]
          }
        ],
        "Events": {
          "JobsEvent": {
            "Type": "SQS",
            "Properties": {
              "Queue": {
                "Fn::GetAtt": [
                  "Jobs",
                  "Arn"
                ]
              },
              "BatchSize": 10,
              "FunctionResponseTypes": [
                "ReportBatchItemFailures"
              ],
              "ScalingConfig": {
                "MaximumConcurrency": 2
              }
            }
          }
        }
      }
    },
    "WorkerLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${Worker}"
        },
        "RetentionInDays": 7
      }
    },
    "OldJobs": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "AlarmDescription": "Jobs older than 5 minutes; no notification destination configured in this lab",
        "Namespace": "AWS/SQS",
        "MetricName": "ApproximateAgeOfOldestMessage",
        "Dimensions": [
          {
            "Name": "QueueName",
            "Value": {
              "Fn::GetAtt": [
                "Jobs",
                "QueueName"
              ]
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 60,
        "EvaluationPeriods": 2,
        "Threshold": 300,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching"
      }
    },
    "DeadLetterAlarm": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "AlarmDescription": "Inspect poison/conflicting messages; no automatic redrive",
        "Namespace": "AWS/SQS",
        "MetricName": "ApproximateNumberOfMessagesVisible",
        "Dimensions": [
          {
            "Name": "QueueName",
            "Value": {
              "Fn::GetAtt": [
                "DeadLetters",
                "QueueName"
              ]
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 60,
        "EvaluationPeriods": 1,
        "Threshold": 0,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching"
      }
    }
  },
  "Outputs": {
    "QueueUrl": {
      "Value": {
        "Ref": "Jobs"
      }
    },
    "DLQUrl": {
      "Value": {
        "Ref": "DeadLetters"
      }
    },
    "TableName": {
      "Value": {
        "Ref": "Results"
      }
    },
    "FunctionName": {
      "Value": {
        "Ref": "Worker"
      }
    }
  }
}
